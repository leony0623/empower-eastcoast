2018-05-16", "title": "培訓課程記錄：田野調查資料之運用", "url": "/2018/07/1070516.html", "island": "I3", "type": "課程", "places": [], "people": ["黃懷軒"], "q": "2018 年課程為什麼要把田調資料轉成「故事線」？", "o": ["避免資料束之高閣，讓它能用在環境設計與部落藍圖", "為了參加文學獎", "為了取代族人口述", "為了減少田調次數"], "a": 0, "ex": "田調要轉成具備訊息、想法、情感、價值的故事線，避免報告束之高閣；前期企劃與族人共識最重要，講師也提醒觀光並非唯一出路，貿然行動可能失去部落原貌。", "k": "故事線", "d": "訊息、想法、情感、價值", "g": 2}, {"id": 84, "date": "2018-05-14", "title": "磯崎部落提案計畫工作記錄：磯崎－山興越嶺古道踏勘", "url": "/2018/05/107-04.html", "island": "I11", "type": "提案紀錄", "places": ["磯崎"], "people": ["陳科睿"], "q": "磯崎青年發起越嶺古道踏勘，怎麼把山林知識傳下去？", "o": ["拍成影片就好", "請登山社代為帶隊", "把古道鋪成水泥路", "長輩口述帶路、部落爸媽分工，並計畫每年豐年祭前帶青年營走古道"], "a": 3, "ex": "古道近 30 年無人往來，長輩口述並帶路，用折樹枝與紅繩標記，東管處與行遠團隊以 GPS 記錄；Emas 計畫每年豐年祭前以青年營走古道，把山林知識傳給青年。", "k": "青年營", "d": "每年豐年祭前的活動", "g": 3}, {"id": 85, "date": "2018-05", "title": "比西里岸部落提案計畫工作記錄（107年4月）", "url": "/2018/05/107-04_9.html", "island": "I5", "type": "提案紀錄", "places": ["比西里岸"], "people": [], "q": "比西里岸解說牌的立柱，怎麼做出在地特色？", "o": ["向外地訂購不鏽鋼柱", "用塑膠模型代替", "把定置網漁場常見的廢棄浮桶彩繪轉化，由木工師父參與刻製", "直接釘在路樹上"], "a": 2, "ex": "比西里岸海域有俗稱煙仔罾的定置網，解說牌立柱就用廢棄浮桶彩繪轉化；木工師父參與牌面刨切與刻字，讓解說牌和在地工藝技術結合。", "k": "浮桶", "d": "立柱的回收材料", "g": 2}, {"id": 86, "date": "2018-05", "title": "都蘭部落提案計畫工作記錄（107年4月）", "url": "/2018/05/107-04_86.html", "island": "I5", "type": "提案紀錄", "places": ["都蘭"], "people": [], "q": "都蘭修復聚會所茅草屋時，為什麼在室內設爐灶、用火煙燻竹天花？", "o": ["為了觀光表演", "爐灶是家的基本單元，煙燻還能減少蟲蛀", "為了取代電燈", "因為法規規定"], "a": 1, "ex": "巴蒂崮工作室盡量用傳統材料與工法，竹編天花並用老藤包柱；因為爐灶是家的構成基本單元，室內設火爐，並用火烤煙燻竹天花與牆面以減少蟲蛀。", "k": "爐灶", "d": "家的基本單元", "g": 2}, {"id": 87, "date": "2018-04-19", "title": "培訓課程記錄：如何辦理工作坊？", "url": "/2018/05/1070419.html", "island": "I1", "type": "課程", "places": [], "people": ["劉建億"], "q": "辦部落工作坊之前，劉建億老師說要先做好哪些前置工作？", "o": ["找關鍵人物、口語化理解環境、評估容易參與的人群、建立夥伴關係", "先印好成果手冊", "先決定改造方案再找人背書", "先買好施工材料"], "a": 0, "ex": "工作坊前要先找關鍵人物、口語化理解環境、評估易參與的人群並建立夥伴關係；形式可以是公民咖啡館、共煮共食、街區走讀或現地小改造，用來討論與嘗試部落藍圖。", "k": "關鍵人物", "d": "前置工作的第一步", "g": 2}, {"id": 88, "date": "2018-04-18", "title": "培訓課程記錄：部落藍圖操作實務", "url": "/2018/05/1070418.html", "island": "I5", "type": "課程", "places": [], "people": ["劉建億"], "q": "社區地圖的疊圖法怎麼做？", "o": ["一個人畫完全部", "只畫行政界線", "把所有資料寫在同一張紙", "便利貼分色、每人負責一類，再把各類圖層疊在一起找改善點"], "a": 3, "ex": "社區地圖是集體記憶的創作，範圍不必照行政界線；用便利貼分色、每人負責一類再疊圖，包括綠色資源、生活節點、故事記憶點與閒置髒亂空間，先畫現況再找三個點討論改善。", "k": "集體記憶", "d": "社區地圖的本質", "g": 2}, {"id": 89, "date": "2018-04-12", "title": "培訓課程紀錄：圖資平台運用工作坊", "url": "/2018/05/1070412.html", "island": "I5", "type": "工作坊", "places": [], "people": ["方思文", "郭倩如"], "q": "2018 年圖資工作坊說部落藍圖是什麼樣的規劃？", "o": ["一次性的活動企劃", "只規劃明年的觀光節慶", "思考未來 10 到 20 年的部落生活，從部落資源出發配置土地使用", "把部落改建成都市"], "a": 2, "ex": "部落藍圖是空間規劃，思考未來 10 至 20 年的部落生活，從部落資源出發配置土地；結合公開圖資與族人環境智慧，判斷居住、接待、發展與保護的適合區位，而部落共識是藍圖的基礎。", "k": "適合區位", "d": "居住、接待、發展、保護的位置", "g": 1}, {"id": 90, "date": "2018-04-11", "title": "東河部落提案計畫工作坊記錄（107年3月）", "url": "/2018/04/107-03.html", "island": "I5", "type": "提案紀錄", "places": ["東河"], "people": ["周欣宜"], "q": "東河提案把廢棄哨所改成「自己自己資訊站」，想達成什麼？", "o": ["改成販賣部增加收入", "打破「東河只有包子」的印象，作為青年參與部落經營的起點", "交給外地業者經營", "只是單純的拆除重建"], "a": 1, "ex": "東河部落青年階層以路徑博物館概念，把泰源舊橋南端的廢棄哨所改成旅遊資訊站，打破東河只有東河包子的印象，也作為青年參與部落經營的起點，並辦部落幫手教育訓練。", "k": "青年階層", "d": "提案的部落組織", "g": 3}, {"id": 91, "date": "2018-04-11", "title": "比西里岸部落提案計畫工作坊記錄（107年3月）", "url": "/2018/04/107-03_10.html", "island": "I5", "type": "提案紀錄", "places": ["比西里岸"], "people": ["林金成"], "q": "比西里岸 10 面解說牌，怎麼確保內容在地、後續有人維護？", "o": ["內容由各設置戶起稿，設置同意書附加周邊清潔維護條款", "請廣告公司撰寫", "做完就不管", "由遊客自由塗寫"], "a": 0, "ex": "兩次工作坊現勘討論解說牌的形式、工法、材料與位置；內容由各設置戶起稿，再由創意工坊彙整上網、以 QR code 連結，設置同意書也附加周邊環境清潔維護條款。", "k": "設置戶", "d": "解說牌內容的起稿者", "g": 3}, {"id": 92, "date": "2018-04-11", "title": "都蘭部落提案計畫工作坊記錄（107年3月）", "url": "/2018/04/107-03_51.html", "island": "I5", "type": "提案紀錄", "places": ["都蘭"], "people": ["布告．阿里"], "q": "都蘭在施作聚會所之前，先反覆討論了哪些事？", "o": ["只討論油漆顏色", "只討論開幕剪綵", "只討論誰來拍照", "空間使用計畫、施作配置與經營管理"], "a": 3, "ex": "都蘭重新思考老人暨青年聚會所對內對外的功能，保留長輩圍坐的火坑，並規劃放學後書屋與旅遊詢問站；施作前先把空間使用計畫、施作配置與經營管理反覆討論確認。", "k": "經營管理", "d": "施作前要談清楚的第三件事", "g": 2}, {"id": 93, "date": "2018-04-11", "title": "磯崎部落提案計畫工作坊記錄（107年3月）", "url": "/2018/04/10703.html", "island": "I5", "type": "提案紀錄", "places": ["磯崎"], "people": ["陳科睿"], "q": "磯崎可食地景花園施作時，怎麼讓部落媽媽成為主體？", "o": ["照設計圖施工，不能改", "請外地園藝公司施作", "先開說明會聽媽媽意見，施工中依她們的想法邊做邊調整", "完工後再通知媽媽"], "a": 2, "ex": "花園以飛魚與海浪為主題，用廢輪胎與廢魚網搭建；3 月 16 日說明會先聽部落媽媽意見，施工中依她們的想法邊做邊調整，三位媽媽是實際執行者，並延續換工傳統。", "k": "邊做邊調整", "d": "施工中的做法", "g": 2}, {"id": 94, "date": "2018-03-19", "title": "107年東海岸駐地研究員培訓課程招募說明會", "url": "/2018/03/107.html", "island": "I1", "type": "說明會", "places": [], "people": [], "q": "107 年說明會提出「從部落地圖到部落藍圖」，正確的路徑是？", "o": ["先畫藍圖 → 再補田調", "田調資料做成部落地圖 → 繪製中凝聚願景共識 → 轉化為藍圖", "直接拿政府的都市計畫圖來用", "由顧問公司代畫，再向部落說明"], "a": 1, "ex": "說明會強調凝聚、產生、執行共識：先把田調資料做成文字與圖繪的部落地圖，在繪製過程中凝聚願景共識，再轉化為藍圖；四個試做點也以協力換工帶鄰近部落參與。", "k": "部落地圖", "d": "藍圖之前要先完成的圖", "g": 2}, {"id": 95, "date": "2017-12-25", "title": "106年成果交流聯合分享會記錄：交流討論紀錄", "url": "/2017/12/106.html", "island": "I11", "type": "成果會", "places": ["磯崎"], "people": ["洪東濤", "張育銓", "郭倩如"], "q": "2017 年交流會上，處長說明為什麼要設駐地研究員？", "o": ["部落缺執行計畫的行政人力，各單位計畫缺總體平台，需要聯繫協調窗口", "為了增加公部門員額", "為了替部落寫所有報告", "為了管理遊客"], "a": 0, "ex": "處長指出部落缺執行計畫的行政人力，各單位計畫又缺總體平台，所以由駐地研究員擔任聯繫協調窗口；部落藍圖則建構經營的中心思想，指引資源投入的節奏。", "k": "中心思想", "d": "藍圖為部落經營建立的", "g": 1}, {"id": 96, "date": "2017-12-25", "title": "106年成果交流聯合分享會記錄：各部落分享重點摘要", "url": "/2017/12/106_24.html", "island": "I11", "type": "成果會", "places": ["都蘭", "東河"], "people": ["布告．阿里"], "q": "106 年各部落分享時，用哪三個面向報告，當作下一階段提案的起點？", "o": ["收入、支出、結餘", "人數、照片、影片", "景點、餐廳、民宿", "關鍵字、面臨的威脅、藍圖初步構想"], "a": 3, "ex": "各部落以關鍵字、面臨的威脅與藍圖初步構想報告，作為第二階段提案起點；靜浦公約經初擬、分組討論、彙整、部落會議後簽同意書，藍圖也要經部落會議形成共識。", "k": "同意書", "d": "靜浦公約最後簽的", "g": 2}, {"id": 97, "date": "2017-12", "title": "示範點遴選提案計畫徵件簡章", "url": "/2017/12/blog-post.html", "island": "I11", "type": "說明會", "places": [], "people": [], "q": "示範點遴選為什麼要求提案「從部落藍圖出發」？", "o": ["方便公部門統一發包", "藍圖只是格式要求", "由下而上提案，讓改造點放在部落整體藍圖裡，拉近公私的經營願景", "因為藍圖可以取代施工圖"], "a": 2, "ex": "示範點採由下而上提案，必須從部落藍圖出發、在地圖標示改造點，拉近公私部門對經營願景的認知；評分由駐地研究員互評與評審各占 50%，改造點要維護管理 5 年。", "k": "由下而上", "d": "提案的方向", "g": 1}, {"id": 98, "date": "2017-11-27", "title": "培訓課程記錄：吉拉米代部落觀摩小旅行", "url": "/2017/11/1061116.html", "island": "I4", "type": "參訪", "places": ["吉拉米代"], "people": ["雅各"], "q": "吉拉米代觀摩帶回什麼經營啟示？", "o": ["只要拿到認證就一勞永逸", "部落至少要有公約代表共識，也需要持續耕耘的人", "施工不必經過任何人同意", "水圳交給外包廠商就好"], "a": 1, "ex": "吉拉米代的文化景觀經營管理協會規定採砂或施工須經同意，六條水圳由 12 人輪流巡守；觀摩啟示是部落至少要有公約代表共識，也需要持續耕耘的人，認證則是逐年進步。", "k": "公約", "d": "代表區域共識的約定", "g": 3}, {"id": 99, "date": "2017-11-27", "title": "培訓課程記錄：環境智慧與觀察工作坊", "url": "/2017/11/1061106.html", "island": "I3", "type": "工作坊", "places": ["靜浦"], "people": ["羅永清"], "q": "CIPOLAN 文化桌遊用什麼方式盤點在地知識？", "o": ["玩中學：用年齡階層、野菜、禁忌、威脅、解決方法等色卡思辨部落困境", "考試排名", "背誦課本", "看影片寫心得"], "a": 0, "ex": "桌遊以八類色卡，包括年齡階層、可食野菜、禁忌、威脅與解決方法，讓族人玩中學、盤點與思辨在地知識；桌遊授權給靜浦，族人持續田調。", "k": "玩中學", "d": "桌遊的學習方式", "g": 2}, {"id": 100, "date": "2017-11-13", "title": "培訓課程記錄：路徑博物館的實踐，與聰明守護環境景觀", "url": "/2017/11/106110203.html", "island": "I5", "type": "課程", "places": ["靜浦", "都歷"], "people": ["歐祥權"], "q": "路徑博物館的「如實記錄」要寫下哪五個面向？", "o": ["價格、折扣、營業時間、電話、地址", "人數、性別、年齡、職業、收入", "天氣、溫度、濕度、風向、雨量", "看到什麼、感受、在哪裡看、隱藏的故事、變化的預測"], "a": 3, "ex": "路徑博物館源自國家公園的自然研究路，步驟是環境觀察、點的如實記錄、線的路徑串連、面的遊程全貌；記錄要寫看到什麼、感受、在哪看、隱藏的故事與變化預測。", "k": "變化預測", "d": "五面向的最後一項", "g": 2}, {"id": 101, "date": "2017-10-23", "title": "培訓課程與上課資料：部落旅遊經營與部落藍圖建構", "url": "/2017/10/1061020.html", "island": "I5", "type": "課程", "places": ["都歷"], "people": ["鄧浩"], "q": "鄧浩老師說，部落經營觀光、建構藍圖的關鍵是什麼？", "o": ["做一個最搶眼的入口意象", "複製熱門景點的設施", "成為善於訴說自身故事的人，設計回到自然特徵與文化根源", "把景點集中搬到一起"], "a": 2, "ex": "部落要改善經濟與生活環境、展現自明性，就要成為善於訴說自身故事的人；設計應回到大自然特徵與文化根源，用路徑博物館以道路串連分散景點，而不是做搶眼的入口意象。", "k": "自明性", "d": "部落獨特的樣子", "g": 1}, {"id": 102, "date": "2017-10-23", "title": "培訓課程記錄與補充資料：永續旅遊準則", "url": "/2017/10/1061019.html", "island": "I2", "type": "課程", "places": [], "people": ["陳盈潔"], "q": "第一堂永續旅遊準則課提醒「顧不到生計，其他永續工作難推動」，是因為？", "o": ["賺錢最重要，可以先犧牲生態", "永續旅遊要同時平衡生態環境、社會文化與社區經濟", "永續只看環保就好", "準則只適用大型企業"], "a": 1, "ex": "綠色旅行加責任旅行等於永續旅行，要平衡生態環境、社會文化與社區經濟；講師請駐地研究員從 SDGs 挑出三項、寫下社區願景，再帶回部落分享落實。", "k": "社區經濟", "d": "永續三面向之一，和生計有關", "g": 1}], "goals": {"1": "為什麼：駐地研究員與永續藍圖", "2": "方法學：規劃・發展・檢討・精進", "3": "永續治理：組織・人才・共管"}, "qbank": [{"id": 1001, "island": "I1", "title": "為何要有駐地", "url": "/2017/12/106.html", "src": 95, "srcTitle": "106年成果交流聯合分享會記錄：交流討論紀錄", "type": "題", "date": "", "q": "東管處為什麼需要「駐地研究員」這個角色？", "o": ["部落缺行政人力，計畫也缺整合窗口", "部落人口太少，需要外部人力接手經營", "公部門想直接掌握部落的觀光資源", "補助太多，需要有人專門監督核銷"], "a": 0, "ex": "部落常缺執行計畫的行政人力，各單位的計畫又各做各的、缺少總體平台；駐地研究員就是部落與公部門之間的協調窗口，讓資源能接得上。", "k": "協調窗口", "d": "部落與公部門之間的角色", "g": 1, "places": [], "people": []}, {"id": 1002, "island": "I1", "title": "藍圖的用處", "url": "/2017/12/106.html", "src": 95, "srcTitle": "106年成果交流聯合分享會記錄：交流討論紀錄", "type": "題", "date": "", "q": "對部落來說，部落藍圖最主要的作用是什麼？", "o": ["建立經營方向，掌握資源投入的先後", "列出所有需求清單，一次申請最多的補助款", "畫成海報，拿來對外宣傳觀光", "當成結案附件，交差給主管機關"], "a": 0, "ex": "藍圖幫部落建立經營的中心思想，知道自己要往哪裡走；有了它，外部資源進來時才知道先做什麼、後做什麼，掌握投入的節奏。", "k": "中心思想", "d": "藍圖幫部落建立的", "g": 1, "places": [], "people": []}, {"id": 1003, "island": "I1", "title": "過程比經費重要", "url": "/2017/12/106.html", "src": 95, "srcTitle": "106年成果交流聯合分享會記錄：交流討論紀錄", "type": "題", "date": "", "q": "推動示範點時，為什麼說「重點不是經費怎麼分，而是操作的過程」？", "o": ["經費少，分一分各部落也拿不到多少", "部落在討論與施作中學會自己經營", "公部門已經決定好經費的用途", "怕分配不均，乾脆不談錢比較省事"], "a": 1, "ex": "如果只把資源分配下去，計畫結束後很難延續；讓部落自主討論、做中學，在操作過程中凝聚共識與能力，成果才留得住。", "k": "操作過程", "d": "比分配經費更重要的事", "g": 1, "places": [], "people": []}, {"id": 1004, "island": "I1", "title": "陪伴的節奏", "url": "/2017/12/106.html", "src": 95, "srcTitle": "106年成果交流聯合分享會記錄：交流討論紀錄", "type": "題", "date": "", "q": "駐地研究員和部落一起工作，應該抱持什麼樣的時間觀？", "o": ["計畫期間密集進駐，結案就撤出", "不能速成，要長時間陪伴累積互信", "先衝出亮眼成果，再慢慢建立關係", "以年度為單位，每年換一批部落"], "a": 1, "ex": "部落的信任與共識需要時間累積，駐地研究員計畫是不能速成的長時間陪伴；急著交成果，反而容易讓部落覺得被利用。", "k": "長時間陪伴", "d": "駐地工作的時間觀", "g": 1, "places": [], "people": []}, {"id": 1005, "island": "I1", "title": "目的地與停留點", "url": "/2017/12/106.html", "src": 95, "srcTitle": "106年成果交流聯合分享會記錄：交流討論紀錄", "type": "題", "date": "", "q": "「讓部落成為目的地，而不是停留點」是什麼意思？", "o": ["遊客專程前來、停留並深入認識部落", "沿路多設休息站，讓遊客方便停車", "把遊客集中到大型景點，減少干擾", "增加打卡點，讓更多人路過拍照"], "a": 0, "ex": "停留點只是路過拍照、消費少又帶來干擾；成為目的地則是遊客專程前來、停留並認識部落，觀光的好處才能真正留在部落。", "k": "目的地", "d": "遊客專程要去的地方", "g": 1, "places": [], "people": []}, {"id": 1006, "island": "I1", "title": "尊重部落流程", "url": "/2017/12/106.html", "src": 95, "srcTitle": "106年成果交流聯合分享會記錄：交流討論紀錄", "type": "題", "date": "", "q": "駐地研究員要和部落討論事情時，最重要的原則是？", "o": ["找最有影響力的人，先私下敲定", "公部門先擬好完整方案，再請部落出面背書", "透過部落窗口，走部落自己的決策流程", "召開公開說明會，現場表決通過"], "a": 2, "ex": "部落事務要經過部落流程，透過部落窗口聯繫，例如從窗口、頭目顧問到青年階層與部落會議逐層討論；人與人之間的互信，是溝通的基礎。", "k": "部落流程", "d": "部落自己的決策程序", "g": 3, "places": [], "people": []}, {"id": 1007, "island": "I1", "title": "觸媒角色", "url": "/2022/11/111-112.html", "src": 52, "srcTitle": "111-112年計畫：駐地研究員招募說明會", "type": "題", "date": "", "q": "在部落經營討論中，駐地研究員比較像哪一種角色？", "o": ["代表部落拍板，加快決策的速度", "負責考核部落，給各項表現打分數", "在旁觀察紀錄，盡量不介入討論", "引發大家討論，串起夥伴並回饋部落"], "a": 3, "ex": "藍圖的重點是共同討論永續觀光、釐清經營能量與行動機制；駐地研究員是觸媒，負責引發討論、串起夥伴，而不是替部落做決定。", "k": "觸媒", "d": "引發反應但不取代主角", "g": 1, "places": [], "people": []}, {"id": 1008, "island": "I1", "title": "雙向溝通平台", "url": "/2022/11/111-112.html", "src": 52, "srcTitle": "111-112年計畫：駐地研究員招募說明會", "type": "題", "date": "", "q": "東管處的「部落窗口」同仁，主要在做什麼？", "o": ["收發公文，確保部落按期繳交報告", "出事時出面處理，平時不必聯絡", "帶回部落需求，也帶進可協力的資源", "代替部落向上級爭取更多經費"], "a": 2, "ex": "東管處每位部落窗口同仁負責對接一個部落，搭起雙向溝通的平台：把部落的需求帶回機關，也把可以協力的資源帶進部落。", "k": "雙向溝通", "d": "窗口同仁搭起的平台", "g": 3, "places": [], "people": []}, {"id": 1009, "island": "I1", "title": "搭橋造路", "url": "/2020/09/109-09-09-3.html", "src": 71, "srcTitle": "公部門為何需要做參與？", "type": "題", "date": "", "q": "公部門參與社區的步驟裡，最終要達成的目標是？", "o": ["搭橋造路，建立長期溝通的管道", "辦一場隆重的說明會，宣布政策", "完成蹲點報告，提交給長官審閱", "找到支持者，請他們幫忙背書"], "a": 0, "ex": "公部門參與社區的步驟是轉變概念、調查理解、製造接觸、工作蹲點，最重要的是搭橋造路；管道建立起來，後續的合作才走得下去。", "k": "搭橋造路", "d": "參與步驟的最終目標", "g": 2, "places": [], "people": []}, {"id": 1010, "island": "I1", "title": "公部門為何參與", "url": "/2020/09/109-09-09-3.html", "src": 71, "srcTitle": "公部門為何需要做參與？", "type": "題", "date": "", "q": "公部門為什麼需要親自參與社區？", "o": ["及早發掘問題，減少錯誤並回應需求", "讓長官看到基層有在做事", "讓社區不再需要自己動手", "把責任分攤給社區，降低公部門自己的風險"], "a": 0, "ex": "公部門參與社區可以降低出錯率、及早發掘問題並引導轉變，也更能回應真正的公共需求；講者說，先參與社區，才能引導社區參與。", "k": "出錯率", "d": "參與可以降低的東西", "g": 1, "places": [], "people": []}, {"id": 1011, "island": "I1", "title": "誰該參與規劃", "url": "/2020/09/109-09-09-2.html", "src": 72, "srcTitle": "一起來認識「參與式規劃設計」", "type": "題", "date": "", "q": "參與式規劃最重要的精神是什麼？", "o": ["讓未來使用者與利害關係人一起參與", "由專家獨立完成，效率最高也最專業", "只找有決策權的人，以免意見太多", "聽取多數人的意見，少數就不必管"], "a": 0, "ex": "參與式規劃要把未來的使用者與利害關係人一起納入，集眾人之智；這樣做出來的方案才合用，大家也才願意一起維護。", "k": "利害關係人", "d": "受影響、也該參與的人", "g": 2, "places": [], "people": []}, {"id": 1012, "island": "I1", "title": "參與式規劃流程", "url": "/2020/09/109-09-09-2.html", "src": 72, "srcTitle": "一起來認識「參與式規劃設計」", "type": "題", "date": "", "q": "參與式規劃的操作順序，哪一個最合理？", "o": ["參考案例→設計圖面→找人背書→發包施工", "盤點觀察→釐清問題→找癥結→方案→行動", "申請經費→決定題目→辦理結案", "參考案例→直接複製→再做宣傳"], "a": 1, "ex": "參與式規劃先盤點人文地產景、做田野觀察，再釐清問題意識、找出原因癥結，接著提出方案；最後大家一起行動，不是交給別人做。", "k": "原因癥結", "d": "問題背後真正的根源", "g": 2, "places": [], "people": []}, {"id": 1013, "island": "I1", "title": "民間先行", "url": "/2020/08/1_31.html", "src": 75, "srcTitle": "暖身共識課程1－公私夥伴關係建構", "type": "題", "date": "", "q": "建立公私夥伴關係，課程建議的起手式是？", "o": ["政府編好預算，民間再配合", "政府主導全程，民間負責執行", "民間先行，政府再加碼跟上", "雙方簽好合約，才開始行動"], "a": 2, "ex": "與其等待政府資源，不如先想想不靠政府能先做什麼；民間先行、做出一點成果，政府再加碼跟上，夥伴關係就自然建立起來。", "k": "民間先行", "d": "夥伴關係的起手式", "g": 3, "places": [], "people": []}, {"id": 1014, "island": "I1", "title": "從基層開始", "url": "/2020/08/1_31.html", "src": 75, "srcTitle": "暖身共識課程1－公私夥伴關係建構", "type": "題", "date": "", "q": "和公部門建立合作關係，比較有效的做法是？", "o": ["直接找首長簽訂合作備忘錄，再由上往下推動", "先和基層承辦建立關係，用小活動合作", "一開始就提大型計畫，展現誠意", "透過民意代表協調，比較有力量"], "a": 1, "ex": "合作往往從人開始：先和公部門的基層人員建立關係，再用小型活動觸發合作、累積互信，比一開始就談大計畫更容易成功。", "k": "基層人員", "d": "合作關係最先要接觸的對象", "g": 3, "places": [], "people": []}, {"id": 1015, "island": "I1", "title": "工作坊前置", "url": "/2018/05/1070419.html", "src": 87, "srcTitle": "培訓課程記錄：如何辦理工作坊？", "type": "題", "date": "", "q": "辦部落工作坊之前，應該先做好哪些前置工作？", "o": ["先印好精美成果手冊，讓大家對成果有所期待", "找關鍵人物、了解環境、建立夥伴關係", "先決定方案，再找人到場背書", "先採購材料，現場直接動手做"], "a": 1, "ex": "工作坊前要先找關鍵人物、用口語化的方式理解環境、評估哪些人容易參與，並建立夥伴關係；準備做足，討論才會有人來、有人說。", "k": "關鍵人物", "d": "前置工作的第一步", "g": 2, "places": [], "people": []}, {"id": 1016, "island": "I1", "title": "工作坊形式", "url": "/2018/05/1070419.html", "src": 87, "srcTitle": "培訓課程記錄：如何辦理工作坊？", "type": "題", "date": "", "q": "想讓居民對一塊閒置空地產生想像，哪一種工作坊形式最合適？", "o": ["發放問卷，統計大家的意見", "召開正式會議，逐項表決", "走讀、大地遊戲或現地小改造", "播放外地案例，請大家參考"], "a": 2, "ex": "工作坊形式要依目的挑選：討論議題用公民咖啡館，凝聚感情用共煮共食；想讓人對空間有想像，就用空間擾動或手作，例如走讀、粉筆大地遊戲或現地小改造。", "k": "空間擾動", "d": "讓人對空間產生想像的方法", "g": 2, "places": [], "people": []}, {"id": 1017, "island": "I1", "title": "從地圖到藍圖", "url": "/2018/03/107.html", "src": 94, "srcTitle": "107年東海岸駐地研究員培訓課程招募說明會", "type": "題", "date": "", "q": "「從部落地圖到部落藍圖」的過程中，共識是怎麼一步步形成的？", "o": ["主辦單位整理好共識，直接宣布", "凝聚共識、產生共識，再執行共識", "發放問卷，以多數票決定共識", "先動手施作，共識自然會出現"], "a": 1, "ex": "先把田調資料做成部落地圖，在繪製過程中凝聚願景；接著產生具體的共識，再一起執行共識，藍圖才會是大家的藍圖。", "k": "執行共識", "d": "共識三階段的最後一步", "g": 2, "places": [], "people": []}, {"id": 1018, "island": "I1", "title": "設施減量", "url": "/2017/12/blog-post.html", "src": 97, "srcTitle": "示範點遴選提案計畫徵件簡章", "type": "題", "date": "", "q": "示範點改造時，東管處強調哪個原則？", "o": ["設施要齊全，才能吸引遊客停留", "先蓋地標建築，打開知名度", "設施減量、大地景優先，做中學", "參考熱門景點，複製成功設計"], "a": 2, "ex": "示範點強調設施減量、大地景優先，讓自然與文化本身說話；並用做中學的方式，讓部落邊做邊學、邊調整，而不是一次蓋好大型設施。", "k": "設施減量", "d": "改造時對設施的態度", "g": 2, "places": [], "people": []}, {"id": 1019, "island": "I2", "title": "永續三面向", "url": "/2017/10/1061019.html", "src": 102, "srcTitle": "培訓課程記錄與補充資料：永續旅遊準則", "type": "題", "date": "", "q": "永續旅遊要平衡的三個面向是？", "o": ["生態環境、社會文化、社區經濟", "交通便利、住宿品質、餐飲特色", "產品價格、銷售通路、行銷宣傳", "硬體設施、人力配置、經費預算"], "a": 0, "ex": "永續旅遊要同時平衡生態環境、社會文化與社區經濟；講師提醒，顧不到生計，其他永續工作也很難推動。", "k": "社區經濟", "d": "和生計有關的那一面", "g": 1, "places": [], "people": []}, {"id": 1020, "island": "I2", "title": "目標與態度", "url": "/2020/08/1.html", "src": 74, "srcTitle": "部落經營基礎課程1－永續旅行概論", "type": "題", "date": "", "q": "下面哪一句最接近「永續旅遊」的意思？", "o": ["一種強調生態導覽的特定遊程", "一種目標與態度，不是特定遊程", "一種價格較高的精緻旅遊方式", "一種只跟環保有關的旅遊認證"], "a": 1, "ex": "永續旅遊不是某種遊程，而是一種目標與態度：善待當地人、深入生活文化，讓旅客得到好經驗的同時，當地也能獲利，是雙贏的責任旅遊。", "k": "目標與態度", "d": "永續旅遊不是遊程，而是……", "g": 1, "places": [], "people": []}, {"id": 1021, "island": "I2", "title": "責任旅行", "url": "/2017/10/1061019.html", "src": 102, "srcTitle": "培訓課程記錄與補充資料：永續旅遊準則", "type": "題", "date": "", "q": "「綠色旅行＋＿＿＝永續旅行」，空格應該填什麼？", "o": ["責任旅行", "深度旅行", "豪華旅行", "慢活旅行"], "a": 0, "ex": "綠色旅行加上責任旅行，等於永續旅行；它指的是對造訪的這個地方負責，包括尊重文化、支持在地，以及減少干擾。", "k": "責任旅行", "d": "對造訪地負責的旅行", "g": 1, "places": [], "people": []}, {"id": 1022, "island": "I2", "title": "業者回饋", "url": "/2017/10/1061019.html", "src": 102, "srcTitle": "培訓課程記錄與補充資料：永續旅遊準則", "type": "題", "date": "", "q": "業者進入熱門的部落景點時，永續的關鍵之一是？", "o": ["業者是否回饋地方", "業者是否壓低售價", "業者是否大量宣傳", "業者是否擴大規模"], "a": 0, "ex": "外來業者帶客進入熱門地點，若只賺錢不回饋，部落只承受干擾；業者是否回饋地方，是判斷旅遊是否永續的關鍵之一。", "k": "回饋地方", "d": "業者對部落應有的作為", "g": 3, "places": [], "people": []}, {"id": 1023, "island": "I2", "title": "盤點影響", "url": "/2020/08/1.html", "src": 74, "srcTitle": "部落經營基礎課程1－永續旅行概論", "type": "題", "date": "", "q": "用黃色便利貼寫好處、紅色寫不舒服的現象之後，下一步該做什麼？", "o": ["保留好處、把不舒服的移除", "統計票數、選出前三名執行", "整理成報告，交給公部門決定", "盤點資源、評估衝擊、擬定策略"], "a": 3, "ex": "先誠實盤點觀光帶來的好處與不舒服，再盤點重要資源、評估衝擊、擬定策略；例如旺季採集影響生態，淡季就讓它復育。", "k": "評估衝擊", "d": "盤點之後要做的分析", "g": 2, "places": [], "people": []}, {"id": 1024, "island": "I2", "title": "推估承載量", "url": "/2020/11/blog-post_3.html", "src": 61, "srcTitle": "永續旅行準則實務工作坊", "type": "題", "date": "", "q": "部落怎麼推估自己能接待多少遊客？", "o": ["參考去年遊客人數，再依成長率往上增加估算", "依解說員、床位等接待能量推估", "看網路聲量與社群按讚數", "不設上限，人越多越熱鬧"], "a": 1, "ex": "接待量要依部落真實的能量來估，例如解說員人數、床位數與場地條件，推估出承載量；超過這個上限，品質與生活都會受影響。", "k": "承載量", "d": "能接待的遊客上限", "g": 2, "places": [], "people": []}, {"id": 1025, "island": "I2", "title": "遊客公約", "url": "/2020/11/blog-post_3.html", "src": 61, "srcTitle": "永續旅行準則實務工作坊", "type": "題", "date": "", "q": "想讓遊客遵守部落規範，比較好的做法是？", "o": ["發現違規時，當場開罰示警", "訂遊客公約，用圖卡影片說明", "貼上禁止標語，不必多做說明", "請遊客簽切結書，責任自負"], "a": 1, "ex": "與其事後責備，不如事先溝通：訂定遊客公約，再用圖卡、影片把行為規範清楚傳達，遊客知道為什麼，就比較願意配合。", "k": "遊客公約", "d": "寫給遊客的約定", "g": 2, "places": [], "people": []}, {"id": 1026, "island": "I2", "title": "社區型旅遊", "url": "/2020/11/blog-post_3.html", "src": 61, "srcTitle": "永續旅行準則實務工作坊", "type": "題", "date": "", "q": "社區型旅遊（CBT）常見的經營型態是？", "o": ["居民的副業，由在地解說員帶領", "財團投資經營，居民擔任員工", "居民辭職投入，全職經營觀光", "政府全額補助，社區負責接待"], "a": 0, "ex": "社區型旅遊多半是居民的副業與補充收入，由在地解說員帶領遊客認識社區；觀光不取代原本的生活，而是為生活加分。", "k": "社區型旅遊", "d": "CBT 的中文", "g": 3, "places": [], "people": []}, {"id": 1027, "island": "I2", "title": "量少質精", "url": "/2020/11/blog-post_3.html", "src": 61, "srcTitle": "永續旅行準則實務工作坊", "type": "題", "date": "", "q": "推動永續旅遊後遊客變少，收入卻沒有減少，說明了什麼？", "o": ["遊客越少越好，應該限制觀光", "統計方法有誤，數據不可信", "重點是品質與價值，不是人數", "收入多寡和遊客人數無關"], "a": 2, "ex": "帛琉推動永續旅遊後，遊客減少約兩成多，年收入卻沒有減少；這說明了追求高品質、高價值的旅遊，比單純衝高人數更能兼顧環境與生計。", "k": "人數", "d": "永續旅遊不追求的數字", "g": 1, "places": [], "people": []}, {"id": 1028, "island": "I2", "title": "GSTC 四面向", "url": "/2022/11/blog-post.html", "src": 50, "srcTitle": "培訓課程：那些被隱藏的永續意涵－永續旅行概論", "type": "題", "date": "", "q": "國際永續旅遊準則（GSTC）的四大面向是？", "o": ["交通運輸、住宿品質、餐飲特色、購物環境", "國內、國際、線上、線下", "硬體、軟體、人力、經費", "經營管理、社會經濟、文化、環境"], "a": 3, "ex": "GSTC 準則分為 A 有效的永續經營管理、B 在地社會經濟效益、C 文化遺產效益、D 環境效益；部落可以逐項對照，找出已經在做與還能做的事。", "k": "永續經營管理", "d": "GSTC 的 A 面向", "g": 2, "places": [], "people": []}, {"id": 1029, "island": "I2", "title": "居民參與回饋", "url": "/2022/11/blog-post.html", "src": 50, "srcTitle": "培訓課程：那些被隱藏的永續意涵－永續旅行概論", "type": "題", "date": "", "q": "GSTC 準則中「在地居民參與及回饋」，在駐地工作中可以怎麼落實？", "o": ["請村長代表全體表示意見", "由公部門公告後請大家配合", "委託外部顧問代為處理", "邀族人一起參與藍圖討論"], "a": 3, "ex": "準則 A5 強調在地居民參與及回饋；落實到駐地工作，就是擴大駐地研究員與族人的連結，邀請更多族人一起參與部落藍圖的討論。", "k": "在地居民參與", "d": "GSTC A5 的主題", "g": 1, "places": [], "people": []}, {"id": 1030, "island": "I2", "title": "收益留在部落", "url": "/2022/11/blog-post.html", "src": 50, "srcTitle": "培訓課程：那些被隱藏的永續意涵－永續旅行概論", "type": "題", "date": "", "q": "想讓觀光收益留在部落、支持社區發展，可以怎麼做？", "o": ["地產地消，提撥收入為公積金", "收入交給帶團業者統一運用", "收入全部投入宣傳與行銷", "收益流向由各店家自行決定"], "a": 0, "ex": "準則 B4 支持社區發展：可以共商地產地消的營運模式，讓食材與服務在地供應，並把部分旅遊收入提撥為部落公積金，回饋公共事務。", "k": "地產地消", "d": "在地生產、在地消費", "g": 3, "places": [], "people": []}, {"id": 1031, "island": "I2", "title": "解說要真實", "url": "/2022/11/blog-post.html", "src": 50, "srcTitle": "培訓課程：那些被隱藏的永續意涵－永續旅行概論", "type": "題", "date": "", "q": "建立部落解說牌與指標系統時，準則特別提醒要注意什麼？", "o": ["字體的大小", "內容的真實性", "數量的多寡", "用語的流行"], "a": 1, "ex": "準則 C7 景點解說提醒：建立解說資訊與指標系統時要注意內容的真實性，不為了吸睛而編故事，也可以結合傳統工藝來呈現。", "k": "真實性", "d": "解說內容最重要的品質", "g": 2, "places": [], "people": []}, {"id": 1032, "island": "I2", "title": "自然景點管理", "url": "/2022/11/blog-post.html", "src": 50, "srcTitle": "培訓課程：那些被隱藏的永續意涵－永續旅行概論", "type": "題", "date": "", "q": "面對遊客對自然景點的衝擊，準則建議的作法包括？", "o": ["全面封閉景點，不再讓任何遊客進入以免破壞", "完全開放，讓遊客自由探索", "多放垃圾桶，增加清潔人力", "監控衝擊、訂行為守則、培訓解說員"], "a": 3, "ex": "準則 D2 自然景點的遊客管理：監控遊客量與行為對景點的衝擊，制定遊客行為守則，並培訓解說員在現場引導。", "k": "行為守則", "d": "給遊客的行為規範", "g": 2, "places": [], "people": []}, {"id": 1033, "island": "I2", "title": "SDGs 與觀光", "url": "/2022/11/blog-post.html", "src": 50, "srcTitle": "培訓課程：那些被隱藏的永續意涵－永續旅行概論", "type": "題", "date": "", "q": "聯合國 17 項永續發展目標（SDGs）中，哪些和觀光有關？", "o": ["每一項都能和觀光連結", "只有經濟成長那一項", "只有海洋生態那一項", "只有夥伴關係那一項"], "a": 0, "ex": "直覺上會想到就業、責任消費、海洋生態，但其實每一項都能與觀光連結，例如旅遊就業可以為婦女賦權、公私夥伴可以一起推動永續。", "k": "每一項", "d": "SDGs 與觀光有關的數量", "g": 1, "places": [], "people": []}, {"id": 1034, "island": "I2", "title": "與在地知識接軌", "url": "/2022/11/blog-post.html", "src": 50, "srcTitle": "培訓課程：那些被隱藏的永續意涵－永續旅行概論", "type": "題", "date": "", "q": "國際永續準則要在部落真正推動，最關鍵的是什麼？", "o": ["把準則翻譯後貼在部落公布欄", "要求族人熟記準則的每一條", "讓準則與在地知識體系對話接軌", "先取得國際認證，再談在地化"], "a": 2, "ex": "永續準則是普世價值，但要和在地知識體系對話接軌，才有持續推動的能量；把準則轉成部落聽得懂、做得到的事，正是駐地研究員的使命。", "k": "在地知識體系", "d": "準則需要對話的對象", "g": 1, "places": [], "people": []}, {"id": 1035, "island": "I2", "title": "GTS 標章", "url": "/2022/11/111-112-gts.html", "src": 51, "srcTitle": "111-112年計畫：潛力 GTS 綠色旅行標章業者輔導招募說明會", "type": "題", "date": "", "q": "GTS 綠色旅行標章對部落小型業者友善的地方是？", "o": ["免審查，繳交年費後即可直接取得並使用標章", "第二方稽核，門檻低並有顧問陪伴", "業者自我評估，自行宣告取得", "第三方國際稽核，費用最高"], "a": 1, "ex": "GTS 依循 GSTC 準則、採第二方獨立稽核，門檻與費用都低於國際第三方認證；顧問會陪業者填寫監控表格，讓永續一步步落實到經營。", "k": "第二方", "d": "GTS 的稽核方式", "g": 2, "places": [], "people": []}, {"id": 1036, "island": "I2", "title": "部落價值系統", "url": "/2022/11/blog-post_8.html", "src": 49, "srcTitle": "培訓課程：那些被隱藏的永續意涵－部落的價值系統", "type": "題", "date": "", "q": "為什麼地方振興不能只套用一般計畫的 SOP？", "o": ["SOP 的費用太高，部落規模太小負擔不起", "SOP 都是國外引進，不合國情", "部落不需要規劃，順其自然就好", "SOP 常缺少地方，計畫結束就停擺"], "a": 3, "ex": "很多 SOP 要求學會資本主義的邏輯才能操作，為計畫而計畫，計畫結束振興也就結束，甚至造成分裂；以部落的價值系統為核心，才能長久。", "k": "價值系統", "d": "部落運作背後的那套規則", "g": 3, "places": [], "people": []}, {"id": 1037, "island": "I3", "title": "田調三層次", "url": "/2021/05/blog-post_18.html", "src": 58, "srcTitle": "如何進行田野調查", "type": "題", "date": "", "q": "田野調查的三個層次依序是？", "o": ["拍照紀錄→上傳雲端→社群分享", "訪問耆老→錄音存檔→結案報告", "蒐集文獻→抄寫整理→出版印刷", "問題意識→田調架構→應用轉譯"], "a": 3, "ex": "田調先有問題意識，例如文化缺乏保存或工藝失傳；再建立田調架構，最後把成果應用轉譯成教案、走讀路線或產品。", "k": "問題意識", "d": "田調的起點", "g": 2, "places": [], "people": []}, {"id": 1038, "island": "I3", "title": "整理與提案", "url": "/2021/05/blog-post_18.html", "src": 58, "srcTitle": "如何進行田野調查", "type": "題", "date": "", "q": "田調工作中，內容整理和創意提案的比重大約是？", "o": ["整理約九成，提案只占一成", "整理約三成，七成在創意提案", "整理和提案各占一半", "全部心力都放在整理資料"], "a": 1, "ex": "地方內容的整理只占約 30%，大部分心力應放在怎麼把它變成創意提案；田調的價值在於被使用，而不是被收藏。", "k": "創意提案", "d": "田調七成心力該放的地方", "g": 2, "places": [], "people": []}, {"id": 1039, "island": "I3", "title": "準備訪綱", "url": "/2021/05/blog-post_18.html", "src": 58, "srcTitle": "如何進行田野調查", "type": "題", "date": "", "q": "訪談前準備訪綱，比較好的做法是？", "o": ["不準備問題，現場隨興聊比較自然", "只準備一個大問題，讓對方自由發揮", "把問題都設計成是非題，方便統計", "依主題、子題、細項列表並預想追問"], "a": 3, "ex": "訪綱可以用表格整理主題、子題與細項問題，訪前先預想延伸問題；有架構才不會漏問，也能在現場靈活追問。", "k": "訪綱", "d": "訪談前準備的問題清單", "g": 2, "places": [], "people": []}, {"id": 1040, "island": "I3", "title": "找受訪者", "url": "/2021/05/blog-post_18.html", "src": 58, "srcTitle": "如何進行田野調查", "type": "題", "date": "", "q": "不知道該訪問誰的時候，可以怎麼做？", "o": ["在路上隨機詢問，增加樣本數", "請在地人推薦，再透過人脈逐層拓展", "只訪問自己熟識的人，比較好溝通", "上網搜尋知名人士，主動邀約"], "a": 1, "ex": "可以先請里長或在地熟悉的人推薦受訪者，再從受訪者的人脈逐層拓展；一位耆老往往會帶出下一位重要的報導人。", "k": "逐層拓展", "d": "找受訪者的滾動方式", "g": 2, "places": [], "people": []}, {"id": 1041, "island": "I3", "title": "現場分工", "url": "/2021/05/blog-post_18.html", "src": 58, "srcTitle": "如何進行田野調查", "type": "題", "date": "", "q": "田野訪談現場，團隊比較好的分工是？", "o": ["一個人包辦，比較不會打擾對方", "每個人都用手機各自拍攝", "分工負責筆記、側拍、錄音錄影", "只錄音就好，不必另做筆記"], "a": 2, "ex": "訪談現場最好兩到三人分工，分別負責文字筆記、側拍與錄音錄影；訪問者才能專心傾聽，紀錄也比較完整。", "k": "側拍", "d": "記錄現場畫面的工作", "g": 2, "places": [], "people": []}, {"id": 1042, "island": "I3", "title": "田調倫理", "url": "/2021/05/blog-post_18.html", "src": 58, "srcTitle": "如何進行田野調查", "type": "題", "date": "", "q": "田調資料要公開或使用前，應該先做什麼？", "o": ["先徵得當事人同意，並回饋採集對象", "越快公開越好，讓更多人知道", "整理成書出版，增加曝光機會", "只要清楚註明出處，就可以自由公開使用"], "a": 0, "ex": "田調是借用別人的知識與記憶：公開資料前要先詢問當事人，成果也要回饋採集對象；尊重與回饋，才能建立長久的信任。", "k": "當事人", "d": "公開前要先問的人", "g": 3, "places": [], "people": []}, {"id": 1043, "island": "I3", "title": "整理與補訪", "url": "/2021/05/blog-post_18.html", "src": 58, "srcTitle": "如何進行田野調查", "type": "題", "date": "", "q": "訪談結束後，資料整理的好習慣是？", "o": ["錄音存檔即可，需要時再聽", "依時間建檔、比對文件，再補訪確認", "憑記憶直接寫成報告，比較能保留現場的感受", "刪掉不確定的內容，避免出錯"], "a": 1, "ex": "訪談後要依日期時間建立檔案，與文獻文件比對；遇到矛盾或不清楚的地方，再回去訪談確認，資料才可靠。", "k": "文件比對", "d": "整理時要對照的資料", "g": 2, "places": [], "people": []}, {"id": 1044, "island": "I3", "title": "故事線要件", "url": "/2018/07/1070516.html", "src": 83, "srcTitle": "培訓課程記錄：田野調查資料之運用", "type": "題", "date": "", "q": "把田調資料轉成「故事線」，需要具備哪四個要件？", "o": ["訊息、想法、情感、價值", "人物、地點、時間、金額", "標題、內文、圖片、連結", "開頭、高潮、轉折、結尾"], "a": 0, "ex": "故事線要有訊息、想法、情感與價值，才能打動人；這樣田調資料就不會成為束之高閣的報告，而能用在環境設計與藍圖上。", "k": "故事線", "d": "把資料串成故事的主軸", "g": 2, "places": [], "people": []}, {"id": 1045, "island": "I3", "title": "說服人的展示", "url": "/2018/07/1070516.html", "src": 83, "srcTitle": "培訓課程記錄：田野調查資料之運用", "type": "題", "date": "", "q": "好的展示或解說，有哪些共同特色？", "o": ["資訊越多越完整越好", "資訊越多越完整越好，專業術語也要盡量多用", "放上大量照片就夠了", "易懂、舉例、細節感動、可信數據"], "a": 3, "ex": "成功的展示要簡單易懂、具體舉例、用細節感動人、提出可信數據，並以故事呈現；資訊不在多，而在讓人看懂、記得。", "k": "可信數據", "d": "讓人相信的證據", "g": 2, "places": [], "people": []}, {"id": 1046, "island": "I3", "title": "觀光不是唯一", "url": "/2018/07/1070516.html", "src": 83, "srcTitle": "培訓課程記錄：田野調查資料之運用", "type": "題", "date": "", "q": "運用田調成果發展部落時，講師提醒要先想清楚什麼？", "o": ["先有族人共識，觀光不是唯一出路", "先發展觀光賺到錢，再慢慢凝聚族人的共識", "越快對外開放，越能把握機會", "先蓋好展示空間，再找內容"], "a": 0, "ex": "前期企劃與族人共識最重要，要先界定最終想呈現的價值；觀光並非唯一出路，貿然行動可能讓部落失去原本的樣貌。", "k": "唯一出路", "d": "觀光不是部落的……", "g": 1, "places": [], "people": []}, {"id": 1047, "island": "I3", "title": "從儀式到工法", "url": "/2023/03/blog-post.html", "src": 46, "srcTitle": "培訓課程：東海岸田調這檔事", "type": "題", "date": "", "q": "訪談一項傳統工藝時，可以怎麼延伸問題？", "o": ["從價格成本，延伸到銷售通路", "從時令禁忌儀式，延伸到材料與工法", "從誰做得最好，一路延伸到參加比賽的得獎經歷", "從開課時間，延伸到報名方式"], "a": 1, "ex": "可以依主題與人物，先訪談時令、禁忌與儀式，再延伸到物件的材料、形制與工法；整理逐字稿時，也要抓出族語關鍵字。", "k": "族語關鍵字", "d": "逐字稿裡要特別抓的詞", "g": 2, "places": [], "people": []}, {"id": 1048, "island": "I3", "title": "知識循環", "url": "/2023/03/blog-post.html", "src": 46, "srcTitle": "培訓課程：東海岸田調這檔事", "type": "題", "date": "", "q": "讓田調成果在部落形成循環，一個好方法是？", "o": ["把成果全部歸檔保存起來，避免知識外流被濫用", "建立教育模組：對內傳承、對外開課", "交給外地團隊包裝販售", "拍成宣傳片，放上網路推廣"], "a": 1, "ex": "以專案培育在地人才、建立文化教育模組，對內推動傳承、對外發展成經濟型課程；收入再支持傳承，就形成良性循環。", "k": "文化教育模組", "d": "對內傳承、對外開課的工具", "g": 3, "places": [], "people": []}, {"id": 1049, "island": "I3", "title": "尊重界線", "url": "/2021/05/blog-post.html", "src": 57, "srcTitle": "田野調查資料之運用", "type": "題", "date": "", "q": "規劃文化遊程時，原本路線會經過另一個部落的聖域，應該怎麼做？", "o": ["公有地沒有限制，照原路線走", "趁人少時通過，避免引起注意", "尊重界線與禁忌，另規劃路線", "請公部門出面協調放行"], "a": 2, "ex": "貓公規劃聖山路線時，因原路線經過八里灣部落被視為冒犯，就改走農路；文化遊程要尊重部落之間的界線與禁忌。", "k": "冒犯", "d": "不尊重界線帶來的感受", "g": 3, "places": [], "people": []}, {"id": 1050, "island": "I3", "title": "關係人口", "url": "/2021/05/blog-post.html", "src": 57, "srcTitle": "田野調查資料之運用", "type": "題", "date": "", "q": "把田調轉成文化學習型遊程，期待和遊客形成什麼關係？", "o": ["一次性的消費者，買完就離開", "帶來大量曝光的網紅，打卡宣傳後就換下一個景點", "人數越多越好的團體遊客", "深度連結，成為持續關心的關係人口"], "a": 3, "ex": "文化學習型遊程讓遊客真正認識部落的故事與禁忌，建立深度連結；他們會成為關係人口，持續關心、回訪，甚至協助部落。", "k": "關係人口", "d": "持續關心部落的外部朋友", "g": 1, "places": [], "people": []}, {"id": 1051, "island": "I3", "title": "帶年輕人下水", "url": "/2023/11/blog-post_24.html", "src": 39, "srcTitle": "文化泛舟資源調查－奇美部落", "type": "題", "date": "", "q": "部落試遊程時，為什麼特別想帶有心參與的年輕人一起？", "o": ["讓年輕人向耆老學習，培育傳承人才", "年輕人比較會拍照剪片，可以順便幫忙宣傳行銷", "年輕人體力好，可以幫忙划船", "耆老不方便下水，需要人代替"], "a": 0, "ex": "試遊程時一邊下水一邊訪談耆老，是很好的傳承現場；部落認為帶有心參與的年輕人下水最有意義，知識才能交到下一代手上。", "k": "有心參與", "d": "部落想帶下水的年輕人特質", "g": 3, "places": [], "people": []}, {"id": 1052, "island": "I3", "title": "搶救地名", "url": "/2024/12/blog-post_6.html", "src": 29, "srcTitle": "從傳統地名指認工作坊開始建構都歷部落的水域自然資源資料庫", "type": "題", "date": "", "q": "為什麼要趕快辦傳統地名指認？", "o": ["為了更換新的路牌，順便統一各個地名的寫法", "為了申請地名商標，保護權益", "為了參加文化比賽，爭取獎項", "趁長輩還在保留知識，作為管理依據"], "a": 3, "ex": "長輩在地圖上指認傳統地名與物種族語名稱，再結合科學調查建成資料庫；趁長輩還在把知識保留下來，未來劃設傳統海域或管理水域都用得到。", "k": "傳統地名", "d": "長輩在地圖上指認的東西", "g": 1, "places": [], "people": []}, {"id": 1053, "island": "I3", "title": "玩中學", "url": "/2017/11/1061106.html", "src": 99, "srcTitle": "培訓課程記錄：環境智慧與觀察工作坊", "type": "題", "date": "", "q": "用文化桌遊盤點在地知識，有什麼好處？", "o": ["純粹娛樂放鬆，與學習無關", "比考試更嚴格的測驗工具，用來檢驗族人的程度", "邊玩邊盤點知識，並思辨威脅與解方", "主要設計給小孩，培養興趣"], "a": 2, "ex": "桌遊用年齡階層、可食野菜、禁忌、威脅、解決方法等卡片，讓族人玩中學；邊玩邊盤點知識，也一起思辨部落面臨的威脅與可能的解方。", "k": "玩中學", "d": "桌遊的學習方式", "g": 2, "places": [], "people": []}, {"id": 1054, "island": "I3", "title": "知識要實踐", "url": "/2021/08/blog-post.html", "src": 56, "srcTitle": "部落的海洋知識與應用", "type": "題", "date": "", "q": "傳統生態知識最怕的是什麼？", "o": ["知識隨時代改變，失去原貌", "沒有人實踐，知識就會斷裂", "知識被寫成書，變得僵化", "知識被外人知道，失去價值"], "a": 1, "ex": "傳統知識透過年齡階級、潛伴團體與家族傳承；知識可以隨時代改變，但若無人實踐就會斷裂，所以要創造讓人實際去做的機會。", "k": "無人實踐", "d": "知識斷裂的原因", "g": 3, "places": [], "people": []}, {"id": 1055, "island": "I4", "title": "走讀的目的", "url": "/2020/10/blog-post.html", "src": 62, "srcTitle": "部落走讀｜美山部落", "type": "題", "date": "", "q": "部落走讀的主要目的是什麼？", "o": ["觀察記錄、盤點資源，作為藍圖基礎", "帶遊客實地參觀，收取導覽費用作為部落收入", "拍攝美照，經營社群帳號", "巡查環境，檢舉違建與髒亂"], "a": 0, "ex": "走讀是一邊走、一邊觀察記錄，盤點部落的地標、老樹、歷史事件與潛力資源；這些觀察會成為後續訪談與藍圖討論的基礎。", "k": "觀察記錄", "d": "走讀時手上一直在做的事", "g": 2, "places": [], "people": []}, {"id": 1056, "island": "I4", "title": "口述與記錄", "url": "/2020/10/blog-post_70.html", "src": 65, "srcTitle": "部落走讀｜東河部落", "type": "題", "date": "", "q": "走讀時，怎麼讓記錄更有深度？", "o": ["只拍照片做紀錄，回去之後再上網查詢相關資料", "參考網路介紹，節省時間", "請導遊背好稿子再帶隊", "逐點記錄，並請族人口述歷史"], "a": 3, "ex": "依環境盤點逐點記錄地點，同時請族人口述歷史與背景，例如成年禮場所的變化；有了口述，地點才有故事。", "k": "口述歷史", "d": "族人親口說的過去", "g": 2, "places": [], "people": []}, {"id": 1057, "island": "I4", "title": "老樹見證", "url": "/2020/10/blog-post_26.html", "src": 63, "srcTitle": "部落走讀｜麻荖漏部落", "type": "題", "date": "", "q": "走讀時為什麼要特別記錄部落裡的大樹？", "o": ["建物會遷拆，大樹見證了歷史空間", "大樹樹形漂亮，很適合拍照打卡", "大樹妨礙交通，需要評估移除", "大樹可以申請保護，取得補助"], "a": 0, "ex": "部落的建物可能已經遷移或拆除，但大樹往往還在原地，見證了學校、市場與聚會的歷史空間；記錄大樹，就是記錄部落的記憶座標。", "k": "見證", "d": "大樹對歷史空間的意義", "g": 2, "places": [], "people": []}, {"id": 1058, "island": "I4", "title": "交通可及性", "url": "/2020/10/blog-post_26.html", "src": 63, "srcTitle": "部落走讀｜麻荖漏部落", "type": "題", "date": "", "q": "想把某個空間改成遊客服務據點，走讀時要一併檢視什麼？", "o": ["交通可及性，例如公車班次與路線", "牆面的顏色與彩繪，是否足夠吸引遊客拍照打卡", "附近是否有網紅店家", "空間原本的屋主是誰"], "a": 0, "ex": "空間再好，遊客到不了也沒用；走讀時要一併檢視交通可及性，例如公車班次與路線，評估據點是否真的能帶來人潮。", "k": "交通可及性", "d": "遊客到不到得了", "g": 2, "places": [], "people": []}, {"id": 1059, "island": "I4", "title": "環境威脅", "url": "/2020/10/blog-post_76.html", "src": 64, "srcTitle": "部落走讀｜麒麟部落", "type": "題", "date": "", "q": "走讀時發現通往海邊的步道被海浪侵蝕，應該怎麼處理這個發現？", "o": ["當作沒看到不要記錄，以免增加之後的工作量", "帶更多遊客去看，增加話題", "記下來，列為優先保護的環境課題", "自行動手填平，避免危險"], "a": 2, "ex": "走讀不只找亮點，也要記錄威脅；例如步道與橋受海浪侵蝕，就要列為優先保護的課題，作為藍圖與據點規劃的依據。", "k": "海浪侵蝕", "d": "步道面臨的威脅", "g": 2, "places": [], "people": []}, {"id": 1060, "island": "I4", "title": "土地權屬", "url": "/2020/10/blog-post_17.html", "src": 66, "srcTitle": "部落走讀｜隆昌部落", "type": "題", "date": "", "q": "規劃溪谷秘境遊程時，發現入口周邊都是私人土地，該怎麼做？", "o": ["直接開放遊客進入，再說明", "在入口立招牌，宣示路權", "請遊客自行繞過，不必處理", "先與地主溝通協調，取得同意"], "a": 3, "ex": "遊程動線經過私人土地，就要先與地主溝通協調；沒有處理好土地權屬，再好的遊程也會引發衝突、難以長久。", "k": "地主", "d": "土地的所有人", "g": 3, "places": [], "people": []}, {"id": 1061, "island": "I4", "title": "安全規劃", "url": "/2020/10/blog-post_17.html", "src": 66, "srcTitle": "部落走讀｜隆昌部落", "type": "題", "date": "", "q": "深山溪谷遊程沒有手機收訊，規劃時必須先想清楚什麼？", "o": ["緊急狀況的處理與通報方式", "沿途哪裡最適合拍照打卡、設置攤位販售飲料", "沿途販售飲料的攤位", "避免遊客無聊的活動"], "a": 0, "ex": "溪谷深處沒有收訊，一旦有人受傷就很難求援；規劃遊程前要先想清楚緊急狀況的處理與通報方式，安全是遊程的底線。", "k": "緊急狀況", "d": "沒有收訊時最怕的事", "g": 2, "places": [], "people": []}, {"id": 1062, "island": "I4", "title": "設定客群", "url": "/2020/10/blog-post_23.html", "src": 67, "srcTitle": "部落走讀｜貓公部落", "type": "題", "date": "", "q": "規劃一個新的文化體驗區時，第一個要問的問題是？", "o": ["園區要蓋多大才夠氣派，能不能成為新的地標", "目標客群是誰，並記錄來訪客群", "總共要花多少經費", "要請哪位名人代言"], "a": 1, "ex": "先設定目標客群，並記錄來訪客群的組成、年齡層與職業；知道是為誰設計，內容、價格與動線才會合用。", "k": "目標客群", "d": "遊程是為誰設計的", "g": 2, "places": [], "people": []}, {"id": 1063, "island": "I4", "title": "遊客動線", "url": "/2020/10/blog-post_23.html", "src": 67, "srcTitle": "部落走讀｜貓公部落", "type": "題", "date": "", "q": "設計部落導覽動線時，走讀後常見的改善建議是？", "o": ["固定時間與路線，沿途增設休息點", "路線每天變化，保持新鮮感", "路線越長越好，盡量增加遊客在部落停留的時間", "不設休息點，避免遊客久留"], "a": 0, "ex": "遊客動線要有固定的經營時間與路線，停車點不宜太遠，導覽沿途也要增設休息設施；動線順了，遊客體驗與部落生活才都顧得到。", "k": "休息設施", "d": "導覽沿途要補的設施", "g": 2, "places": [], "people": []}, {"id": 1064, "island": "I4", "title": "藍圖要兼顧", "url": "/2020/10/blog-post.html", "src": 62, "srcTitle": "部落走讀｜美山部落", "type": "題", "date": "", "q": "走讀後討論藍圖，要兼顧哪幾件事？", "o": ["盡量吸引遊客，人數越多越好", "優先滿足業者，帶動地方經濟", "集中投資硬體，改善公共設施", "兼顧保育、經營需求與遊客動線"], "a": 3, "ex": "藍圖要兼顧資源保育、部落經營需求與遊客動線；目標不是單方面得利，而是讓旅遊者與當地共同獲益。", "k": "共同獲益", "d": "藍圖希望達成的結果", "g": 1, "places": [], "people": []}, {"id": 1065, "island": "I4", "title": "認識一個部落", "url": "/2020/09/blog-post.html", "src": 69, "srcTitle": "深度認識東海岸部落－台東段", "type": "題", "date": "", "q": "第一次深入認識一個部落，可以從哪些主題切入？", "o": ["熱門景點、網路評價、打卡數與附近的餐廳數量", "發展史、名稱由來、人口與近期事件", "餐廳數量、民宿價格與交通", "人口數字、選舉結果與預算"], "a": 1, "ex": "認識部落可以從發展史、名稱由來、人口組成、特色事物、近期事件、組織與議題社群六個主題切入，比只看景點更能抓到部落的脈動。", "k": "名稱由來", "d": "部落名字是怎麼來的", "g": 2, "places": [], "people": []}, {"id": 1066, "island": "I4", "title": "找藍圖夥伴", "url": "/2020/09/blog-post.html", "src": 69, "srcTitle": "深度認識東海岸部落－台東段", "type": "題", "date": "", "q": "為什麼要找出部落裡的組織、議題社群與關係人？", "o": ["依照名單分配補助款項，確保每個組織都有分到", "列管需要追蹤的人員", "找出能一起討論藍圖的夥伴", "安排會議的座位順序"], "a": 2, "ex": "藍圖不是一個人畫得出來的；找出部落內的組織、議題社群與關係人，才知道誰在乎什麼、誰能一起討論與行動。", "k": "議題社群", "d": "關心同一件事的人群", "g": 3, "places": [], "people": []}, {"id": 1067, "island": "I4", "title": "不再單打獨鬥", "url": "/2020/09/blog-post_28.html", "src": 70, "srcTitle": "願景行動地圖－部落藍圖之操作實務", "type": "題", "date": "", "q": "課程觀察到東海岸部落普遍面臨什麼組織上的困境？", "o": ["各自單打獨鬥，缺乏相互合作", "組織太過團結，難以接納外人", "資源太多，不知道如何運用", "年輕人太多，長輩插不上話"], "a": 0, "ex": "許多部落各自努力、單打獨鬥，缺乏相互合作，社區組織功能也不一；推動藍圖的第一步，是找出誰是可以一起走的夥伴。", "k": "單打獨鬥", "d": "缺乏合作的狀態", "g": 3, "places": [], "people": []}, {"id": 1068, "island": "I4", "title": "部落公約", "url": "/2017/11/1061116.html", "src": 98, "srcTitle": "培訓課程記錄：吉拉米代部落觀摩小旅行", "type": "題", "date": "", "q": "觀摩成功的部落後，得到「部落至少要有什麼」的啟示？", "o": ["一座吸睛的地標建築", "一家合作的旅行社", "一位知名的代言人", "公約，代表區域的共識"], "a": 3, "ex": "成功的部落至少要有公約，代表區域共識；例如採砂或施工須經協會同意，有了共同的約定，外部開發與遊客行為才有依據。", "k": "公約", "d": "代表區域共識的約定", "g": 3, "places": [], "people": []}, {"id": 1069, "island": "I4", "title": "持續耕耘", "url": "/2017/11/1061116.html", "src": 98, "srcTitle": "培訓課程記錄：吉拉米代部落觀摩小旅行", "type": "題", "date": "", "q": "吉拉米代的水圳能維持運作，靠的是什麼？", "o": ["政府定期派員巡查與維修，並委託工程公司管理", "委託工程公司統一管理", "持續耕耘的人與輪流巡守的分工", "設置自動化監測設備"], "a": 2, "ex": "六條水圳由居民輪流巡守、自願清理；觀摩的啟示是，制度之外還需要持續耕耘的人，部落的資源才守得住。", "k": "持續耕耘", "d": "比制度更需要的人", "g": 3, "places": [], "people": []}, {"id": 1070, "island": "I4", "title": "逐年進步", "url": "/2017/11/1061116.html", "src": 98, "srcTitle": "培訓課程記錄：吉拉米代部落觀摩小旅行", "type": "題", "date": "", "q": "申請綠色旅遊相關認證，應該抱持什麼心態？", "o": ["只要取得一次就永久有效，之後不必再接受檢視", "拿不到就代表不適合", "逐年進步的過程，不是一次到位", "主要為了掛牌與宣傳"], "a": 2, "ex": "綠色旅遊認證背後有許多指標，認證是逐年進步的過程；重點是透過指標檢視自己，一年比一年更好。", "k": "逐年進步", "d": "面對認證的心態", "g": 2, "places": [], "people": []}, {"id": 1071, "island": "I4", "title": "觀光的警訊", "url": "/2017/11/1061116.html", "src": 98, "srcTitle": "培訓課程記錄：吉拉米代部落觀摩小旅行", "type": "題", "date": "", "q": "有部落因觀光衝擊過大而「封村」，這個案例提醒我們什麼？", "o": ["觀光一定利大於弊，不必擔心", "遊客越多，部落越有活力", "沒有規劃管理，觀光會傷害生活", "封村是保護部落最好的方式"], "a": 2, "ex": "過度觀光會干擾居民生活、破壞環境，嚴重時部落只好封村；這個警訊提醒我們，要先有共識、規範與承載量，觀光才不會反噬部落。", "k": "封村", "d": "觀光衝擊過大時的極端結果", "g": 1, "places": [], "people": []}, {"id": 1072, "island": "I4", "title": "三代共組", "url": "/2020/10/blog-post_20.html", "src": 68, "srcTitle": "部落走讀｜水璉部落", "type": "題", "date": "", "q": "獵人學校由老、中、青三代共同成立，這樣的組成有什麼好處？", "o": ["人數越多，活動越熱鬧", "可以申請更多世代補助", "跨世代分工，傳承與接棒都有人", "人數越多活動越熱鬧，也可以申請更多世代補助"], "a": 2, "ex": "老中青三代共同成立的組織，讓耆老傳承山林知識、中壯年負責執行、青年學習接棒；跨世代分工，是組織能延續的關鍵。", "k": "三代", "d": "老、中、青", "g": 3, "places": [], "people": []}, {"id": 1073, "island": "I5", "title": "藍圖的重點", "url": "/2022/11/blog-post_58.html", "src": 47, "srcTitle": "培訓課程：畫出共同的永續未來－永續元素與地方藍圖", "type": "題", "date": "", "q": "部落藍圖最重要的是什麼？", "o": ["畫出精美好看的地圖", "列出最多的建設項目", "共同討論出永續的方向", "寫出完整厚實的報告"], "a": 2, "ex": "藍圖的重點不在畫出好看的圖，而是共同討論出地方觀光的永續；過程中凝聚的共識，比圖面本身更有價值。", "k": "好看的圖", "d": "藍圖不追求的東西", "g": 1, "places": [], "people": []}, {"id": 1074, "island": "I5", "title": "第一步劃禁區", "url": "/2022/11/blog-post_58.html", "src": 47, "srcTitle": "培訓課程：畫出共同的永續未來－永續元素與地方藍圖", "type": "題", "date": "", "q": "討論藍圖時，第一步要先在圖上標出什麼？", "o": ["不可干擾的生活與禁忌區域", "最受歡迎的拍照景點", "預定興建停車場與遊客服務中心的位置", "可以出售開發的土地"], "a": 0, "ex": "藍圖第一步先劃出不可干擾的區域，包括不想被遊客打擾的生活寧靜區與傳統禁忌區；先確定哪裡不能碰，再談哪裡可以發展。", "k": "不可干擾", "d": "藍圖第一步要劃的區域", "g": 2, "places": [], "people": []}, {"id": 1075, "island": "I5", "title": "六類盤點", "url": "/2022/11/blog-post_58.html", "src": 47, "srcTitle": "培訓課程：畫出共同的永續未來－永續元素與地方藍圖", "type": "題", "date": "", "q": "藍圖盤點資源時，除了文化傳承與生態區域，還要盤點哪些？", "o": ["熱門景點、網紅店家、停車場", "民宿數量、餐廳評價、交通", "公共廁所、垃圾桶、路燈", "生活採集、傳統技藝、部落記憶"], "a": 3, "ex": "盤點可以分成文化傳承、生活採集、傳統技藝、生態區域與部落記憶等類別；連一顆大石頭、唯一的公用電話，都可能值得記下。", "k": "部落記憶", "d": "大石頭、老電話也算的那一類", "g": 2, "places": [], "people": []}, {"id": 1076, "island": "I5", "title": "點線面", "url": "/2022/11/blog-post_58.html", "src": 47, "srcTitle": "培訓課程：畫出共同的永續未來－永續元素與地方藍圖", "type": "題", "date": "", "q": "盤點文化傳承時，為什麼要連結到「人」？", "o": ["方便統計參與的人口數，作為申請補助的依據", "方便日後收取導覽費用", "方便點名確認出席狀況", "透過人把點串成線，再成為面"], "a": 3, "ex": "盤點不只記錄有形無形的事物，也要記錄它們與人的連結；透過人，點狀分布的文化就能串成線、再形成面狀的故事線。", "k": "點狀", "d": "還沒串起來的文化分布", "g": 2, "places": [], "people": []}, {"id": 1077, "island": "I5", "title": "藍圖夥伴條件", "url": "/2022/11/blog-post_58.html", "src": 47, "srcTitle": "培訓課程：畫出共同的永續未來－永續元素與地方藍圖", "type": "題", "date": "", "q": "適合一起討論部落藍圖的夥伴，通常具備哪些特質？", "o": ["資源最多、能出錢支持，並且擁有最多土地的人", "連結關鍵人物，有毅力與回饋熱忱", "最會發言，能主導討論", "職位最高，能拍板決定"], "a": 1, "ex": "好的藍圖夥伴能討論旅遊議題、與關鍵人物密切連結、有經營公共事務的想像與毅力、有回饋部落的熱忱，並開始規劃參與方式與行動。", "k": "毅力", "d": "經營公共事務需要的持久力", "g": 3, "places": [], "people": []}, {"id": 1078, "island": "I5", "title": "部落經營需求", "url": "/2022/11/blog-post_58.html", "src": 47, "srcTitle": "培訓課程：畫出共同的永續未來－永續元素與地方藍圖", "type": "題", "date": "", "q": "藍圖除了盤點資源，還要討論哪些「部落經營需求」？", "o": ["共管機制、地產地消、動線迴避、接待能量", "吸引投資、擴建道路、提高地價、增加招商", "增設停車場、商店街、地標、廣告牌", "提高票價、延長營業、增加班次、擴大宣傳"], "a": 0, "ex": "地方觀光的永續包含資源與議題的盤點，也包含部落的經營需求：資源共管機制、地產地消的營運模式、必要的遊客動線迴避，以及接待能量。", "k": "接待能量", "d": "部落能承接多少遊客的能力", "g": 3, "places": [], "people": []}, {"id": 1079, "island": "I5", "title": "保持彈性", "url": "/2022/11/blog-post_58.html", "src": 47, "srcTitle": "培訓課程：畫出共同的永續未來－永續元素與地方藍圖", "type": "題", "date": "", "q": "部落藍圖完成後應該怎麼看待它？", "o": ["完成後就正式定案，之後不能再任意修改內容", "僅供參考，執行時可以忽略", "有方向性，但隨環境變化保持彈性", "每年重新繪製一張新的藍圖"], "a": 2, "ex": "藍圖整合大家的需求與構想，有引導與整體方向性；但它不是僵固的盤點資訊，要保持彈性、隨外部環境的變化而調整。", "k": "彈性", "d": "藍圖面對變化的特性", "g": 2, "places": [], "people": []}, {"id": 1080, "island": "I5", "title": "空間的規劃", "url": "/2018/05/1070412.html", "src": 89, "srcTitle": "培訓課程紀錄：圖資平台運用工作坊", "type": "題", "date": "", "q": "從空間規劃來看，部落藍圖在想什麼？", "o": ["明年度的活動與行事曆", "下一季的宣傳主題、行銷通路與活動行事曆", "未來十到二十年的生活與土地配置", "單一工程的設計與施工"], "a": 2, "ex": "藍圖是空間規劃，思考未來十到二十年的部落生活，從部落資源出發，判斷居住、接待、發展與保護的適合區位；而部落共識是藍圖的基礎。", "k": "適合區位", "d": "居住、接待、發展、保護的位置", "g": 1, "places": [], "people": []}, {"id": 1081, "island": "I5", "title": "議題怎麼來", "url": "/2023/11/blog-post.html", "src": 41, "srcTitle": "部落觀光永續發展路徑討論－都蘭部落", "type": "題", "date": "", "q": "從一堆觀光現象中，怎麼整理出部落真正的議題？", "o": ["投票選出最多人提到的現象", "請講師直接指定要處理的議題，大家再分工執行", "挑選最容易解決的先處理", "分類現象、釐清因果與循環，再歸納"], "a": 3, "ex": "先從生態、遊客管理、文化、社會經濟等面向提出現象，再分類釐清因果，看出哪些是良性、哪些是惡性循環，最後歸納成要處理的議題。", "k": "惡性循環", "d": "會讓問題越來越嚴重的連鎖", "g": 2, "places": [], "people": []}, {"id": 1082, "island": "I5", "title": "圖資思考邏輯", "url": "/2022/11/blog-post_79.html", "src": 48, "srcTitle": "培訓課程：畫出共同的永續未來－圖資平台運用", "type": "題", "date": "", "q": "運用圖資平台建構藍圖時，正確的思考順序是？", "o": ["平台→圖資→圖層→議題→法規→申請經費", "地圖→美編→印刷→發送→歸檔", "議題→資訊法規→圖資→圖層→平台", "軟體→課程→證照→接案→結案"], "a": 2, "ex": "圖資是工具，議題才是起點：先釐清部落的議題與需求，找出相關的環境資訊與法規、可檢視的圖資，建立圖層概念，最後才選用合適的平台。", "k": "圖層概念", "d": "把不同資訊分層疊起來的想法", "g": 2, "places": [], "people": []}, {"id": 1083, "island": "I5", "title": "合理配置", "url": "/2022/11/blog-post_79.html", "src": 48, "srcTitle": "培訓課程：畫出共同的永續未來－圖資平台運用", "type": "題", "date": "", "q": "藍圖為什麼不能只是對未來生活的想像？", "o": ["想像不需要成本，可以盡量發揮", "法規限制太多，不必放進藍圖", "土地已經規劃好，無法再改變", "還要合理配置土地，避免誤用開發"], "a": 3, "ex": "藍圖除了想像未來，更要合理配置土地；把不適宜發展的地區界定出來，把居住、產業與公共設施放在適宜的區位，避免誤用開發。", "k": "合理配置", "d": "藍圖對土地要做到的", "g": 1, "places": [], "people": []}, {"id": 1084, "island": "I5", "title": "環境敏感地區", "url": "/2022/11/blog-post_79.html", "src": 48, "srcTitle": "培訓課程：畫出共同的永續未來－圖資平台運用", "type": "題", "date": "", "q": "規劃前查詢「環境敏感地區」，可以幫助我們知道什麼？", "o": ["哪裡的土地價格最高", "哪裡的遊客人潮最多", "哪裡有災害、生態或文化上的限制", "哪裡的土地價格最高、人潮最多、景色最適合拍照"], "a": 2, "ex": "環境敏感地區分為災害、生態、文化景觀與資源利用等類型，是國土與海岸分區的重要依據；先查清楚，才知道哪裡不宜開發、哪些行為受限。", "k": "環境敏感", "d": "有限制、需要特別小心的地區", "g": 2, "places": [], "people": []}, {"id": 1085, "island": "I5", "title": "盤點閒置土地", "url": "/2022/11/blog-post_79.html", "src": 48, "srcTitle": "培訓課程：畫出共同的永續未來－圖資平台運用", "type": "題", "date": "", "q": "想盤點部落周邊的公有閒置土地，可以利用什麼工具？", "o": ["可查地籍與公有地的國土圖資平台", "向在地長輩打聽口耳相傳的說法", "詢問房仲業者的待售物件", "看街景照片推測土地用途"], "a": 0, "ex": "國土測繪圖資服務雲等平台可以查土地地籍、公有地分布與權屬，有助於盤點部落周邊的閒置土地，作為據點或公共空間的討論素材。", "k": "閒置土地", "d": "可以活化的空地", "g": 2, "places": [], "people": []}, {"id": 1086, "island": "I5", "title": "社區地圖四步", "url": "/2020/09/blog-post_28.html", "src": 70, "srcTitle": "願景行動地圖－部落藍圖之操作實務", "type": "題", "date": "", "q": "製作社區地圖的四個步驟是？", "o": ["網路找圖→剪貼拼湊→上色美編→印刷繳交", "找廠商→招標→印刷→結案", "畫圖→拍照→上傳→按讚", "範圍主題→田調→圖面編繪→分享"], "a": 3, "ex": "社區地圖先選定範圍與主題，再做田野調查、進行圖面編繪，最後一起分享討論；範圍不必照行政界線，而是依大家的生活經驗決定。", "k": "圖面編繪", "d": "把調查結果畫成圖", "g": 2, "places": [], "people": []}, {"id": 1087, "island": "I5", "title": "疊圖法", "url": "/2018/05/1070418.html", "src": 88, "srcTitle": "培訓課程記錄：部落藍圖操作實務", "type": "題", "date": "", "q": "社區地圖的「疊圖」怎麼操作？", "o": ["由一位專業繪圖師畫完全部，品質才會一致", "把所有資訊寫在同一張紙", "只畫道路和建築就好", "分色分工標示，再疊圖兩兩比對"], "a": 3, "ex": "分工用不同顏色便利貼標示綠色資源、生活節點、故事記憶點、閒置空間等，再疊圖兩兩比對，就能找出值得改善或串聯的點。", "k": "疊圖", "d": "把多張圖層疊在一起看", "g": 2, "places": [], "people": []}, {"id": 1088, "island": "I5", "title": "路徑博物館", "url": "/2020/11/blog-post.html", "src": 59, "srcTitle": "路徑博物館與部落地圖", "type": "題", "date": "", "q": "「路徑博物館」的操作四步驟是？", "o": ["蓋館舍→收集文物→辦理展覽→開始收取門票", "選景點→做招牌→拍照→上網", "觀察→如實記錄→路徑串聯→遊程全貌", "買土地→鋪步道→立雕像→剪綵"], "a": 2, "ex": "路徑博物館不移動景點，而是用一條可及的道路把分散的景點串起來：觀察環境、如實記錄、路徑串聯、遊程全貌，引導遊客自己發現。", "k": "路徑串聯", "d": "把點連成線的步驟", "g": 2, "places": [], "people": []}, {"id": 1089, "island": "I5", "title": "立體模型", "url": "/2024/12/blog-post_9.html", "src": 28, "srcTitle": "由模型製作開展聚落空間與山海環境的視野，共同想像部落觀光的未來（都歷）", "type": "題", "date": "", "q": "部落立體模型做好之後，還可以拿來做什麼？", "o": ["傳統領域指認、導覽解說、文化傳承", "擺在辦公室當裝飾品，或參加比賽爭取獎金", "參加比賽爭取獎金", "收進倉庫妥善保存"], "a": 0, "ex": "立體模型依等高線分層堆疊，能讓大家直觀看見山海與聚落的關係；它是藍圖討論的基礎，也能用於傳統領域指認、導覽解說與文化傳承。", "k": "立體模型", "d": "依等高線堆出來的部落地形", "g": 2, "places": [], "people": []}, {"id": 1090, "island": "I5", "title": "再盤點循環", "url": "/2024/12/blog-post.html", "src": 32, "srcTitle": "從資源盤點與部落踏查開啟重安部落藍圖討論的新篇章", "type": "題", "date": "", "q": "部落藍圖討論要怎麼一次比一次更好？", "o": ["一次開會就定案，避免反覆", "交給顧問撰寫，確保專業", "盤點、確認、再盤點，參與者逐次增加", "只讓少數幹部參與，一次開會就定案提高效率"], "a": 2, "ex": "藍圖討論不是一次定案，而是盤點、確認、再盤點的循環；耆老在過程中協調認知落差，每次討論參與的人也逐步增加。", "k": "再盤點", "d": "循環裡的第三步", "g": 2, "places": [], "people": []}, {"id": 1091, "island": "I6", "title": "人是關鍵", "url": "/2018/07/1070607.html", "src": 81, "srcTitle": "培訓課程記錄：部落組織（會議）凝聚工作坊", "type": "題", "date": "", "q": "部落組織凝聚工作坊中，大家公認推動部落事務最大的問題是什麼？", "o": ["場地與設備：缺少開會的空間、電腦與網路", "人：找不到、留不住做事的人", "設備：缺少電腦與網路", "經費：缺少計畫補助"], "a": 1, "ex": "各部落分享時都提到，人是最大的問題：要找得到人、留得住人；年輕人是珍貴的資產，部落也需要可供公共使用的空間來聚集大家。", "k": "最大的問題", "d": "推動部落事務最卡的地方", "g": 3, "places": [], "people": []}, {"id": 1092, "island": "I6", "title": "以年齡階級為底", "url": "/2018/07/1070607.html", "src": 81, "srcTitle": "培訓課程記錄：部落組織（會議）凝聚工作坊", "type": "題", "date": "", "q": "部落凝聚組織時，可以用什麼作為底蘊來整合協會與行政體系？", "o": ["外地顧問公司", "網路社群群組", "年齡階級組織", "地方政黨組織"], "a": 2, "ex": "部落可以用年齡階級組織作為底蘊，整合協進會、社區發展協會與行政體系；傳統組織的倫理與分工，讓現代組織更有凝聚力。", "k": "年齡階級組織", "d": "阿美族傳統的社會骨架", "g": 3, "places": [], "people": []}, {"id": 1093, "island": "I6", "title": "提案練兵", "url": "/2018/07/1070607.html", "src": 81, "srcTitle": "培訓課程記錄：部落組織（會議）凝聚工作坊", "type": "題", "date": "", "q": "向公部門提案，對部落組織有什麼額外的好處？", "o": ["在提案與執行中練兵，培養能力", "提案成功就不必再自己做事", "可以獨享資源，不必分給別人", "可以避開部落會議，加快速度"], "a": 0, "ex": "對公部門提案不只是爭取資源，也是練兵：在撰寫、溝通、執行的過程中，團隊累積做公共事務的能力。", "k": "練兵", "d": "在實戰中培養能力", "g": 3, "places": [], "people": []}, {"id": 1094, "island": "I6", "title": "滾動找人", "url": "/2018/07/1070607.html", "src": 81, "srcTitle": "培訓課程記錄：部落組織（會議）凝聚工作坊", "type": "題", "date": "", "q": "「一薦二、二薦四」是用來做什麼的方法？", "o": ["透過推薦滾動式組建團隊", "計算經費分配給各組織時使用的比例公式", "安排值班順序的方法", "估算遊客人數的方式"], "a": 0, "ex": "找不到人時，可以請一位夥伴推薦兩位、兩位再各推薦兩位，用「一薦二、二薦四」滾動組建團隊；靠信任的人脈擴散，比公開徵人更有效。", "k": "一薦二", "d": "滾動找人的開頭", "g": 3, "places": [], "people": []}, {"id": 1095, "island": "I6", "title": "透明與儀式", "url": "/2018/07/1070607.html", "src": 81, "srcTitle": "培訓課程記錄：部落組織（會議）凝聚工作坊", "type": "題", "date": "", "q": "讓部落組織長久運作，有哪些重要的做法？", "o": ["帳目只給幹部看，避免紛爭", "決定越快越好，帳目只給幹部看以免引起紛爭", "資訊公開、財務透明、日常儀式化", "有事才臨時開會，節省時間"], "a": 2, "ex": "部落組織要能長久，靠的是資訊公開、財務透明，以及把聚會與分工日常儀式化；大家看得到、信得過，才願意持續投入。", "k": "財務透明", "d": "錢的事要怎麼處理", "g": 3, "places": [], "people": []}, {"id": 1096, "island": "I6", "title": "會議分層", "url": "/2018/07/1070607.html", "src": 81, "srcTitle": "培訓課程記錄：部落組織（會議）凝聚工作坊", "type": "題", "date": "", "q": "部落事務那麼多，會議要怎麼安排比較有效率？", "o": ["每件事都召開部落會議，確保所有人都同意才做", "盡量不開會，由負責人自行決定", "行政團隊定期處理，重大事才開部落會議", "全部透過群組訊息投票決定"], "a": 2, "ex": "日常事務由行政團隊約一兩個月定期開會處理，重大事項才召開部落會議；會議分層，既有效率又不失部落共識。", "k": "行政團隊", "d": "處理日常事務的一群人", "g": 3, "places": [], "people": []}, {"id": 1097, "island": "I6", "title": "誰能代表部落", "url": "/2024/11/1132.html", "src": 33, "srcTitle": "113年交流分享會活動紀要（2）共學討論：誰能代表部落？", "type": "題", "date": "", "q": "與公部門合作時，什麼樣的人適合代表部落？", "o": ["頭銜最大、資歷最深的人", "最會寫計畫、熟悉公文流程，與公部門最熟的人", "公部門指定、方便聯繫的人", "住在部落、取得內部共識、有熱忱"], "a": 3, "ex": "部落代表要居住在部落、決策以部落為主體並取得內部共識，也要有社會影響力與行動熱忱；這樣的人才能成為與公部門溝通的橋樑。", "k": "內部共識", "d": "代表發言前要先取得的", "g": 3, "places": [], "people": []}, {"id": 1098, "island": "I6", "title": "傳統接現代", "url": "/2026/08/blog-post.html", "src": 6, "srcTitle": "部落公法人實踐之路－都蘭部落傳統治理組織與當代機制之無縫接軌", "type": "題", "date": "", "q": "把傳統治理接上現代法人組織，都蘭的做法是？", "o": ["解散傳統組織，全部改成公司制度來經營管理", "由公所指派理事長與監事", "只保留協會，不再開部落會議", "頭目任理事長，長老顧問團任監事"], "a": 3, "ex": "都蘭以年齡階級結合文化協進會：頭目擔任理事長、長老顧問團擔任監事、年齡階級擔任理事；傳統的權威與分工，直接轉化進法人組織。", "k": "長老顧問團", "d": "擔任監事的傳統角色", "g": 3, "places": [], "people": []}, {"id": 1099, "island": "I6", "title": "組織穩定", "url": "/2026/08/blog-post.html", "src": 6, "srcTitle": "部落公法人實踐之路－都蘭部落傳統治理組織與當代機制之無縫接軌", "type": "題", "date": "", "q": "部落組織要穩定運作，關鍵之一是什麼？", "o": ["每年更換一次全部幹部", "完全仰賴志工輪流幫忙", "依靠一位強人帶領全部事務", "專職行政人力與青年留鄉"], "a": 3, "ex": "部落組織的會議、帳務與對外聯繫都需要人處理；專職行政人力與青年留鄉，是組織能穩定運作的關鍵。", "k": "專職行政人力", "d": "組織穩定需要的固定人手", "g": 3, "places": [], "people": []}, {"id": 1100, "island": "I6", "title": "先盤點再設計", "url": "/2026/06/blog-post.html", "src": 11, "srcTitle": "合作社組織營運與行政管理：濁水布農合作社交流記錄", "type": "題", "date": "", "q": "部落合作社設計生態旅遊遊程前，應先盤點什麼？", "o": ["競爭對手的價格與行程，以及網路上的熱門景點", "網路上的熱門打卡景點", "最近流行的戶外活動", "生態文化優勢、交通與各年齡層人力"], "a": 3, "ex": "先盤點各部落的生態文化優勢、交通可達性，以及各年齡層人力有多少，再依此設計遊程；遊程要配合部落真正能承接的能量。", "k": "各年齡層人力", "d": "部落裡老中青各有多少人", "g": 2, "places": [], "people": []}, {"id": 1101, "island": "I6", "title": "透明溝通", "url": "/2026/06/blog-post.html", "src": 11, "srcTitle": "合作社組織營運與行政管理：濁水布農合作社交流記錄", "type": "題", "date": "", "q": "合作社內部怎麼保持溝通透明？", "o": ["由理事長一人決定，其他人照做，年底再報告", "有問題時再個別溝通", "年底開一次大會報告", "團隊週報與共識會議，分工到小組"], "a": 3, "ex": "合作社分成多個工作組、各有組長，營運團隊負責接單行銷；再用團隊週報與共識會議保持溝通透明，大家都知道進度與決定。", "k": "共識會議", "d": "大家一起做決定的會議", "g": 3, "places": [], "people": []}, {"id": 1102, "island": "I6", "title": "人力不足時", "url": "/2026/06/blog-post_22.html", "src": 10, "srcTitle": "部落生態旅遊發展實務與挑戰：濁水布農合作社交流記錄", "type": "題", "date": "", "q": "部落合作社面臨人力流失，可以怎麼維持營運？", "o": ["暫停營業，等人回來", "全部外包，省去人力", "只接大團，減少場次", "輪流值勤，分攤工作"], "a": 3, "ex": "人力流失時，可以用輪流值勤分攤工作，並用公開的值勤通知讓大家掌握；不讓少數人扛下所有事，營運才撐得下去。", "k": "輪流值勤", "d": "人力不足時的排班方式", "g": 3, "places": [], "people": []}, {"id": 1103, "island": "I6", "title": "說服的技巧", "url": "/2026/06/blog-post_22.html", "src": 10, "srcTitle": "部落生態旅遊發展實務與挑戰：濁水布農合作社交流記錄", "type": "題", "date": "", "q": "要說服社員或與公部門溝通，比較有效的方法是？", "o": ["用強硬的態度施壓，或請民意代表出面增加份量", "只講自己的需求，表達立場", "找民意代表出面，增加份量", "了解對方在乎的，用數據與案例說明"], "a": 3, "ex": "溝通先理解對方在乎的面向；對社員用數據與案例說明，對公部門則連結現代政策的語言，比較容易得到支持。", "k": "數據與案例", "d": "說服社員時用的材料", "g": 3, "places": [], "people": []}, {"id": 1104, "island": "I6", "title": "輩分與民主", "url": "/2026/05/blog-post_14.html", "src": 13, "srcTitle": "部落共管機制與組織營運：里山賽夏合作社的運作", "type": "題", "date": "", "q": "部落合作社怎麼同時兼顧傳統輩分與合作社的民主原則？", "o": ["一切由長老決定，年輕人照做", "輩分秩序約束，但人人平等投票", "一切由年輕人決定，長老退休", "用抽籤決定，避免爭議"], "a": 1, "ex": "賽夏合作社以傳統輩分秩序約束決策，同時依合作社原則，不分年齡都能平等發聲與投票；月會還辦慶生，讓年輕人更願意參與。", "k": "平等", "d": "合作社對每位社員發言權的原則", "g": 3, "places": [], "people": []}, {"id": 1105, "island": "I6", "title": "公開帳務", "url": "/2026/05/blog-post_14.html", "src": 13, "srcTitle": "部落共管機制與組織營運：里山賽夏合作社的運作", "type": "題", "date": "", "q": "合作社每月開會時公開帳務，主要目的是什麼？", "o": ["展示營收成果提升士氣，同時應付主管機關稽查", "建立信任，疑慮當場討論解決", "應付主管機關的例行稽查", "減少開會時間，提高效率"], "a": 1, "ex": "合作社以企業化方式控管預算，每月會議公開帳務；族人有疑慮就在會中討論解決，信任就是這樣一點一滴累積的。", "k": "公開帳務", "d": "每月月會做的事", "g": 3, "places": [], "people": []}, {"id": 1106, "island": "I6", "title": "對內轉譯", "url": "/2022/11/blog-post_8.html", "src": 49, "srcTitle": "培訓課程：那些被隱藏的永續意涵－部落的價值系統", "type": "題", "date": "", "q": "部落推動事務時，哪一種「轉譯者」更關鍵？", "o": ["對外發言人，負責媒體公關與對外宣傳形象", "對內轉譯者，讓族人理解並參與", "企劃寫手，專門撰寫計畫書", "外地專家，提供專業建議"], "a": 1, "ex": "部落需要對外與對內的轉譯者，其中對內轉譯者更關鍵；他們讓族人理解並參與。但要注意有能者過勞的現象，工作要分擔。", "k": "對內轉譯者", "d": "部落最關鍵的一種人才", "g": 3, "places": [], "people": []}, {"id": 1107, "island": "I6", "title": "帶人要帶心", "url": "/2022/11/blog-post_8.html", "src": 49, "srcTitle": "培訓課程：那些被隱藏的永續意涵－部落的價值系統", "type": "題", "date": "", "q": "帶領年齡階級做事，阿美族的智慧是什麼？", "o": ["越嚴厲越能建立紀律", "用獎金激勵最有效", "越嚴厲越能建立紀律，讓同一位領導者長期掌權", "帶人要帶心，把玩樂作為方法"], "a": 3, "ex": "阿美族帶領年齡階級講究帶人要帶心，而非高壓；透過制度與儀式，把玩樂作為方法，讓訓練與勞動中也有放鬆與凝聚。", "k": "玩樂作為方法", "d": "阿美族帶心的方式", "g": 3, "places": [], "people": []}, {"id": 1108, "island": "I6", "title": "權力的制衡", "url": "/2022/11/blog-post_8.html", "src": 49, "srcTitle": "培訓課程：那些被隱藏的永續意涵－部落的價值系統", "type": "題", "date": "", "q": "阿美族的社會制度如何避免權力集中在少數人身上？", "o": ["由最有財富的家族世襲領導，其他家族配合", "交由外來的行政官員管理", "年齡階級輪流領導，會所制度制衡", "不設規範，大家自由發展"], "a": 2, "ex": "阿美族透過年齡階級的升級制度，讓每一階都會輪到領導、但不會永遠掌權；再由會所制度裁判各家族與個人的錯誤，制衡領導者與有財富者。", "k": "會所制度", "d": "負責裁判錯誤的傳統機制", "g": 3, "places": [], "people": []}, {"id": 1109, "island": "I7", "title": "衝突的解方", "url": "/2024/11/1131.html", "src": 34, "srcTitle": "113年交流分享會活動紀要（1）講師分享", "type": "題", "date": "", "q": "當原住民族傳統權利（如狩獵、採集、祭典）和現行法規衝突時，比較好的出路是？", "o": ["依法嚴格取締違規，由法院判決誰對誰錯", "交由法院判決，誰對誰錯", "部落放棄傳統，配合法規", "建立共管，一起制定規則與管理"], "a": 3, "ex": "傳統領域權利常與航空、森林、野生動物等法規衝突；與其你死我活，不如建立共管，讓政府與部落一起制定規則、一起管理資源。", "k": "共管", "d": "政府與部落一起管理", "g": 3, "places": [], "people": []}, {"id": 1110, "island": "I7", "title": "諮商同意", "url": "/2026/10/blog-post_12.html", "src": 2, "srcTitle": "落實與原住民族共管資源、守護土地之法制－從同意權到共管權的實踐", "type": "題", "date": "", "q": "在原住民族土地上開發或利用資源，法律要求政府先做什麼？", "o": ["公告周知，讓大家知道就好", "諮商並取得部落同意或參與", "給予補償金，作為回饋", "完成環評，就不需其他程序"], "a": 1, "ex": "原基法要求在原住民族土地上開發、利用資源或學術研究時，應諮商並取得部落同意或參與；法院也認為諮商同意是共管精神的具體展現。", "k": "諮商同意", "d": "開發前要取得的部落意見", "g": 3, "places": [], "people": []}, {"id": 1111, "island": "I7", "title": "法令沒修", "url": "/2026/10/blog-post_15.html", "src": 1, "srcTitle": "從理想到現實－國家風景區踐行共管機制之挑戰與期望", "type": "題", "date": "", "q": "為什麼原基法有共管精神，機關卻不一定要共管？", "o": ["原基法已經廢止，不再適用", "部落多數不希望參與共管", "各機關法令未依原基法修正", "共管違反行政程序法"], "a": 2, "ex": "原基法是原則性法律，若各機關的目的事業法令沒有依規定修正，就缺乏具體的共管法源；機關會認為法沒寫、就沒有共管的義務。", "k": "目的事業法令", "d": "各機關自己依循的法規", "g": 3, "places": [], "people": []}, {"id": 1112, "island": "I7", "title": "空窗期過渡", "url": "/2026/10/blog-post_15.html", "src": 1, "srcTitle": "從理想到現實－國家風景區踐行共管機制之挑戰與期望", "type": "題", "date": "", "q": "修法完成之前，想推動共管可以怎麼過渡？", "o": ["法律未修正前，什麼都不能做", "依原基法原則發布行政函釋過渡", "先做再說，事後補齊程序", "等待部落公法人通過再處理"], "a": 1, "ex": "修法空窗期，可以由中央原住民族主管機關會同目的事業主管機關，依原基法的原則發布行政函釋過渡，讓共管先有依據可以啟動。", "k": "行政函釋", "d": "修法前的過渡工具", "g": 3, "places": [], "people": []}, {"id": 1113, "island": "I7", "title": "由淺入深", "url": "/2026/10/blog-post_15.html", "src": 1, "srcTitle": "從理想到現實－國家風景區踐行共管機制之挑戰與期望", "type": "題", "date": "", "q": "共管的推進順序，哪一種最合理？", "o": ["委託公權力→公產管理→人力經費→諮詢", "一開始就交出全部管理權", "諮詢→人力經費→公產→委託公權力", "開過一次會議就算完成共管"], "a": 2, "ex": "共管可以分階段推進：從諮詢開始，再到人力經費、公產管理，最後才是委託公權力；由淺入深，雙方的信任與能力一起成長。", "k": "由淺入深", "d": "共管推進的節奏", "g": 2, "places": [], "people": []}, {"id": 1114, "island": "I7", "title": "誰能代表部落", "url": "/2024/11/1131.html", "src": 34, "srcTitle": "113年交流分享會活動紀要（1）講師分享", "type": "題", "date": "", "q": "在現行法律上，什麼可以正式代表部落？", "o": ["部落會議", "社區發展協會", "村長個人", "長青會"], "a": 0, "ex": "部落目前不具法人身份，至多是非法人團體；法院實務上只承認部落會議能代表部落，其他傳統組織如長青會在法律上沒有地位。", "k": "部落會議", "d": "法律上代表部落的機制", "g": 3, "places": [], "people": []}, {"id": 1115, "island": "I7", "title": "法人嫁接", "url": "/2026/10/blog-post_15.html", "src": 1, "srcTitle": "從理想到現實－國家風景區踐行共管機制之挑戰與期望", "type": "題", "date": "", "q": "部落沒有法人身份，要成為共管主體，可以怎麼做？", "o": ["等部落公法人通過後再處理", "由部落中一位代表以個人名義簽約", "用社團法人或合作社等現有法人嫁接", "放棄共管，改用一般委外"], "a": 2, "ex": "部落沒有權利能力，可以先用社團法人、合作社等現有法人組織嫁接，成為共管或受託的主體；但公法人責任重大，需要審慎評估。", "k": "嫁接", "d": "用現有法人接上部落", "g": 3, "places": [], "people": []}, {"id": 1116, "island": "I7", "title": "依事務分工", "url": "/2024/11/1131.html", "src": 34, "srcTitle": "113年交流分享會活動紀要（1）講師分享", "type": "題", "date": "", "q": "律師建議部落面對不同的共管事務，可以怎麼組織？", "o": ["所有事務交給同一個人", "依事務性質成立不同組織", "成立一個大組織包辦全部", "不成立組織，個人參與即可"], "a": 1, "ex": "不同的共管事務需要不同的專業與成員，部落可以依事務性質成立不同組織，例如狩獵由獵人協會、觀光由發展協會擔任共管主體。", "k": "依事務性質", "d": "決定成立哪種組織的依據", "g": 3, "places": [], "people": []}, {"id": 1117, "island": "I7", "title": "傳統融入現代", "url": "/2026/10/blog-post_15.html", "src": 1, "srcTitle": "從理想到現實－國家風景區踐行共管機制之挑戰與期望", "type": "題", "date": "", "q": "銜接傳統組織與法律組織，最重要的原則是？", "o": ["廢除傳統組織，改用現代章程", "把傳統議決機制融入現代組織", "只保留傳統，不理會法律形式", "參照一般公司章程直接套用"], "a": 1, "ex": "年齡階層、耆老、氏族等傳統組織與議決機制，要轉化並融入現代的法人組織中；如此既有法律地位，又保有部落的運作精神。", "k": "議決機制", "d": "傳統做決定的方式", "g": 3, "places": [], "people": []}, {"id": 1118, "island": "I7", "title": "行政委託", "url": "/2024/11/blog-post.html", "src": 35, "srcTitle": "培訓課程：部落與公部門共好經營管理模式", "type": "題", "date": "", "q": "都蘭部落協會實際受託管理一片農場土地，用的是哪一種法律工具？", "o": ["行政委託", "土地買賣", "土地贈與", "強制徵收"], "a": 0, "ex": "依行政程序法，機關可以依法規把權限的一部分委託民間團體辦理，這就是行政委託；都蘭就是由協進會受託管理農場土地，部落因此實質參與管理。", "k": "行政委託", "d": "機關把權限交給民間團體辦理", "g": 3, "places": [], "people": []}, {"id": 1119, "island": "I7", "title": "狩獵自主管理", "url": "/2024/11/1131.html", "src": 34, "srcTitle": "113年交流分享會活動紀要（1）講師分享", "type": "題", "date": "", "q": "部落要走向狩獵自主管理，常見的路徑是？", "o": ["開放族人個人自由狩獵，不需要申請或回報", "全面禁止狩獵，保護野生動物", "先依自律公約試行，再締結行政契約", "委託外部團體代為管理狩獵"], "a": 2, "ex": "部落或團體可先經核准，依自治自律公約進行暫定自主管理狩獵；累積一定年數經驗後，再與主管機關締結行政契約，取得正式的自主管理。", "k": "自律公約", "d": "部落自己訂的狩獵規範", "g": 3, "places": [], "people": []}, {"id": 1120, "island": "I7", "title": "形式到實質", "url": "/2026/10/blog-post_08.html", "src": 3, "srcTitle": "林業署共管機制之法制化與滾動調整", "type": "題", "date": "", "q": "共管會常被批評「流於形式」，改善的方向是？", "o": ["增加開會次數、多邀學者出席，決議僅供參考", "以原民為主體，決議具實質拘束力", "多邀請學者專家出席", "決議僅供參考，保留彈性"], "a": 1, "ex": "早期共管會偏向上對下而流於形式；修訂後改以原民為主體，機關不得拒絕部落發起的共管會，而且決議具有實質拘束力。", "k": "拘束力", "d": "決議必須被遵守的效力", "g": 2, "places": [], "people": []}, {"id": 1121, "island": "I7", "title": "滾動修正", "url": "/2026/10/blog-post_08.html", "src": 3, "srcTitle": "林業署共管機制之法制化與滾動調整", "type": "題", "date": "", "q": "共管制度推出 2.0 版時，強化了哪些面向？", "o": ["性別比例、出缺補聘與退場機制", "會議便當、交通補助、開會時間與會議地點", "開會時間與會議地點", "取消部落代表席次"], "a": 0, "ex": "制度要滾動修正：共管 2.0 版強化了性別比例、出缺補聘與退場機制，讓共管會的組成更多元、運作更穩定。", "k": "退場機制", "d": "2.0 版強化的項目之一", "g": 2, "places": [], "people": []}, {"id": 1122, "island": "I7", "title": "共管事務分類", "url": "/2026/10/blog-post_08.html", "src": 3, "srcTitle": "林業署共管機制之法制化與滾動調整", "type": "題", "date": "", "q": "林業共管把事務分成哪幾類處理？", "o": ["共管會決議、行政契約、勞務委託", "口頭約定、私下協調、事後補件", "機關決定、部落配合、學者背書", "部落自理、機關不管、業者執行"], "a": 0, "ex": "共管講求權力分享、責任分擔：一般事務提共管會決議後執行，涉及權利義務的用行政契約，例如以森林巡護為基礎再疊加其他業務，勞務委託則依採購法辦理。", "k": "勞務委託", "d": "依採購法處理的那一類", "g": 3, "places": [], "people": []}, {"id": 1123, "island": "I7", "title": "試行與指標", "url": "/2026/05/blog-post_21.html", "src": 12, "srcTitle": "部落共管機制與組織營運：共管執行與觀光發展之展望", "type": "題", "date": "", "q": "共管合作要怎麼推進與檢討？", "o": ["試行改進，訂出行動方向與績效指標", "一次訂好規則不再更改，出問題就終止合作", "出現問題就終止合作關係", "由主管機關單方面評分"], "a": 0, "ex": "共管不必一開始就完美：先試行、再逐步改進，雙方共同討論需求與可行性，訂出可執行的行動方向與績效指標，作為檢討依據。", "k": "績效指標", "d": "檢討共管成效的衡量方式", "g": 2, "places": [], "people": []}, {"id": 1124, "island": "I7", "title": "經營主體", "url": "/2026/10/blog-post.html", "src": 4, "srcTitle": "公私共好－自然人文生態景觀區之觀光與地方權益共好", "type": "題", "date": "", "q": "自然人文生態景觀區要真正保護部落，誰應該是實際的經營主體？", "o": ["部落當經營主體，公所提供支援", "交由外地旅行社獨家經營，公所只負責收費", "由警察機關負責管理", "維持現狀，不設管理單位"], "a": 0, "ex": "霧臺經過共識凝聚、逐部落現勘與部落會議通過，劃設自然人文生態景觀區；由部落擔任實際經營主體，公所負責網站、監測與代收觀光保育費。", "k": "經營主體", "d": "實際負責經營的一方", "g": 3, "places": [], "people": []}, {"id": 1125, "island": "I7", "title": "共管五力", "url": "/2026/09/blog-post.html", "src": 5, "srcTitle": "部落整合－山林資源與部落產業共管案例", "type": "題", "date": "", "q": "部落要有能力參與共管，需要具備哪些能力？", "o": ["資金力、廣告力、人數力、關係力、抗爭力", "經費、場地、設備、交通、宣傳", "文化力、人才力、產業力、協商力、治理力", "法律顧問、會計、公關、秘書、司機"], "a": 2, "ex": "共管不是只要權利，也要有能力承擔；部落需要文化力、人才力、產業力、協商力與治理力，才能和公部門平起平坐地合作。", "k": "協商力", "d": "和公部門談判溝通的能力", "g": 3, "places": [], "people": []}, {"id": 1126, "island": "I7", "title": "共管像探戈", "url": "/2024/11/1131.html", "src": 34, "srcTitle": "113年交流分享會活動紀要（1）講師分享", "type": "題", "date": "", "q": "律師用「探戈需要兩人一起」比喻共管，想說明什麼？", "o": ["共管只需要一方積極主動，另一方配合就好", "共管只需要一方積極主動", "共管建立在雙方的瞭解與互信上", "共管講究浪漫，不必太嚴謹"], "a": 2, "ex": "探戈需要兩人一起跳，共管也是；它植基於雙方彼此欣賞、瞭解、互信與合作，只靠法規或只靠一方熱情都跳不起來。", "k": "探戈", "d": "需要兩人一起跳的舞", "g": 3, "places": [], "people": []}, {"id": 1127, "island": "I8", "title": "缺的是契機", "url": "/2018/07/1070628.html", "src": 77, "srcTitle": "培訓課程記錄：部落共同經營產業案例＠貓公部落", "type": "題", "date": "", "q": "觀察部落產業後，講者認為部落真正缺少的是什麼？", "o": ["大型的工廠", "外地的投資客", "更多的觀光巴士", "傳承的契機"], "a": 3, "ex": "部落產業多與傳統文化、生態守護相關，部落並非缺乏產業，而是缺乏傳承的契機；需要透過加值創新與異業串連，讓產業活下去。", "k": "傳承的契機", "d": "部落真正缺少的", "g": 1, "places": [], "people": []}, {"id": 1128, "island": "I8", "title": "長輩是夥伴", "url": "/2018/07/1070628.html", "src": 77, "srcTitle": "培訓課程記錄：部落共同經營產業案例＠貓公部落", "type": "題", "date": "", "q": "推動部落遊程時，應該怎麼看待參與的長輩？", "o": ["按日計酬的臨時人力", "負責表演的演出者", "一起推動遊程的夥伴", "不需要參與的旁觀者"], "a": 2, "ex": "長輩擁有知識與技藝，是共同推動遊程的夥伴，而不是被雇用的工作人員；尊重長輩的角色，遊程才有靈魂，長輩也更願意投入。", "k": "工作人員", "d": "長輩不該被當成的角色", "g": 3, "places": [], "people": []}, {"id": 1129, "island": "I8", "title": "回頭想想", "url": "/2018/07/1070628.html", "src": 77, "srcTitle": "培訓課程記錄：部落共同經營產業案例＠貓公部落", "type": "題", "date": "", "q": "原本的遊程客源流失時，部落比較好的應對是？", "o": ["降價促銷，先把客人搶回來", "模仿別人的熱門遊程", "回頭思索部落真正想做的事", "乾脆放棄觀光，另謀出路"], "a": 2, "ex": "客源流失時，與其降價或模仿，不如回頭思索部落真正想做的事；有部落就從水域運動轉向野菜採集與料理，反而找回獨特的價值。", "k": "真正想做", "d": "部落應回頭思索的事", "g": 2, "places": [], "people": []}, {"id": 1130, "island": "I8", "title": "加值串連", "url": "/2018/07/1070628.html", "src": 77, "srcTitle": "培訓課程記錄：部落共同經營產業案例＠貓公部落", "type": "題", "date": "", "q": "想讓傳統產業有新出路，可以朝哪兩個方向努力？", "o": ["削價競爭與大量生產", "加值創新與異業串連", "暫停生產與等待時機", "申請補助與擴大規模"], "a": 1, "ex": "傳統產業要有新出路，可以加值創新，例如把織布、小米酒變成體驗；也可以異業串連，與旅宿、餐飲、教育合作，擴大價值。", "k": "異業串連", "d": "和不同產業合作", "g": 2, "places": [], "people": []}, {"id": 1131, "island": "I8", "title": "一片拼圖", "url": "/2023/11/blog-post_14.html", "src": 40, "srcTitle": "開心農場示範點執行－貓公部落", "type": "題", "date": "", "q": "示範點和部落藍圖的關係是？", "o": ["示範點可以取代整份藍圖", "兩者各自獨立，沒有關係", "示範點是藍圖的一片拼圖", "示範點只是對外展示品"], "a": 2, "ex": "在駐地陪伴下盤點議題、發展遊程，示範點是願景藍圖的一片拼圖；一片片做出來、再回頭修正藍圖，願景就逐步成真。", "k": "一片拼圖", "d": "示範點在藍圖中的位置", "g": 1, "places": [], "people": []}, {"id": 1132, "island": "I8", "title": "全員換工", "url": "/2023/11/blog-post_14.html", "src": 40, "srcTitle": "開心農場示範點執行－貓公部落", "type": "題", "date": "", "q": "示範點施作時，部落以 mipaliw 精神全體參與，代表什麼？", "o": ["委託工程公司施作", "付費僱用臨時工", "只由幹部負責施作", "以換工互助凝聚部落"], "a": 3, "ex": "mipaliw 是阿美族的換工互助精神；示範點施作時全體以這種精神投入，修繕與建造就不只是工程，而是凝聚部落的過程。", "k": "mipaliw", "d": "阿美族的換工", "g": 3, "places": [], "people": []}, {"id": 1133, "island": "I8", "title": "故事經濟", "url": "/2023/12/blog-post.html", "src": 38, "srcTitle": "說自己的故事：我們是在海邊的布農族人－高山部落", "type": "題", "date": "", "q": "以故事經濟為願景的部落，組織上常朝什麼方向發展？", "o": ["持續仰賴計畫補助維持", "交給外地老闆投資經營", "維持個人經營，不需組織", "成立合作社並建立分潤機制"], "a": 3, "ex": "以故事經濟為願景，用文化故事創造價值；組織上朝合作社與分潤機制發展、以公司型態經營，讓青年看見回鄉工作的可能。", "k": "分潤機制", "d": "合作社分享收益的方式", "g": 3, "places": [], "people": []}, {"id": 1134, "island": "I8", "title": "分區資源藍圖", "url": "/2023/12/blog-post.html", "src": 38, "srcTitle": "說自己的故事：我們是在海邊的布農族人－高山部落", "type": "題", "date": "", "q": "以一個基地為核心規劃部落遊程，可以怎麼盤點資源？", "o": ["挑選幾個網路評價最高的熱門景點串成路線", "依網路評價排序資源", "參考其他部落的地圖修改", "以基地為圓心繪製分區資源藍圖"], "a": 3, "ex": "先用田野調查建立在地知識，再以團隊合作的方式，以基地為圓心繪製分區的地方資源藍圖，清楚看見周邊可以串聯的資源。", "k": "圓心", "d": "畫資源藍圖時的中心點", "g": 2, "places": [], "people": []}, {"id": 1135, "island": "I8", "title": "以價值定價", "url": "/2021/09/part1.html", "src": 55, "srcTitle": "部落旅遊商品訂價與上架實務 Part1", "type": "題", "date": "", "q": "部落遊程應該怎麼訂價？", "o": ["比對手便宜一點", "越貴越有質感", "以價值為基礎", "依心情隨時調整"], "a": 2, "ex": "價格應以價值為基礎，而不是盲從競爭對手；永續認證的業者即使價格較高，仍能獲得平台青睞，因為消費者願意為好的體驗付費。", "k": "價值", "d": "訂價的基礎", "g": 2, "places": [], "people": []}, {"id": 1136, "island": "I8", "title": "定價五步驟", "url": "/2021/09/part1.html", "src": 55, "srcTitle": "部落旅遊商品訂價與上架實務 Part1", "type": "題", "date": "", "q": "為部落遊程定價的步驟，正確的是？", "o": ["資訊→目標→成本→競爭→測試市場", "先喊價→再算成本→觀察對手→最後打折促銷", "照抄對手價格→微調→上架", "先降價→看反應→再漲價"], "a": 0, "ex": "定價要依序蒐集資訊、選定目標、估算成本、分析競爭，最後測試市場；用真實的回饋調整，價格才站得住。", "k": "測試市場", "d": "定價的最後一步", "g": 2, "places": [], "people": []}, {"id": 1137, "island": "I8", "title": "零售價怎麼算", "url": "/2021/11/part2.html", "src": 54, "srcTitle": "部落旅遊商品訂價與上架實務 Part2", "type": "題", "date": "", "q": "採用成本加成法時，零售價的正確算法是？", "o": ["成本直接乘以二", "對手價格打九折", "依整數抓一個價格", "淨價再加上分銷成本"], "a": 3, "ex": "成本加成法：淨價等於營運成本加淨利，零售價再加上佣金、廣告等分銷成本；漏算這一塊，賣越多可能虧越多。", "k": "分銷成本", "d": "佣金、廣告這類費用", "g": 2, "places": [], "people": []}, {"id": 1138, "island": "I8", "title": "多通路佣金", "url": "/2021/11/part2.html", "src": 54, "srcTitle": "部落旅遊商品訂價與上架實務 Part2", "type": "題", "date": "", "q": "同時在官網直銷和線上旅遊平台販售，要怎麼估算整體佣金？", "o": ["只看佣金最高的那個通路，用它來計算售價", "佣金很少，不必計算", "只看佣金最低的通路", "依各通路銷售比例加權計算"], "a": 3, "ex": "整體佣金率等於各通路銷售比例乘以各自抽成比例的加總；分銷比例越高，整體佣金越高，零售價也要跟著調整。", "k": "佣金率", "d": "通路抽成的比例", "g": 2, "places": [], "people": []}, {"id": 1139, "island": "I8", "title": "資源決定接待量", "url": "/2021/11/part2.html", "src": 54, "srcTitle": "部落旅遊商品訂價與上架實務 Part2", "type": "題", "date": "", "q": "「一棵香蕉樹只提供四片葉子」這件事，對遊程定價有什麼啟示？", "o": ["香蕉葉很便宜，可以大量使用", "依資源再生速度推算接待人數", "葉子不夠就向外地採購", "自然材料和定價沒有關係"], "a": 1, "ex": "遊程用到的自然材料有其再生速度；依香蕉葉的生長時間推算永續接待人數，接待量有限，價格就應反映這份稀少與價值。", "k": "再生速度", "d": "自然資源恢復的快慢", "g": 2, "places": [], "people": []}, {"id": 1140, "island": "I8", "title": "人事成本", "url": "/2021/11/part2.html", "src": 54, "srcTitle": "部落旅遊商品訂價與上架實務 Part2", "type": "題", "date": "", "q": "估算遊程成本時，部落夥伴的人事成本應該怎麼計算？", "o": ["大家都是義務幫忙，人事費用不必列入成本", "只計算外聘講師的費用", "以零用錢的標準象徵發放", "比照正式員工，至少以最低薪資計"], "a": 3, "ex": "人事成本宜比照正式員工、至少以最低薪資計算；把族人的付出當成免費，遊程看似便宜，卻無法讓人長期留下來。", "k": "最低薪資", "d": "人事成本至少的標準", "g": 3, "places": [], "people": []}, {"id": 1141, "island": "I8", "title": "共同與個人費用", "url": "/2021/11/part2.html", "src": 54, "srcTitle": "部落旅遊商品訂價與上架實務 Part2", "type": "題", "date": "", "q": "估算套裝行程成本時，為什麼要分「共同費用」與「個人費用」？", "o": ["兩種費用都按團收取固定金額，報帳比較方便", "兩種費用都按人頭直接相加", "共同費用依人數攤，個人費用每人算", "分開只是方便報帳，沒有差別"], "a": 2, "ex": "交通、導覽員、過路費等共同費用要依人數分攤，門票、餐食、體驗等個人費用則每人計算；分清楚，才能算出不同人數的正確售價。", "k": "共同費用", "d": "依人數分攤的那一類", "g": 2, "places": [], "people": []}, {"id": 1142, "island": "I8", "title": "永續有價值", "url": "/2021/09/part1.html", "src": 55, "srcTitle": "部落旅遊商品訂價與上架實務 Part1", "type": "題", "date": "", "q": "為什麼永續經營的旅遊業者，價格較高仍能被市場接受？", "o": ["市場上沒有競爭者，業者可以任意決定價格", "政府強制規定，旅客只能購買", "價格越高越好賣，是消費心理", "旅客重視永續，願為負責任旅遊付費"], "a": 3, "ex": "越來越多旅客重視永續、願意以更永續的方式旅遊；取得永續認證的業者即使價格較高，仍能獲得平台與旅客青睞。", "k": "永續認證", "d": "讓高價仍被接受的證明", "g": 1, "places": [], "people": []}, {"id": 1143, "island": "I8", "title": "市場分析", "url": "/2023/03/blog-post_30.html", "src": 45, "srcTitle": "培訓課程：用田調說故事－田調轉譯與應用", "type": "題", "date": "", "q": "設計新遊程時，用 STP 分析是要釐清什麼？", "o": ["成本控制、利潤計算、稅金申報與發票開立", "交通、住宿、餐飲", "市場區隔、目標客群、產品定位", "季節、天氣、溫度"], "a": 2, "ex": "STP 分析依序是市場區隔、選定目標與定位；先想清楚要賣給誰、和別人有什麼不同，再設計一日型或二日型的遊程。", "k": "STP", "d": "市場區隔、目標、定位", "g": 2, "places": [], "people": []}, {"id": 1144, "island": "I8", "title": "照顧長輩", "url": "/2025/03/blog-post_31.html", "src": 24, "srcTitle": "重安貓公交流｜文化是每天自然發生的事情，分享在部落是很自然的事情", "type": "題", "date": "", "q": "部落觀光以「優先照顧部落老人家」為核心，可以怎麼做？", "o": ["請長輩退休休息，部落觀光全部交給年輕人做", "請長輩捐款支持部落觀光", "只讓年輕人參與，減輕負擔", "工坊設在長輩家，讓長輩賺生活費"], "a": 3, "ex": "以照顧部落老人家為核心，成立文健站，把工坊設在長輩住家，透過野菜廚房與農場讓長輩參與、賺取生活費；觀光也成為照顧長輩的方式。", "k": "老人家", "d": "部落優先照顧的對象", "g": 3, "places": [], "people": []}, {"id": 1145, "island": "I9", "title": "大海是冰箱", "url": "/2021/08/blog-post.html", "src": 56, "srcTitle": "部落的海洋知識與應用", "type": "題", "date": "", "q": "阿美族說「大海就是我的冰箱」，代表什麼？", "o": ["海水溫度低，像冰箱一樣冷", "海洋是日常採集的生活場域", "海邊適合存放漁獲", "海洋主要用來發展觀光"], "a": 1, "ex": "對海岸阿美族來說，海洋是日常採集與文化的生活場域，就像家裡的冰箱；發展水域遊憩時，必須尊重這份生活與文化的連結。", "k": "冰箱", "d": "阿美族比喻海洋的家電", "g": 1, "places": [], "people": []}, {"id": 1146, "island": "I9", "title": "聽浪", "url": "/2021/08/blog-post.html", "src": 56, "srcTitle": "部落的海洋知識與應用", "type": "題", "date": "", "q": "部落的海洋知識中，怎麼判斷下海是否安全？", "o": ["看手機天氣預報就夠了，傳統方法已經不準確", "五感觀察浪勢，用聽浪判斷", "詢問遊客的下水經驗", "先下水試試，再決定"], "a": 1, "ex": "部落的海洋知識講究用五感觀察：看浪勢、聽浪聲，判斷水域是否安全；這些傳統知識也是設計水域遊程與安全教育的重要素材。", "k": "聽浪", "d": "用耳朵判斷海況", "g": 2, "places": [], "people": []}, {"id": 1147, "island": "I9", "title": "海洋知識傳承", "url": "/2021/08/blog-post.html", "src": 56, "srcTitle": "部落的海洋知識與應用", "type": "題", "date": "", "q": "部落的海洋知識是透過哪些管道傳承的？", "o": ["學校課程、教科書與網路上的教學影片", "網路影片與社群", "觀光手冊與解說牌", "年齡階級、潛伴團體與家族"], "a": 3, "ex": "海洋知識透過年齡階級的訓練、潛伴團體的共同下海，以及家族的口傳身教傳承下來；這些人際網絡就是知識的載體。", "k": "潛伴團體", "d": "一起下海的夥伴", "g": 3, "places": [], "people": []}, {"id": 1148, "island": "I9", "title": "先盤點再發展", "url": "/2025/03/blog-post_58.html", "src": 23, "srcTitle": "東海岸水域遊憩發展－以生態為本、公私共理為永續之計（上）", "type": "題", "date": "", "q": "東海岸要發展水域遊憩，第一步應該做什麼？", "o": ["先興建停車場、沖洗區，並招攬更多業者進駐", "招攬更多業者進駐", "舉辦大型水上活動", "盤點環境、海象風險與採集權益"], "a": 3, "ex": "水域遊憩要以生態為本：先盤點環境特性、海象風險與部落的採集權益，再謹慎決定發展模式；順序顛倒，就容易破壞生態、引發衝突。", "k": "採集權益", "d": "部落在水域的傳統權利", "g": 1, "places": [], "people": []}, {"id": 1149, "island": "I9", "title": "水域區劃", "url": "/2025/03/blog-post_58.html", "src": 23, "srcTitle": "東海岸水域遊憩發展－以生態為本、公私共理為永續之計（上）", "type": "題", "date": "", "q": "水域活動要怎麼分區？", "o": ["依業者需求與營運方便區劃，先申請先分配", "依敏感度、風險與活動強度區劃", "先到先選，依申請順序分配", "全部開放，由遊客自行選擇"], "a": 1, "ex": "分區要依水下資源的敏感度與海象風險，搭配活動的性質與強度；敏感的珊瑚區與易起流的地方，不宜在未充分宣導下開放。", "k": "敏感度", "d": "水下資源怕不怕干擾", "g": 2, "places": [], "people": []}, {"id": 1150, "island": "I9", "title": "陸域設施", "url": "/2025/03/blog-post_58.html", "src": 23, "srcTitle": "東海岸水域遊憩發展－以生態為本、公私共理為永續之計（上）", "type": "題", "date": "", "q": "發展水域遊憩時，為什麼要避免增設大量陸域設施？", "o": ["興建設施成本太高", "陸地景觀不夠美觀", "陸域設施可能讓泥沙覆蓋珊瑚", "興建設施的成本太高，而且陸地景觀不夠美觀"], "a": 2, "ex": "為水域活動增建停車場、沖洗區，可能讓泥沙流入海中覆蓋珊瑚；較好的做法是業者統一接駁、回據點盥洗，並推動總量管制。", "k": "總量管制", "d": "限制同時進入的人數", "g": 2, "places": [], "people": []}, {"id": 1151, "island": "I9", "title": "安全與執法", "url": "/2025/03/blog-post_58.html", "src": 23, "srcTitle": "東海岸水域遊憩發展－以生態為本、公私共理為永續之計（上）", "type": "題", "date": "", "q": "東海岸醫療資源有限，水域活動的安全要靠什麼加強？", "o": ["遊客自己小心就好", "依靠運氣，出事再處理", "業者安全宣導與證照執法", "禁止所有水域活動"], "a": 2, "ex": "東海岸醫療資源有限，一旦出事很難及時救援；要加強業者的安全宣導，並落實必備證照的執法，預防勝於治療。", "k": "證照", "d": "業者必須具備的資格", "g": 3, "places": [], "people": []}, {"id": 1152, "island": "I9", "title": "合作管理平台", "url": "/2025/03/blog-post_39.html", "src": 22, "srcTitle": "東海岸水域遊憩發展－以生態為本、公私共理為永續之計（下）", "type": "題", "date": "", "q": "建立水域遊憩資源合作管理平台，正確的推動順序是？", "o": ["公告辦法→開放使用→出事後監測→再檢討", "開放→監測→出事→檢討", "監測→分級→調查→分區→三方管理", "調查一次→公告→不再更動"], "a": 2, "ex": "合作管理平台先由專業團隊設計生態監測，再做敏感度分級與全年度的使用調查，接著共同討論分區；最後由部落、業者與東管處三方合作管理。", "k": "合作管理平台", "d": "部落、業者、公部門一起管水域的機制", "g": 2, "places": [], "people": []}, {"id": 1153, "island": "I9", "title": "自主監測", "url": "/2025/03/blog-post_39.html", "src": 22, "srcTitle": "東海岸水域遊憩發展－以生態為本、公私共理為永續之計（下）", "type": "題", "date": "", "q": "生態監測為什麼要輔導部落「自主監測」？", "o": ["可以節省監測經費，而且專家不願意長期投入", "專家不願意長期投入", "只是計畫要求的形式", "讓部落有能力守護並參與共管"], "a": 3, "ex": "由專業團隊設計因地制宜的監測機制，再輔導部落自主監測；部落有了資料與能力，就能持續守護，也能以平等的角色參與共管。", "k": "自主監測", "d": "部落自己做的生態紀錄", "g": 3, "places": [], "people": []}, {"id": 1154, "island": "I9", "title": "滾動調整", "url": "/2025/03/blog-post_39.html", "src": 22, "srcTitle": "東海岸水域遊憩發展－以生態為本、公私共理為永續之計（下）", "type": "題", "date": "", "q": "水域管理辦法訂好之後，應該怎麼處理？", "o": ["依監測結果三方持續滾動調整", "訂好就不能更改，以示公信", "每年廢除重訂，重新開始", "交由業者依營運需要調整"], "a": 0, "ex": "海洋環境與使用狀況會變動，管理辦法不是一次定案；由部落、業者與公部門依監測結果持續滾動調整，管理才會有效。", "k": "滾動調整", "d": "管理辦法持續修正的方式", "g": 2, "places": [], "people": []}, {"id": 1155, "island": "I9", "title": "海洋休息期", "url": "/2025/03/blog-post_34.html", "src": 25, "srcTitle": "駐地研究員交流會議－公部門與部落共好觀點交流（下）", "type": "題", "date": "", "q": "為了讓海洋環境恢復，管理上可以採取什麼措施？", "o": ["維持現狀，讓海洋自然恢復", "延長開放時間，分散人潮", "依監測資料適時設海洋休息期", "增設垃圾桶，加強清潔"], "a": 2, "ex": "透過監測與水域調查建立資料庫，看到環境承受壓力時，可以適時設置海洋環境休息期，讓生態有機會恢復。", "k": "休息期", "d": "讓海洋喘口氣的時段", "g": 2, "places": [], "people": []}, {"id": 1156, "island": "I9", "title": "兩點定位", "url": "/2025/07/blog-post.html", "src": 21, "srcTitle": "水域遊憩規劃培力工作坊（上）", "type": "題", "date": "", "q": "巡守隊用「兩點定位法」監測硨磲貝，方法是？", "o": ["用衛星影像判斷位置，再請遊客拍照回報", "用兩個固定地標測距並定期記錄", "依巡守員印象記錄", "請遊客拍照回報"], "a": 1, "ex": "兩點定位法是用兩個固定地標測距，確定每顆硨磲貝的位置，並定期記錄大小與外觀；颱風後還能發現它們移動了多少。", "k": "兩點定位法", "d": "用兩個地標定位", "g": 2, "places": [], "people": []}, {"id": 1157, "island": "I9", "title": "保育區公信力", "url": "/2025/07/blog-post.html", "src": 21, "srcTitle": "水域遊憩規劃培力工作坊（上）", "type": "題", "date": "", "q": "劃設海洋保育區時，怎麼讓規範更有公信力？", "o": ["由公部門單方面公告劃設，範圍越大越好", "保育區範圍越大越好", "部落與公部門、地方團體共同訂定", "由外地專家決定範圍"], "a": 2, "ex": "保育區劃定需要部落參與，與公部門及地方團體共同訂定；大家一起定的規則，才有公信力，也才會被遵守。", "k": "公信力", "d": "規則被大家信服的程度", "g": 3, "places": [], "people": []}, {"id": 1158, "island": "I9", "title": "巡守的態度", "url": "/2025/07/blog-post.html", "src": 21, "srcTitle": "水域遊憩規劃培力工作坊（上）", "type": "題", "date": "", "q": "海洋巡守隊面對違規採集的漁民，比較好的態度是？", "o": ["溝通理解漁民處境，追求生生不息", "一律依法開罰，並直接驅離以儆效尤", "直接驅離，不必多說", "睜一隻眼閉一隻眼"], "a": 0, "ex": "巡守隊不只是取締，更重視溝通與理解漁民的處境；目標是讓海洋生生不息，大家都能長久依靠這片海。", "k": "生生不息", "d": "巡守追求的目標", "g": 3, "places": [], "people": []}, {"id": 1159, "island": "I9", "title": "部落自律", "url": "/2025/07/blog-post_29.html", "src": 20, "srcTitle": "水域遊憩規劃培力工作坊（下）", "type": "題", "date": "", "q": "部落自主管理海洋資源的做法，例如？", "o": ["全年開放採集不設限制，把沙灘改建成停車場", "把沙灘改建成停車場", "採集季節、限制車輛、巡守隊", "交給遊客自行管理"], "a": 2, "ex": "有部落限定採集季節、秋冬禁獵，有部落設路障減少車輛進入沙灘，也有部落成立海洋巡守隊；部落的自我約束，是走向共管的基礎。", "k": "自我約束", "d": "部落自己管自己的力量", "g": 3, "places": [], "people": []}, {"id": 1160, "island": "I9", "title": "小港灣分區", "url": "/2026/07/blog-post_13.html", "src": 8, "srcTitle": "據點任務小組工作坊：水域遊憩分區管理作業的推動（石雨傘據點小組）", "type": "題", "date": "", "q": "港灣面積小，SUP、獨木舟、浮潛常互相碰撞，管理上可以怎麼做？", "o": ["全面開放水域，讓業者之間自行協調使用", "只開放水上摩托車", "限制動力遊憩，規劃器具與動線", "維持現狀，不必特別規劃"], "a": 2, "ex": "小港灣不適合水上摩托車等動力遊憩；非動力活動也可能碰撞，要依水域特性規劃器具與動線，並向業者與遊客宣導。", "k": "動力遊憩", "d": "水上摩托車這類活動", "g": 2, "places": [], "people": []}, {"id": 1161, "island": "I9", "title": "救生通道", "url": "/2026/07/blog-post_13.html", "src": 8, "srcTitle": "據點任務小組工作坊：水域遊憩分區管理作業的推動（石雨傘據點小組）", "type": "題", "date": "", "q": "居民反映礁石與地形讓擔架難以通行，規劃上的回應是？", "o": ["移除所有礁石", "禁止遊客上岸", "研議岸上救生綠色通道", "移除所有礁石，並禁止遊客上岸"], "a": 2, "ex": "救援時礁石與高低差會阻礙擔架通行；據點規劃要研議岸上救生綠色通道，把安全救援納入設計。", "k": "綠色通道", "d": "方便救援的岸上路線", "g": 2, "places": [], "people": []}, {"id": 1162, "island": "I9", "title": "關係社群", "url": "/2024/12/blog-post_3.html", "src": 31, "srcTitle": "致石雨傘美麗港灣背後的一群守護者", "type": "題", "date": "", "q": "在地居民與業者自發守護港灣、颱風前後動員清理，形成了什麼？", "o": ["彼此競爭的業者", "臨時招募的人力", "守護家園的關係社群", "短暫停留的觀光客"], "a": 2, "ex": "回鄉的教練帶頭推動垃圾減量，颱風前收好設備、風雨後動員清理；居民與業者自發守護家園，形成關係社群，是港區經營討論的重要夥伴。", "k": "關係社群", "d": "自發守護港灣的一群人", "g": 3, "places": [], "people": []}, {"id": 1163, "island": "I10", "title": "生命週期", "url": "/2024/07/blog-post_26.html", "src": 36, "srcTitle": "東管處據點任務小組工作坊（奇美遊憩區、都蘭鼻自然旅遊地）", "type": "題", "date": "", "q": "東管處據點任務小組怎麼讓各科同仁一起參與據點規劃？", "o": ["只由企劃科開會決定", "工程完工後再通知各科，由顧問全權處理", "跨科室分組，依計畫生命週期討論", "委由顧問全權處理"], "a": 2, "ex": "據點任務小組由企劃科協調遊憩、工務、管理等科室同仁分組，依計畫全案的生命週期，從規劃、設計到經營循序討論，形成相互支援的平台。", "k": "生命週期", "d": "從規劃到經營的完整時間軸", "g": 2, "places": [], "people": []}, {"id": 1164, "island": "I10", "title": "換位思考", "url": "/2024/07/blog-post.html", "src": 37, "srcTitle": "東管處據點任務小組工作坊（高台遊憩區、石雨傘水域遊憩基地）", "type": "題", "date": "", "q": "據點工作坊讓各科室「換位思考」，目的是？", "o": ["理解彼此考量，減少日後衝突", "找出別科的錯誤，並比較各科室的業績表現", "比較各科室的業績表現", "調換職位，熟悉業務"], "a": 0, "ex": "各科室分享經驗並換位思考：工務關心落實與請照，管理關心動線與積水，遊憩擔憂人力與行銷；理解彼此的考量，規劃才不會卡關。", "k": "換位思考", "d": "站在對方立場想", "g": 3, "places": [], "people": []}, {"id": 1165, "island": "I10", "title": "落實可行性", "url": "/2024/07/blog-post.html", "src": 37, "srcTitle": "東管處據點任務小組工作坊（高台遊憩區、石雨傘水域遊憩基地）", "type": "題", "date": "", "q": "據點規劃階段最容易忽略的是什麼？", "o": ["設計不夠華麗，吸引力不足，招牌也不夠大", "預算花得不夠多，品質不佳", "落實可行性，例如鹽分損壞設施", "招牌不夠大，遊客找不到"], "a": 2, "ex": "海邊鹽分高讓露營設施損壞，常與業者起衝突；工作坊發現規劃階段容易忽略落實可行性，要把維護與使用情境提早納入考量。", "k": "落實可行性", "d": "規劃時容易漏掉的", "g": 2, "places": [], "people": []}, {"id": 1166, "island": "I10", "title": "從抗爭到合作", "url": "/2024/12/blog-post_4.html", "src": 30, "srcTitle": "啟動都蘭鼻旅遊服務基地共好經營討論", "type": "題", "date": "", "q": "部落與公部門從長期對立走向合作，關鍵的轉折是？", "o": ["法院判決後，雙方依照判決結果各自執行", "共同盤點、梳理藍圖、平等對話", "公部門撤案，部落不再抗爭", "財團出面，提出補償方案"], "a": 1, "ex": "早年開發案未充分溝通引發長期對立；後來雙方一起討論議題、盤點資源、梳理部落藍圖，建立平等對話的平台，才從抗爭走向共好。", "k": "平等對話", "d": "雙方互相尊重的溝通方式", "g": 1, "places": [], "people": []}, {"id": 1167, "island": "I10", "title": "打破隔牆", "url": "/2024/12/blog-post_4.html", "src": 30, "srcTitle": "啟動都蘭鼻旅遊服務基地共好經營討論", "type": "題", "date": "", "q": "為了和部落建立平等對話，東管處內部做了什麼改變？", "o": ["增設新科室，專責部落事務", "打破科室隔牆，鼓勵公私共學", "減少與部落接觸，避免衝突", "把責任集中交給一位同仁"], "a": 1, "ex": "東管處打破科室隔牆，鼓勵公私共學，透過培力計畫建立平等的對話平台；機關內部先整合，對外合作才順暢。", "k": "科室隔牆", "d": "機關內部要打破的", "g": 3, "places": [], "people": []}, {"id": 1168, "island": "I10", "title": "培力經營主體", "url": "/2024/12/blog-post_4.html", "src": 30, "srcTitle": "啟動都蘭鼻旅遊服務基地共好經營討論", "type": "題", "date": "", "q": "據點建好之後要由誰經營？東管處的下一步是？", "o": ["永遠由公部門自行經營", "培力在地潛在經營主體", "交給外地財團長期經營", "先閒置，等待適合時機"], "a": 1, "ex": "據點的永續經營需要在地主體：下一步是啟動潛在經營主體的培力與討論，讓部落有能力接手，也以安居樂業吸引青年回鄉。", "k": "潛在經營主體", "d": "未來可能接手經營的在地團隊", "g": 3, "places": [], "people": []}, {"id": 1169, "island": "I10", "title": "轉型的挑戰", "url": "/2026/07/blog-post_15.html", "src": 7, "srcTitle": "據點任務小組工作坊：部落觀光產業的營運與轉型（都蘭據點小組）", "type": "題", "date": "", "q": "部落觀光從「計畫支持型組織」轉成「市場營運型品牌」，最大的挑戰是？", "o": ["人力負荷重、缺乏企業經營經驗", "遊客太多接待不完，加上經費多到用不完", "經費太多，用不完", "法規太寬鬆，難管理"], "a": 0, "ex": "從計畫支持型轉為市場營運型，部落面臨人力長期不足、缺乏企業經營經驗、分工難以精確等挑戰；需要建立收入來源與管理制度。", "k": "市場營運型", "d": "靠市場收入經營的型態", "g": 3, "places": [], "people": []}, {"id": 1170, "island": "I10", "title": "可複製收入", "url": "/2026/07/blog-post_15.html", "src": 7, "srcTitle": "據點任務小組工作坊：部落觀光產業的營運與轉型（都蘭據點小組）", "type": "題", "date": "", "q": "只靠遊程收入的經營模式人力負荷很重，該怎麼改善？", "o": ["接更多團，提高收入", "延長工時，增加場次", "降低價格，吸引客源", "開發可複製的收入來源"], "a": 3, "ex": "遊程收入高度仰賴人力，接越多團越累；要開發可複製的收入來源，例如文創商品或可標準化的服務，讓收入不完全綁在人力上。", "k": "可複製", "d": "不必每次都從頭做的收入特性", "g": 2, "places": [], "people": []}, {"id": 1171, "island": "I10", "title": "保留試錯空間", "url": "/2026/07/blog-post_15.html", "src": 7, "srcTitle": "據點任務小組工作坊：部落觀光產業的營運與轉型（都蘭據點小組）", "type": "題", "date": "", "q": "在據點開發階段，就應該為營運預留什麼？", "o": ["一次定案，避免反覆修改", "經費全部用在硬體建設", "投入資源並保留試錯空間", "先蓋好再想營運的事"], "a": 2, "ex": "營運模式很難一開始就正確，在開發階段就要投入資源、保留試錯與調整的空間；先小規模嘗試，再依結果修正。", "k": "試錯", "d": "在嘗試中修正錯誤", "g": 2, "places": [], "people": []}, {"id": 1172, "island": "I10", "title": "服務 SOP", "url": "/2026/07/blog-post_15.html", "src": 7, "srcTitle": "據點任務小組工作坊：部落觀光產業的營運與轉型（都蘭據點小組）", "type": "題", "date": "", "q": "部落營運團隊常缺少什麼，導致服務品質不穩定？", "o": ["更漂亮的工作制服與更醒目的大招牌", "更醒目的大招牌", "維持服務穩定的 SOP", "更多的網紅宣傳"], "a": 2, "ex": "部落營運常缺乏回應客人意見、維持服務穩定的 SOP 與管理量能；建立標準作業流程，才不會因為換人就換了品質。", "k": "服務穩定", "d": "SOP 要守住的東西", "g": 3, "places": [], "people": []}, {"id": 1173, "island": "I10", "title": "量體與量能", "url": "/2026/07/blog-post_15.html", "src": 7, "srcTitle": "據點任務小組工作坊：部落觀光產業的營運與轉型（都蘭據點小組）", "type": "題", "date": "", "q": "據點設計為什麼要「縮減量體」？", "o": ["節省設計與規劃的費用，讓外觀更美觀", "讓規模符合未來的營運量能", "因應土地面積不足", "讓建築外觀更美觀"], "a": 1, "ex": "據點蓋得太大，未來維護與經營都是負擔；設計時要考量後續的營運管理量能，必要時調整方案、縮減量體。", "k": "營運管理量能", "d": "蓋好後有沒有能力管", "g": 2, "places": [], "people": []}, {"id": 1174, "island": "I10", "title": "遊客回饋", "url": "/2026/07/blog-post.html", "src": 9, "srcTitle": "據點任務小組工作坊：部落遊程發展的現況與策略（奇美據點小組）", "type": "題", "date": "", "q": "部落怎麼持續精進遊程的操作細節？", "o": ["依照經營者的直覺調整", "透過遊客回饋調整內容", "參考其他部落直接照做", "維持原樣，不輕易改變"], "a": 1, "ex": "遊客意見回饋是最直接的檢討材料；部落透過回饋調整操作細節與內容，遊程就能一次比一次更好。", "k": "意見回饋", "d": "遊客告訴你的感受", "g": 2, "places": [], "people": []}, {"id": 1175, "island": "I10", "title": "客群分類", "url": "/2026/07/blog-post.html", "src": 9, "srcTitle": "據點任務小組工作坊：部落遊程發展的現況與策略（奇美據點小組）", "type": "題", "date": "", "q": "遊程品質與客源不穩定時，可以怎麼重新設計？", "o": ["依客群分類設計不同遊程", "一種行程賣給所有客人", "只推出最便宜的行程", "只推出最高價的行程"], "a": 0, "ex": "不同客群需要不同的遊程：依客群分類設計，例如給學術團體的深度行程、給一般遊客的高 CP 值行程，讓產品更精準。", "k": "客群分類", "d": "依客人類型分開設計", "g": 2, "places": [], "people": []}, {"id": 1176, "island": "I10", "title": "解說人才", "url": "/2026/07/blog-post.html", "src": 9, "srcTitle": "據點任務小組工作坊：部落遊程發展的現況與策略（奇美據點小組）", "type": "題", "date": "", "q": "想提升部落遊程的精緻度，人才上可以怎麼做？", "o": ["由一位解說員包辦全程", "取消解說，讓遊客拿著手冊自由體驗即可", "分訓水陸解說員，重寫解說腳本", "聘請外地導遊負責解說"], "a": 2, "ex": "水域與陸域的專業不同，要分別培訓解說員，並重新設計解說腳本；解說到位，遊程的精緻度與市場區隔就出來了。", "k": "解說腳本", "d": "解說員講述的內容設計", "g": 3, "places": [], "people": []}, {"id": 1177, "island": "I10", "title": "縮短等待", "url": "/2026/07/blog-post.html", "src": 9, "srcTitle": "據點任務小組工作坊：部落遊程發展的現況與策略（奇美據點小組）", "type": "題", "date": "", "q": "體驗活動常讓遊客等太久，可以怎麼改善？", "o": ["預製體驗半成品，設計完整流程", "請遊客自行等待，或乾脆取消耗時的活動", "取消耗時的體驗活動", "延長行程時間來因應"], "a": 0, "ex": "可以預製體驗的半成品縮短等待，同時設計從採集到餐桌的完整體驗；流程順了，遊客滿意，部落接待也比較輕鬆。", "k": "半成品", "d": "事先準備好一部分的材料", "g": 2, "places": [], "people": []}, {"id": 1178, "island": "I10", "title": "超越委外", "url": "/2024/11/blog-post.html", "src": 35, "srcTitle": "培訓課程：部落與公部門共好經營管理模式", "type": "題", "date": "", "q": "據點管理希望超越單純的「出租與委託經營」，朝什麼方向？", "o": ["兼具共管精神，兼顧雙方權益", "全面民營化，交由市場決定", "全部收回，由公部門自營", "暫時閒置，等待政策方向"], "a": 0, "ex": "單純的出租與委託經營，部落往往只是承包者；課程探討兼具原基法共管精神的據點管理方式，讓部落成為真正的合作夥伴。", "k": "出租與委託經營", "d": "單純的委外方式", "g": 3, "places": [], "people": []}, {"id": 1179, "island": "I10", "title": "硬體與軟體", "url": "/2025/03/blog-post_34.html", "src": 25, "srcTitle": "駐地研究員交流會議－公部門與部落共好觀點交流（下）", "type": "題", "date": "", "q": "公私合作經營據點時，常見的分工是？", "o": ["公部門包辦硬體與軟體，部落負責配合", "部落全部包辦", "公部門管硬體，部落管軟體與經營", "全部交給業者"], "a": 2, "ex": "公私合作時可以各司其職：管理處負責硬體建設，部落負責軟體內容與空間經營，並一起培訓專業人才。", "k": "硬體建設", "d": "公部門負責的部分", "g": 3, "places": [], "people": []}, {"id": 1180, "island": "I10", "title": "安居樂業", "url": "/2024/12/blog-post_4.html", "src": 30, "srcTitle": "啟動都蘭鼻旅遊服務基地共好經營討論", "type": "題", "date": "", "q": "據點經營與部落發展，最終希望達到什麼？", "o": ["遊客人數持續增加", "族人安居樂業，吸引青年回鄉", "周邊地價不斷上漲", "遊客人數持續增加，周邊地價跟著上漲"], "a": 1, "ex": "據點與觀光的最終目的，不是遊客人數，而是讓族人能在家鄉安居樂業；有工作、有尊嚴，青年才會願意回鄉。", "k": "安居樂業", "d": "吸引青年回鄉的條件", "g": 1, "places": [], "people": []}, {"id": 1181, "island": "I11", "title": "由下而上"
