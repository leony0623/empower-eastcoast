$("#plTools").addEventListener("click",e=>{const b=e.target.closest("[data-item]");if(!b||!PL||!PL.use)return;const k=b.dataset.item,it=ITEMS[k];
  if(!(G.items[k]>0)){toast(`${it.n}用完了，到柑仔店找婆婆買`);return}
  if(PL.use(k)===false){toast(`現在用不到${it.n}`);save();tools(PL.tools);return}G.items[k]--;itemFX(k);save();renderPlayer();tools(PL.tools)});
// ---- NPC gatekeeper
function askNpc(l,from,cb){const to=other(l,from);PL={npc:true,l,order:shuffle([0,1,2,3]),pick:null,cb,removed:[]};pm.hidden=false;
  $("#plEb").textContent=`${l.no} · ${LTYPE[l.type]} · ${ISL[from].name} → ${ISL[to].name}`;$("#plH").textContent=`${l.npc}擋住了去路`;
  PL.use=k=>{if(k!=="cut"||PL.pick!=null||PL.removed.length)return false;PL.removed=shuffle([0,1,2,3].filter(i=>i!==l.a)).slice(0,2);renderNpcQ()};tools(["cut"]);renderNpcQ()}
function renderNpcQ(){const l=PL.l,n=npcByName(l.npc),done=PL.pick!=null,ok=done&&PL.pick===l.a;
  $("#plB").innerHTML=`<div class="npcd"><div class="face">${card3D("npc:"+n.n,avatarSVG(npcLook(n),70),76,95)}</div><div class="bubble">要走這條${LTYPE[l.type]}，先回答我一個問題。<br><b>${esc(l.q)}</b></div></div>
   <div class="opts">${PL.order.filter(i=>!PL.removed.includes(i)).map(i=>{let c="";if(done){if(i===l.a)c="right";else if(i===PL.pick)c="wrong"}return `<button data-o="${i}" class="${c}" ${done?"disabled":""}>${esc(l.o[i])}</button>`}).join("")}</div>
   ${done?`<div class="key"><b>${ok?"答對了":"再想想"}</b>${goalChip(l.g)}${esc(l.ex)}</div>`:""}`;
  const quit=()=>{const cb=PL.cb;stopTimers();pm.hidden=true;PL=null;$("#plTools").innerHTML="";cb(false)};
  if(!done)foot([["先不走了",quit,"ghost"]]);
  else if(ok)foot([["繼續前進",()=>{const cb=PL.cb,l=PL.l;G.crossed[l.no]=true;gainXp(LINK_XP,`通過${l.no} +${LINK_XP} XP、+${COIN_LINK} 金幣`);gainCoins(COIN_LINK);save();pm.hidden=true;PL=null;$("#plTools").innerHTML="";refreshWorld();cb(true)},"boss"]]);
  else foot([["記住了，再答一次",()=>{PL.order=shuffle([0,1,2,3]);PL.pick=null;PL.removed=[];renderNpcQ()}],["先不走了",quit,"ghost"]]);
  $("#plB").querySelectorAll("[data-o]").forEach(b=>b.addEventListener("click",()=>{PL.pick=+b.dataset.o;renderNpcQ()}))}
// ---- monster dispatcher
const GT={quiz:"問答",lock:"密碼鎖",puzzle:"填空",tf:"是非",spot:"改錯偵探",order:"重組句子",match:"線索連連看",detective:"文章偵探"};
const TYPES=["quiz","lock","puzzle","tf","spot","order","match","detective"];
function chunksOf(s){let parts=s.split(/(?<=[，；：。、])/).filter(x=>x.trim());while(parts.length>4){let bi=0,bl=1e9;for(let i=0;i<parts.length-1;i++){const l=parts[i].length+parts[i+1].length;if(l<bl){bl=l;bi=i}}parts.splice(bi,2,parts[bi]+parts[bi+1])}
  if(parts.length<3){const n=3,L=Math.ceil(s.length/n);parts=[];for(let i=0;i<s.length;i+=L)parts.push(s.slice(i,i+L))}return parts}
const altOf=a=>shuffle(artsOf(a.island).map(x=>x.k).filter(k=>k!==a.k&&!a.ex.includes(k)))[0]||null;
const peersOf=(a,n)=>{const seen=new Set([a.k]),out=[a];for(const x of shuffle(artsOf(a.island)))if(x.id!==a.id&&!seen.has(x.k)&&!seen.has(x.d)&&out.length<n){seen.add(x.k);seen.add(x.d);out.push(x)}return out};
function gameType(a){let t=TYPES[a.id%TYPES.length];const n=peersOf(a,3).length;
  if((t==="tf"||t==="match"||t==="detective")&&n<3)t="quiz";if(t==="spot"&&!altOf(a))t="lock";if(t==="order"&&chunksOf(a.ex).length<3)t="puzzle";return t}
const masked=a=>{const i=a.ex.indexOf(a.k);return `${esc(a.ex.slice(0,i))}<span class="mask">${"？".repeat(a.k.length)}</span>${esc(a.ex.slice(i+a.k.length))}`};
function playMonster(id){const a=ART[id];if(G.at!==a.island||travel||cine){toast("先走到這座島上才能挑戰");return}const t=gameType(a);PL={a,t,timers:[],miss:0};
  $("#plEb").textContent=`${ISL[a.island].name} · ${GT[t]}小怪 · ${a.g?"目的"+"①②③"[a.g-1]:""} · +${artXp(a)} XP`;pm.hidden=false;GAMES[t](a)}
const GAMES={
 quiz(a){PL.order=shuffle([0,1,2,3]);PL.pick=null;PL.removed=[];PL.hinted=false;$("#plH").textContent="快問快答";
   PL.use=k=>{if(PL.pick!=null)return false;if(k==="cut"){if(PL.removed.length)return false;PL.removed=shuffle([0,1,2,3].filter(i=>i!==a.a)).slice(0,2)}else if(k==="hint"){if(PL.hinted)return false;PL.hinted=true}else return false;renderQuiz()};
   tools(["cut","hint"]);renderQuiz()},
 lock(a){const k=[...a.k],pool=[...new Set(QB.map(x=>x.k).join("").split(""))].filter(c=>!k.includes(c)&&/\S/.test(c));
   PL.wheels=k.map(ch=>{const opts=shuffle([ch,...shuffle(pool).slice(0,3)]);let pos=Math.random()*4|0;if(opts[pos]===ch)pos=(pos+1)%4;return {opts,pos,ch,fixed:false}});PL.open=false;PL.glass=false;PL.cutU=false;$("#plH").textContent="解開密碼鎖";
   PL.use=t=>{if(PL.open)return false;if(t==="hint"){const w=PL.wheels.find(w=>!w.fixed&&w.opts[w.pos]!==w.ch)||PL.wheels.find(w=>!w.fixed);if(!w)return false;w.pos=w.opts.indexOf(w.ch);w.fixed=true}
     else if(t==="cut"){if(PL.cutU)return false;PL.cutU=true;PL.wheels.forEach(w=>{if(w.fixed)return;const cur=w.opts[w.pos],keep=[w.ch,w.opts.find(c=>c!==w.ch)];w.opts=w.opts.filter(c=>keep.includes(c));w.pos=Math.max(0,w.opts.indexOf(cur))})}
     else if(t==="glass"){if(PL.glass)return false;PL.glass=true}else return false;renderLock()};
   tools(["hint","cut","glass"]);renderLock()},
 puzzle(a){const k=a.k,pool=[...new Set(artsOf(a.island).filter(x=>x.id!==a.id).map(x=>x.k).join("").split(""))].filter(c=>!k.includes(c)&&/\S/.test(c));
   PL.tiles=shuffle([...k.split(""),...shuffle(pool).slice(0,Math.max(3,7-k.length))]);PL.fill=[];PL.gone=[];$("#plH").textContent="重點填空";
   PL.use=h=>{if(h==="glass"){if(PL.gone.length)return false;const bad=PL.tiles.map((c,i)=>i).filter(i=>!k.includes(PL.tiles[i])&&!PL.fill.includes(i));if(!bad.length)return false;PL.gone=bad.slice(0,Math.ceil(bad.length/2));renderPuzzle();return}
     if(h!=="hint")return false;const ok=PL.fill.every((ti,i)=>PL.tiles[ti]===k[i]);if(!ok)PL.fill=[];if(PL.fill.length>=k.length)return false;const ch=k[PL.fill.length],i=PL.tiles.findIndex((c,j)=>c===ch&&!PL.fill.includes(j));PL.fill.push(i);renderPuzzle()};
   tools(["hint","glass"]);renderPuzzle()},
 tf(a){const ks=artsOf(a.island).map(x=>x.k),src=peersOf(a,3);
   PL.st=shuffle(src.map((x,i)=>{const alt=shuffle(ks.filter(k=>k!==x.k&&!x.ex.includes(k)))[0];const truth=i===1||!alt?true:i===2?false:Math.random()<.5;return {x,truth,text:truth?x.ex:x.ex.replace(x.k,alt),alt,term:truth?x.k:alt}}));
   PL.ans=[];PL.checked=false;PL.glass=false;$("#plH").textContent="是非判斷";
   PL.use=k=>{if(PL.checked)return false;if(k==="glass"){if(PL.glass)return false;PL.glass=true;renderTF();return}if(k!=="hint")return false;const i=PL.st.findIndex((s,j)=>PL.ans[j]!==s.truth);if(i<0)return false;PL.ans[i]=PL.st[i].truth;PL.lockI=(PL.lockI||[]).concat(i);renderTF()};tools(["hint","glass"]);renderTF()},
 spot(a){const alt=altOf(a),text=a.ex.replace(a.k,alt);const segs=[];text.split(/(?<=[，；：。、])/).forEach(part=>{const i=part.indexOf(alt);const pieces=i<0?[part]:[part.slice(0,i),alt,part.slice(i+alt.length)];
     pieces.forEach(p=>{if(!p)return;if(p===alt&&i>=0){segs.push({t:p,bad:true});return}for(let j=0;j<p.length;){const L=Math.min(p.length-j,4+(Math.random()*3|0));segs.push({t:p.slice(j,j+L),bad:false});j+=L}})});
   const others=shuffle([...new Set(artsOf(a.island).map(x=>x.k))].filter(k=>k!==a.k&&k!==alt)).slice(0,2);
   PL.segs=segs;PL.alt=alt;PL.found=false;PL.opts=shuffle([a.k,...others]);PL.pick=null;PL.off=[];PL.dim=[];$("#plH").textContent="改錯偵探";
   PL.use=k=>{if(PL.pick===a.k)return false;if(k==="hint"){if(PL.found)return false;PL.found=true}else if(k==="glass"){if(PL.found||PL.dim.length)return false;const ok=PL.segs.map((s,i)=>i).filter(i=>!PL.segs[i].bad);PL.dim=shuffle(ok).slice(0,Math.ceil(ok.length*.6))}
     else if(k==="cut"){if(!PL.found||PL.off.length)return false;PL.off=[PL.opts.find(o=>o!==a.k)]}else return false;renderSpot()};
   tools(["hint","glass","cut"]);renderSpot()},
 order(a){PL.chunks=chunksOf(a.ex);PL.shuf=shuffle(PL.chunks.map((_,i)=>i));PL.sel=[];$("#plH").textContent="重組重點句";
   PL.use=k=>{if(k!=="hint"&&k!=="glass")return false;if(k==="glass"&&PL.sel.length)return false;const okPre=PL.sel.every((v,i)=>v===i);if(!okPre)PL.sel=[];if(PL.sel.length>=PL.chunks.length)return false;PL.sel.push(PL.sel.length);renderOrder()};tools(["hint","glass"]);renderOrder()},
 match(a){const ps=peersOf(a,3);PL.ps=ps;PL.L=shuffle(ps.map((_,i)=>i));PL.R=shuffle(ps.map((_,i)=>i));PL.done=new Set();PL.sel=null;$("#plH").textContent="線索連連看";
   PL.use=k=>{if(k!=="hint")return false;const i=PL.ps.findIndex((_,j)=>!PL.done.has(j));if(i<0)return false;PL.done.add(i);PL.sel=null;renderMatch()};tools(["hint"]);renderMatch()},
 detective(a){const ps=peersOf(a,3);PL.ps=shuffle(ps);PL.step=0;PL.pick=null;PL.off=[];PL.glass=false;PL.kopts=shuffle([a.k,...ps.filter(x=>x.id!==a.id).map(x=>x.k)]);$("#plH").textContent="文章偵探";
   PL.use=k=>{if(k==="glass"){if(PL.glass)return false;PL.glass=true}else if(k==="cut"){if(PL.off.length)return false;PL.off=[PL.step===0?PL.ps.find(x=>x.id!==a.id).id:PL.kopts.find(x=>x!==a.k)]}else return false;renderDetective()};
   tools(["cut","glass"]);renderDetective()}
};
function renderQuiz(){const a=PL.a,done=PL.pick!=null,ok=done&&PL.pick===a.a;
  $("#plB").innerHTML=`<div class="qq">${esc(a.q)}</div>${PL.hinted&&!done?`<div class="key"><b>提示燈</b>關鍵詞是「${esc(a.k)}」：${esc(a.d)}</div>`:""}<div class="opts">${PL.order.filter(i=>!PL.removed.includes(i)).map(i=>{let cls="";if(done){if(i===a.a)cls="right";else if(i===PL.pick)cls="wrong"}return `<button data-o="${i}" class="${cls}" ${done?"disabled":""}>${esc(a.o[i])}</button>`}).join("")}</div>${done?keyBox(a):""}`;
  if(!done)foot([["離開",closePlay,"ghost"]]);else if(ok)foot([["收下獎勵",()=>winMonster(),"boss"]]);else foot([["記住了，再答一次",()=>{PL.order=shuffle([0,1,2,3]);PL.pick=null;PL.removed=[];renderQuiz()}],["離開",closePlay,"ghost"]]);
  $("#plB").querySelectorAll("[data-o]").forEach(b=>b.addEventListener("click",()=>{PL.pick=+b.dataset.o;if(PL.pick!==a.a){PL.miss++;toast("答錯了，先看看重點")}renderQuiz()}))}
function renderLock(){const a=PL.a;
  $("#plB").innerHTML=`<p class="meta" style="margin:0">「${esc(a.title)}」的重點被鎖起來了。轉動每一格，拼出缺少的關鍵詞再開鎖。</p><div class="blank">${masked(a)}</div>
   ${PL.glass&&!PL.open?`<div class="key"><b>放大鏡</b>線索：${esc(a.d)}</div>`:""}
   <div class="lockbox${PL.open?" open":""}" id="lockbox"><div class="shackle"></div><div class="wheels">${PL.wheels.map((w,i)=>`<div class="wheel${w.fixed?" fixed":""}"><button data-w="${i}" data-d="-1" aria-label="上一個字" ${PL.open||w.fixed?"disabled":""}>▲</button><b>${esc(w.opts[w.pos])}</b><button data-w="${i}" data-d="1" aria-label="下一個字" ${PL.open||w.fixed?"disabled":""}>▼</button></div>`).join("")}</div></div>
   ${PL.open?keyBox(a):""}`;
  foot(PL.open?[["收下獎勵",()=>winMonster(),"boss"]]:[["試著開鎖",()=>{if(PL.wheels.every(w=>w.opts[w.pos]===w.ch)){PL.open=true;renderLock()}else{PL.miss++;$("#lockbox").classList.add("shake");toast("鎖沒有打開，再想想線索")}},"boss"],["離開",closePlay,"ghost"]]);
  $("#plB").querySelectorAll("[data-w]").forEach(b=>b.addEventListener("click",()=>{const w=PL.wheels[+b.dataset.w],n=w.opts.length;w.pos=(w.pos+(+b.dataset.d)+n)%n;renderLock()}))}
function renderPuzzle(){const a=PL.a,k=a.k,n=k.length,idx=a.ex.indexOf(k),solved=PL.fill.length===n&&PL.fill.map(i=>PL.tiles[i]).join("")===k;
  const slots=Array.from({length:n},(_,i)=>`<span class="slot">${PL.fill[i]!=null?esc(PL.tiles[PL.fill[i]]):""}</span>`).join("");
  $("#plB").innerHTML=`<p class="meta" style="margin:0">這是「${esc(a.title)}」的重點，少了一個關鍵詞，依序點字把它補完整。</p><div class="blank" id="blank">${esc(a.ex.slice(0,idx))}${slots}${esc(a.ex.slice(idx+n))}</div>
   ${solved?`<div class="key"><b>延伸想一想</b>${esc(a.q)}答案：${esc(a.o[a.a])}。</div>`:`<div class="tiles">${PL.tiles.map((ch,i)=>PL.gone.includes(i)?"":`<button data-i="${i}" ${PL.fill.includes(i)?"disabled":""}>${esc(ch)}</button>`).join("")}</div>`}`;
  foot(solved?[["收下獎勵",()=>winMonster(),"boss"]]:[["清除",()=>{PL.fill=[];renderPuzzle()},"ghost"],["離開",closePlay,"ghost"]]);
  $("#plB").querySelectorAll(".tiles button").forEach(b=>b.addEventListener("click",()=>{PL.fill.push(+b.dataset.i);if(PL.fill.length===n){const w=PL.fill.map(i=>PL.tiles[i]).join("");renderPuzzle();
      if(w!==k){PL.miss++;$("#blank").classList.add("shake");toast("不對喔，再想想");setTimeout(()=>{if(!PL||PL.t!=="puzzle")return;PL.fill=[];renderPuzzle()},700)}}else renderPuzzle()}))}
function renderTF(){const lock=PL.lockI||[];
  const show=s=>{if(!PL.glass)return esc(s.text);const i=s.text.indexOf(s.term);return i<0?esc(s.text):`${esc(s.text.slice(0,i))}<mark>${esc(s.term)}</mark>${esc(s.text.slice(i+s.term.length))}`};
  $("#plB").innerHTML=`<p class="meta" style="margin:0">下面三句是島上文章的重點，有的被動了手腳。判斷每一句對不對。${PL.glass?"放大鏡標出了可能被換掉的詞。":""}</p>`+PL.st.map((s,i)=>{const chk=PL.checked,right=PL.ans[i]===s.truth;
   return `<div class="tf${chk?(right?" ok":" bad"):""}"><p>${show(s)}</p><div class="row"><button class="btn sm${PL.ans[i]===true?"":" ghost"}" data-tf="${i}" data-v="1" ${chk||lock.includes(i)?"disabled":""}>正確</button><button class="btn sm${PL.ans[i]===false?"":" ghost"}" data-tf="${i}" data-v="0" ${chk||lock.includes(i)?"disabled":""}>有錯</button></div>
    ${chk&&!s.truth?`<span class="meta">應該是「${esc(s.x.k)}」，不是「${esc(s.alt)}」。</span>`:""}</div>`}).join("");
  const allOk=PL.checked&&PL.st.every((s,i)=>PL.ans[i]===s.truth);
  if(!PL.checked)foot([["送出判斷",()=>{if(PL.ans.filter(x=>x!=null).length<3){toast("三句都要判斷");return}PL.checked=true;if(!PL.st.every((s,i)=>PL.ans[i]===s.truth))PL.miss++;renderTF()},"boss"],["離開",closePlay,"ghost"]]);
  else if(allOk)foot([["收下獎勵",()=>winMonster(),"boss"]]);else foot([["換一組再試",()=>{GAMES.tf(PL.a)}],["離開",closePlay,"ghost"]]);
  $("#plB").querySelectorAll("[data-tf]").forEach(b=>b.addEventListener("click",()=>{PL.ans[+b.dataset.tf]=b.dataset.v==="1";renderTF()}))}
function renderSpot(){const a=PL.a,solved=PL.pick===a.k;
  $("#plB").innerHTML=`<p class="meta" style="margin:0">${PL.found?"找到了！這個詞被偷偷換掉，原本應該是哪一個？":"這句重點裡有一個關鍵詞被換掉了。點出那個可疑的詞。"}</p>
   <div class="spot">${PL.segs.map((s,i)=>s.bad&&PL.found?`<span class="sg bad">${esc(solved?a.k:s.t)}</span>`:`<button class="sg${PL.dim.includes(i)?" dim":""}" data-s="${i}" ${PL.found||PL.dim.includes(i)?"disabled":""}>${esc(s.t)}</button>`).join("")}</div>
   ${PL.found&&!solved?`<div class="opts">${PL.opts.filter(o=>!PL.off.includes(o)).map(o=>`<button data-k="${esc(o)}" class="${PL.pick===o?"wrong":""}">${esc(o)}</button>`).join("")}</div>`:""}
   ${solved?keyBox(a):""}`;
  foot(solved?[["收下獎勵",()=>winMonster(),"boss"]]:[["離開",closePlay,"ghost"]]);
  $("#plB").querySelectorAll("[data-s]").forEach(b=>b.addEventListener("click",()=>{const s=PL.segs[+b.dataset.s];if(s.bad){PL.found=true;renderSpot()}else{PL.miss++;b.classList.add("shake");toast("這裡沒問題，再找找")}}));
  $("#plB").querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",()=>{PL.pick=b.dataset.k;if(PL.pick!==a.k){PL.miss++;toast("不是這個詞")}renderSpot()}))}
function renderOrder(){const ok=PL.sel.length===PL.chunks.length&&PL.sel.every((v,i)=>v===i);
  $("#plB").innerHTML=`<p class="meta" style="margin:0">「${esc(PL.a.title)}」的重點句被打散了，依序點選把它排回來。</p>
   <div class="blank">${PL.sel.map(i=>`<span class="chunk on">${esc(PL.chunks[i])}</span>`).join("")}${PL.sel.length<PL.chunks.length?`<span class="slot" style="width:3em"></span>`:""}</div>
   ${ok?`<div class="key"><b>延伸想一想</b>${esc(PL.a.q)}答案：${esc(PL.a.o[PL.a.a])}。</div>`:`<div class="chunks">${PL.shuf.map(i=>`<button class="chunk" data-c="${i}" ${PL.sel.includes(i)?"disabled":""}>${esc(PL.chunks[i])}</button>`).join("")}</div>`}`;
  foot(ok?[["收下獎勵",()=>winMonster(),"boss"]]:[["清除",()=>{PL.sel=[];renderOrder()},"ghost"],["離開",closePlay,"ghost"]]);
  $("#plB").querySelectorAll("[data-c]").forEach(b=>b.addEventListener("click",()=>{PL.sel.push(+b.dataset.c);if(PL.sel.length===PL.chunks.length&&!PL.sel.every((v,i)=>v===i)){PL.miss++;toast("順序不對，再排一次");PL.sel=[]}renderOrder()}))}
function renderMatch(){const all=PL.done.size===PL.ps.length;
  $("#plB").innerHTML=`<p class="meta" style="margin:0">左邊是這座島的關鍵詞，右邊是它們的線索。先點一個關鍵詞，再點它對應的線索。</p>
   <div class="match"><div>${PL.L.map(i=>`<button class="mk${PL.done.has(i)?" ok":""}${PL.sel===i?" on":""}" data-l="${i}" ${PL.done.has(i)?"disabled":""}>${esc(PL.ps[i].k)}</button>`).join("")}</div>
   <div>${PL.R.map(i=>`<button class="md${PL.done.has(i)?" ok":""}" data-r="${i}" ${PL.done.has(i)?"disabled":""}>${esc(PL.ps[i].d)}</button>`).join("")}</div></div>
   ${all?PL.ps.map(x=>`<div class="key"><b>${esc(x.k)}</b>${esc(x.ex)}</div>`).join(""):""}`;

  <dt>金幣與道具</dt><dd>打倒小怪 +8、通過協作道 +5、打倒島主 +30、寫心得 +2 金幣。道具要走到起航島和永續島之間棧道上的柑仔店，跟雜貨店婆婆買：刪去卡、提示燈、放大鏡。使用道具時會播放 3D 動畫。</dd>
  <dt>世界之樹</dt><dd>收齊 11 件信物後，世界之樹會從海裡升起，黃金拱橋接上產業島。走上島、打開樹下的寶箱，就能取得駐地研究員認證與寶藏。破關後可以在世界之樹或認證頁「重看結局動畫」。</dd>
  <dt>跟隨視角</dt><dd>角色移動時，鏡頭會在角色身後上方跟著走；移動提示列可以切換成鳥瞰視角。打島主、遇到引路人時會播放動畫，可以按「跳過動畫」。</dd>
  <dt>遊戲時間</dt><dd>預設跟著時鐘走：現實 3 小時是遊戲裡的一天，清晨、正午、黃昏、夜晚會自動變換。點太陽或月亮可以固定在某個時段，點時鐘回到自動。</dd>
  <dt>進度存在哪裡</dt><dd>預設存在這台裝置的瀏覽器裡。想換裝置也能接著玩，可以在遊戲模式左下角的角色卡按「雲端存檔」，用 Google 帳號登入；不登入也能完整遊玩。</dd></dl><p style="margin:10px 0 0"><button class="btn ghost sm" data-privacy>個資與隱私聲明</button></p></div>`,[["知道了",null]]));
