<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="東海岸永續培力島：駐地研究員學習地圖與 3D 闖關遊戲">
<title>東海岸永續培力島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+Hei+HK:wght@400;500;700;900&family=Patrick+Hand&display=swap">
<style>
/* Layout: full-bleed 3D archipelago on the left; on desktop a paper index/detail panel docks right (420px), on phones it becomes a bottom sheet. Single warm-paper look for UI; the scene carries its own dawn/noon/dusk/night lighting. */
:root{
  --paper:#FBF8F3; --paper-2:#F3ECE1; --card:#FFFFFF; --ink:#1E2326; --muted:#6F6A63; --line:#E8DFD3;
  --accent:#D8663A; --accent-soft:#FBE7DC; --sea:#2D7E8E; --gold:#E7B347; --good:#3D8C5A; --bad:#B8462C;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Fraunces",Georgia,"Times New Roman",serif;
  --f-quote:"LXGW WenKai TC","Kaiti TC","KaiTi",serif;
  --pw:420px; color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:#CFE7EE;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage,#lbls{position:fixed;top:0;left:0;bottom:0;right:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#lbls{pointer-events:none;z-index:3;overflow:hidden}
@media (min-width:1000px){#stage,#lbls{right:var(--pw)}}
#boot{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#CFE7EE;font-weight:700;font-size:18px;color:var(--ink);text-align:center;padding:24px}

/* HUD */
.tl{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,calc(env(safe-area-inset-left,0px) + 16px));display:grid;gap:10px;justify-items:start;pointer-events:none}
.tl>*{pointer-events:auto}
.brand{background:rgba(251,248,243,.94);backdrop-filter:blur(8px);border-radius:20px;padding:12px 18px 12px 16px;box-shadow:0 8px 28px rgba(40,50,55,.14);display:flex;gap:14px;align-items:center}
.brand .wm{font-weight:900;font-size:30px;line-height:1;letter-spacing:.02em;color:var(--accent)}
.brand .wm span{color:var(--ink)}
.brand .sb{font-size:12px;color:var(--muted);line-height:1.35;border-left:1px solid var(--line);padding-left:12px}
.brand .sb b{display:block;color:var(--ink);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tgroup{display:flex;gap:2px;background:rgba(251,248,243,.94);backdrop-filter:blur(8px);border-radius:18px;padding:5px;box-shadow:0 8px 28px rgba(40,50,55,.14)}
.tbtn{border:0;background:none;border-radius:13px;padding:6px 10px;display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--muted);min-width:46px}
.tbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbtn[aria-pressed="true"]{background:var(--ink);color:#fff}
.tbtn:hover{color:var(--ink)}
.tbtn[aria-pressed="true"]:hover{color:#fff}
.tr{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));display:flex;gap:8px;align-items:center}
@media (min-width:1000px){.tr{right:calc(var(--pw) + 16px)}}
.pill{display:inline-flex;background:rgba(251,248,243,.94);backdrop-filter:blur(8px);border-radius:16px;padding:4px;box-shadow:0 8px 28px rgba(40,50,55,.14)}
.pill button{border:0;background:none;border-radius:12px;padding:8px 14px;font-weight:700;color:var(--muted);font-size:14px}
.pill button[aria-pressed="true"]{background:var(--accent);color:#fff}
.sq{border:0;background:rgba(251,248,243,.94);border-radius:14px;padding:10px 14px;font-weight:700;box-shadow:0 8px 28px rgba(40,50,55,.14);font-size:14px}
#btnList{display:none}
@media (max-width:999px){#btnList{display:inline-block}}

/* labels */
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;border:0;background:#fff;color:var(--ink);border-radius:999px;padding:5px 13px 5px 11px;font-size:13.5px;font-weight:700;
  white-space:nowrap;box-shadow:0 4px 14px rgba(30,40,45,.2);display:flex;gap:7px;align-items:center}
.lbl .no{font-family:var(--f-num);font-style:italic;font-weight:600;color:var(--accent);font-size:14px}
.lbl .st{font-size:11px;font-weight:500;color:var(--muted)}
.lbl.sel{background:var(--ink);color:#fff;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--accent)}
.lbl.sel .st{color:#ddd}
.lbl.locked{background:rgba(255,255,255,.72);color:var(--muted)}
.lbl.beaten{background:#FFE9B5}
.lbl.open .st{color:var(--accent);font-weight:700}
.lbl svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2}
.pin{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;border:2px solid var(--accent);background:#fff;border-radius:999px;padding:3px 12px 3px 3px;display:flex;gap:7px;align-items:center;font-weight:700;font-size:13px;white-space:nowrap;box-shadow:0 4px 12px rgba(30,40,45,.18)}
.pin .pn{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px}
.pin.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.npcl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;border:0;background:rgba(30,35,38,.84);color:#FFF4E2;border-radius:999px;padding:2px 9px;font-size:11.5px;white-space:nowrap}
.pav{position:absolute;transform:translate(-50%,-100%);background:rgba(255,255,255,.8);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--muted);white-space:nowrap}

/* panel */
#panel{position:fixed;z-index:9;background:var(--paper);display:flex;flex-direction:column}
@media (min-width:1000px){#panel{top:0;right:0;bottom:0;width:var(--pw);border-left:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 22px) max(24px,calc(env(safe-area-inset-right,0px) + 24px)) calc(env(safe-area-inset-bottom,0px) + 16px) 26px}
  #panel .grab,#panel .shx{display:none}}
@media (max-width:999px){#panel{left:0;right:0;bottom:0;max-height:62%;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(30,40,45,.22);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px))}
  #panel.closed{display:none}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 6px}
.shx{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:10px;border:0;background:var(--paper-2);width:32px;height:32px;border-radius:50%}
.scroll{overflow-y:auto;min-height:0;display:grid;gap:16px;align-content:start;padding-bottom:12px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--accent);font-weight:700}
.h1{font-weight:900;font-size:30px;line-height:1.25;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:14px}
.cta{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1px solid #F1CDB9;background:var(--accent-soft);border-radius:18px;padding:14px 16px}
.cta b{display:block;font-size:16px}
.cta span{font-size:13px;color:var(--muted)}
.cta i{font-style:normal;color:var(--accent);font-size:20px}
.search{width:100%;font:inherit;border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;color:var(--ink)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px;font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.lvls{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.lvls span{display:flex;align-items:center;gap:5px}
.lvls i{width:10px;height:10px;border-radius:3px}
.idx{list-style:none;margin:0;padding:0}
.idx li{border-top:1px solid var(--line)}
.idx button{width:100%;border:0;background:none;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:14px 2px;text-align:left}
.idx .n{font-family:var(--f-num);font-style:italic;font-size:30px;color:var(--accent);line-height:1}
.idx .t{font-weight:700;font-size:17px;display:block}
.idx .d{font-size:12.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idx .c{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.idx .lk{grid-template-columns:52px minmax(0,1fr)}
.idx .bn{font-family:var(--f-num);font-style:italic;color:var(--sea);font-size:18px}
.res{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.res button{width:100%;text-align:left;border:0;background:#fff;border-radius:10px;padding:8px 10px;display:grid;gap:2px}
.res small{color:var(--muted)}
.back{justify-self:start;border:0;background:none;color:var(--muted);padding:0;font-size:13px}
.dh{display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px;align-items:center}
.emb{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-weight:900;font-size:26px;color:var(--ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.06)}
.dh h2{margin:0;font-weight:900;font-size:30px;line-height:1.15}
.lead{font-size:17px;margin:0;line-height:1.6}
.quote{margin:0;border-left:3px solid var(--accent);padding:4px 0 4px 16px;font-family:var(--f-quote);font-size:19px;line-height:1.6}
.quote cite{display:block;font-family:var(--f-body);font-style:normal;font-size:12px;color:var(--muted);margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%}
.sec{font-size:12.5px;letter-spacing:.14em;color:var(--muted);font-weight:700;margin:4px 0 -6px}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pt{background:#fff;border:1px solid var(--line);border-radius:16px}
.pt>button{width:100%;border:0;background:none;display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:13px 14px;text-align:left}
.pt .pn{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.pt .pt-t{font-weight:700;font-size:16px}
.pt .m{font-size:12.5px;color:var(--muted);white-space:nowrap}
.pt.open{border-color:var(--accent)}
.pt .more{padding:0 14px 14px 50px;display:grid;gap:8px}
.pt .more p{margin:0}
.al{list-style:none;margin:0;padding:0;display:grid}
.al li{border-top:1px solid var(--line);padding:8px 0;display:grid;gap:2px}
.al a{color:var(--ink);text-decoration:none;font-weight:500}
.al a:hover{color:var(--sea);text-decoration:underline}
.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{background:var(--paper-2);border-radius:5px;padding:0 6px}
.tag.g{background:#E3EFF3;color:#215C6D}
.lchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.lchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;text-align:left}
.lchip b{font-family:var(--f-num);font-style:italic;color:var(--sea);font-weight:600;background:#E3EFF3;border-radius:999px;padding:0 8px}
.lchip span{margin-left:auto;color:var(--muted)}
.why{font-size:13px;color:var(--muted)}
/* game panel */
.prog{display:grid;gap:5px}
.prog .meta{justify-content:space-between}
.bar{height:8px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:99px;transition:width .5s}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:12px;padding:9px 16px;font-weight:700}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.boss{background:var(--accent);border-color:var(--accent)}
.btn.sm{padding:4px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mon{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mon li{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:6px}
.mon .tt{font-weight:500}
.done{color:var(--good);font-weight:700;font-size:13px}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px;text-align:center}
.tiers span{border-radius:9px;padding:5px 0;background:var(--paper-2);color:var(--muted);font-weight:700}
.tiers span.ok{background:var(--gold);color:var(--ink)}
.tiers span.now{background:var(--ink);color:#fff}
.st-l{font-size:12px;color:var(--muted)}
.st-o{font-size:12px;color:var(--accent);font-weight:700}
.st-b{font-size:12px;color:#8C6400;font-weight:700}

/* player card */
.player{position:fixed;z-index:7;left:max(16px,calc(env(safe-area-inset-left,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:rgba(251,248,243,.96);border-radius:18px;padding:10px 14px;box-shadow:0 8px 28px rgba(40,50,55,.18);
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:min(360px,calc(100% - 32px))}
@media (max-width:999px){.player{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 188px);left:auto;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));width:min(300px,calc(100% - 32px));padding:8px 10px}}
.player .av{grid-row:span 2;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px}
.player .nm{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player .nm small{font-weight:500;color:var(--muted)}
.player .tt{font-size:12px;color:var(--muted)}
.player .bar{grid-column:2/4}
.player .ft{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.player .ft button{border:0;background:none;padding:0;text-decoration:underline;color:var(--muted);font-size:12px}
.puz{grid-row:span 2;display:grid;grid-template-columns:repeat(4,12px);gap:2px}
.puz i{width:12px;height:12px;border-radius:3px;background:#E1D9CC}
.puz i.on{background:var(--gold)}
.puz i.hq{background:#C9BFAF}
.puz i.hq.on{background:var(--accent)}

/* modals */
.modal{position:fixed;inset:0;z-index:20;background:rgba(18,26,30,.5);display:grid;place-items:center;padding:16px}
.card{background:var(--paper);border-radius:22px;max-width:500px;width:100%;max-height:calc(100% - 32px);overflow-y:auto;padding:22px;display:grid;gap:14px;box-shadow:0 24px 70px rgba(0,0,0,.3)}
.card h2{font-weight:900;font-size:26px;margin:0;line-height:1.25}
.card p{margin:0}
.card label{font-size:13px;color:var(--muted);display:grid;gap:5px}
.card input[type=text],.card select,.card textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink)}
.card textarea{min-height:64px;resize:vertical}
.avs{display:flex;gap:8px;flex-wrap:wrap}
.avs button{border:2px solid transparent;border-radius:12px;background:#fff;padding:6px 11px;display:flex;gap:6px;align-items:center;font-size:14px}
.avs button[aria-pressed="true"]{border-color:var(--ink)}
.avs i{width:14px;height:14px;border-radius:50%}
.warn{font-size:12.5px;color:#8A4B12;background:#FBEBD6;border-radius:9px;padding:7px 11px}
.qq{font-weight:700;font-size:17px;line-height:1.5}
.opts{display:grid;gap:8px}
.opts button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;line-height:1.45}
.opts button.right{border-color:var(--good);background:#E3F2E7}
.opts button.wrong{border-color:var(--bad);background:#F9E1DA}
.opts button:disabled{cursor:default;color:var(--ink)}
.key{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:14.5px}
.key b{display:block;font-size:12px;letter-spacing:.12em;color:var(--accent);margin-bottom:2px}
.flip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fc{aspect-ratio:4/5;border:0;background:none;padding:0;perspective:700px;max-width:100%}
.fc .in{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.open .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;display:grid;place-items:center;padding:6px;font-size:13px;line-height:1.35;text-align:center}
.fc .f{background:repeating-linear-gradient(135deg,#2C8696 0 10px,#34909F 10px 20px);color:#E8F6F4;font-weight:900;font-size:22px;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.14)}
.fc .b{transform:rotateY(180deg);background:#fff;border:1px solid var(--line)}
.fc .b small{display:block;font-size:10.5px;color:var(--muted)}
.fc .b strong{font-size:15px}
.fc.match .b{background:#E3F2E7;border-color:var(--good)}
.blank{font-size:16.5px;line-height:1.85;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.blank .slot{display:inline-grid;place-items:center;width:1.6em;height:1.6em;margin:0 1px;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:5px;vertical-align:middle;font-weight:900}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tiles button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:19px;font-weight:900;box-shadow:0 3px 0 var(--line)}
.tiles button:disabled{opacity:.25}
.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.win{font-family:var(--f-num);font-style:italic;font-size:40px;color:var(--accent);text-align:center;line-height:1}
.toast{position:fixed;z-index:30;left:50%;top:calc(env(safe-area-inset-top,0px) + 168px);transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:9px 18px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
@media (min-width:1000px){.toast{left:calc((100% - var(--pw))/2)}}
@media (max-width:999px){.toast{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 50%)}}
.help dl{margin:0;display:grid;gap:8px}
.help dt{font-weight:700}
.help dd{margin:0;color:var(--muted);font-size:14px}
@media (max-width:640px){
  .brand{padding:9px 12px;gap:10px;border-radius:16px}.brand .wm{font-size:22px}.brand .sb{display:none}
  .tbtn{min-width:36px;padding:6px 7px}.tbtn span{display:none}.tgroup{border-radius:14px;padding:4px}
  .tr{top:calc(env(safe-area-inset-top,0px) + 14px)}
  .pill button{padding:7px 10px;font-size:13px}.sq{padding:8px 10px;font-size:13px}
  .tl{top:calc(env(safe-area-inset-top,0px) + 66px)}
  .h1{font-size:25px}.dh h2{font-size:25px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* v4 additions: creator, NPC dialogue, bosses, tokens, travel */
.card.wide{max-width:760px}
.cr{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:640px){.cr{grid-template-columns:minmax(0,1fr)}.cr .pv{position:static}}
.pv{position:sticky;top:0;display:grid;justify-items:center;gap:6px;background:linear-gradient(#EAF5F7,#FBF8F3);border-radius:18px;padding:12px}
.pv .pet{width:62px;height:62px}
.pv .nm{font-weight:900;font-size:18px}
.opt{display:grid;gap:6px}
.opt>span{font-size:13px;color:var(--muted);font-weight:700}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.chs{display:flex;gap:6px;flex-wrap:wrap}
.chs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 11px;font-size:13.5px}
.chs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pets{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:640px){.pets{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pets button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:4px 2px 6px;display:grid;justify-items:center;font-size:12.5px;font-weight:700}
.pets button svg{width:46px;height:46px}
.pets button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.npcd{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:start}
.npcd .face{width:76px;height:95px;border-radius:14px;background:#EAF5F7;display:grid;place-items:center;overflow:hidden}
.bubble{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;position:relative}
.bossart{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;background:#2A2F3A;color:#fff;border-radius:16px;padding:10px 14px}
.bossart svg{width:96px;height:96px}
.bossart b{font-size:18px;display:block}
.bossart span{font-size:13.5px;color:#E7E2D8}
.bossart.down{background:#E3F2E7;color:var(--ink)}
.bossart.down span{color:var(--muted)}
.tokbig{display:grid;justify-items:center;gap:6px;text-align:center}
.tokbig svg{width:110px;height:110px;filter:drop-shadow(0 6px 14px rgba(232,180,74,.45))}
.bag{display:flex;gap:3px;flex-wrap:wrap;grid-column:1/-1}
.bag i{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;background:#EFE8DC;opacity:.35}
.bag i.on{opacity:1;background:#FFF1CF}
.bag svg{width:18px;height:18px}
.player .av{background:#EAF5F7!important;overflow:hidden}
.player .av svg{width:38px;height:38px}
.travel{position:fixed;z-index:12;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:#fff;border-radius:999px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.travel button{border:0;background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:700}
@media (min-width:1000px){.travel{left:calc((100% - var(--pw))/2)}}
.rule{background:#fff;border:1px dashed #E2C9B8;border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.rule b{color:var(--ink)}
.go{display:grid;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px;color:var(--muted)}
.steps li b{color:var(--ink)}
.ltype{font-size:11px;border-radius:5px;padding:0 6px;background:#E3EFF3;color:#215C6D;font-weight:700}
/* v5: items, new games */
.itools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.itools:empty{display:none}
.itm{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px 4px 8px;display:inline-flex;gap:5px;align-items:center;font-size:13px;font-weight:700}
.itm svg{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.itm b{background:var(--paper-2);border-radius:999px;padding:0 6px;font-size:12px}
.coin{width:16px;height:16px;vertical-align:-3px;margin-right:2px}
.cn{display:inline-flex;align-items:center;gap:2px}
.shop{display:grid;gap:8px}
.si{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.si svg{width:28px;height:28px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.si b{display:block}.si span{display:block;font-size:13px;color:var(--muted)}
.player .ft button{margin-left:4px}
.tf{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.tf p{margin:0;font-size:14.5px}
.tf.ok{border-color:var(--good);background:#F1F8F3}.tf.bad{border-color:var(--bad);background:#FCF0EC}
.mstat{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-weight:700}
.moles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hole{aspect-ratio:1.4;border:0;border-radius:50% 50% 14px 14px/40% 40% 14px 14px;background:radial-gradient(ellipse at 50% 85%,#6E5238 0 45%,#9C7A57 46%);display:grid;place-items:end center;padding:4px;overflow:hidden;max-width:100%}
.hole span{display:block;width:100%;background:#F3D9A6;border-radius:12px 12px 6px 6px;padding:6px 4px;font-size:12px;font-weight:700;line-height:1.3;transform:translateY(110%);transition:transform .18s}
.hole.up span{transform:translateY(0)}
.hole:disabled{cursor:default}
.chunks{display:flex;flex-wrap:wrap;gap:8px}
.chunk{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-size:14px;text-align:left;line-height:1.45}
.chunk:disabled{opacity:.3}
.chunk.on{display:inline;border:0;padding:0;background:none}
ol.tl{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:14px}
ol.tl b{color:var(--accent);margin-right:6px;font-variant-numeric:tabular-nums}
.catch{position:relative;height:260px;border-radius:14px;background:linear-gradient(#DFF2F5,#BFE3EA);overflow:hidden}
.fall{position:absolute;top:-38px;border:0;background:#fff;border-radius:999px;padding:6px 12px;font-weight:900;font-size:14px;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform 3.4s linear;white-space:nowrap}
.fall.glow{background:#FFE9B5;box-shadow:0 0 0 3px var(--gold)}
.hp{display:flex!important;gap:4px;align-items:center;margin-top:4px}
.hp i{width:14px;height:14px;border-radius:50%;background:#555;display:inline-block}
.hp i.on{background:#E2584A}

/* v6: cinematic overlay, shop and hub labels, certificate */
.pav.hub{background:rgba(255,246,226,.92);color:#8C5A2E;font-weight:700}
.pav.shop{pointer-events:auto;border:0;background:#C9473A;color:#fff;font-weight:900;font-size:12.5px;padding:3px 11px;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.2);letter-spacing:.08em}
.cine{position:fixed;inset:0;z-index:15;pointer-events:none}
.cine .cb{position:absolute;left:0;right:0;height:7vh;background:#0C1215;animation:cbIn .45s ease-out both}
.cine .cb.t{top:0}.cine .cb.b{bottom:0}
@keyframes cbIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.cine .ctx{position:absolute;left:50%;bottom:calc(7vh + 16px);transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;display:flex;gap:12px;align-items:center;pointer-events:auto;background:rgba(14,20,24,.82);color:#fff;border-radius:999px;padding:8px 8px 8px 18px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.cine .ctx span{min-width:0}
.cine .ctx button{border:0;background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:700;white-space:nowrap;flex:none}
@media (min-width:1000px){.cine .ctx{left:calc((100% - var(--pw))/2);max-width:calc(100vw - var(--pw) - 32px)}}
body.cineon .tl,body.cineon .tr,body.cineon .player,body.cineon .travel,body.cineon #lbls{opacity:0;pointer-events:none!important;transition:opacity .3s}
body.cineon #lbls *{pointer-events:none!important}
@media (prefers-reduced-motion:reduce){.cine .cb{animation:none}}
.cert{border:2px solid var(--gold);border-radius:18px;padding:14px;background:linear-gradient(160deg,#FFFBF1,#FBF1DA);display:grid;gap:10px;position:relative}
.cert:before{content:"";position:absolute;inset:5px;border:1px dashed #E2C98E;border-radius:13px;pointer-events:none}
.cert-h{display:grid;justify-items:center;text-align:center;gap:2px}
.cert-h span{font-size:12px;color:var(--muted);letter-spacing:.12em}
.cert-h b{font-size:22px;font-weight:900;letter-spacing:.06em;color:#7A5320}
.cert-b{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px;align-items:center}
.cert-av{position:relative;width:100px;height:110px;border-radius:14px;background:#EAF5F7;display:grid;place-items:center;overflow:hidden}
.cert-av i{position:absolute;right:2px;bottom:2px;width:40px;height:40px}.cert-av i svg{width:40px;height:40px}
.cert-nm{font-size:22px;font-weight:900}
.cert-b p{margin:6px 0 0;font-size:14px;line-height:1.6}
.cert-st{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.cert-st span{background:#fff;border-radius:10px;padding:6px 2px;font-size:12px;color:var(--muted);display:grid}
.cert-st b{font-family:var(--f-num);font-size:18px;color:var(--ink)}
.cert-f{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);border-top:1px solid #EAD9B4;padding-top:8px}
.treas{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.treas li{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700;font-size:14px}
.treas li svg{width:22px;height:22px;flex:none}.treas li b{color:var(--gold);width:22px;text-align:center}
.kwr{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.lvp{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted);margin-right:2px}.lvp i{width:9px;height:9px;border-radius:50%;display:inline-block}
.kw{background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12.5px}
@media (max-width:420px){.cert-b{grid-template-columns:80px minmax(0,1fr)}.cert-av{width:80px;height:92px}.cert-st b{font-size:16px}}

/* v7: puzzle games, 3D icons, item clip */
.mask{display:inline-block;background:#2A2F3A;color:#FFE6A6;border-radius:6px;padding:0 6px;letter-spacing:.15em;font-weight:900}
.lockbox{position:relative;display:grid;justify-items:center;padding:34px 12px 14px;background:linear-gradient(#F6EBD6,#EAD8B6);border-radius:18px;border:2px solid #C9A46A;transition:transform .3s}
.lockbox .shackle{position:absolute;top:-6px;width:96px;height:56px;border:12px solid #9AA3AA;border-bottom:0;border-radius:48px 48px 0 0;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.lockbox.open .shackle{transform:translateY(-22px) rotate(-18deg);transform-origin:right bottom}
.lockbox.open{border-color:var(--good);background:linear-gradient(#EFF8EF,#DDEFDF)}
.wheels{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}
.wheel{display:grid;justify-items:center;gap:2px;background:#2A2F3A;border-radius:12px;padding:4px;box-shadow:inset 0 0 0 2px #464D59}
.wheel b{display:grid;place-items:center;width:48px;height:52px;background:linear-gradient(#FFFFFF,#EDE6DA 50%,#FFFFFF);border-radius:8px;font-size:24px;font-weight:900;color:var(--ink)}
.wheel button{border:0;background:none;color:#FFE6A6;font-size:14px;width:48px;height:26px;border-radius:6px}
.wheel button:disabled{opacity:.3}
.wheel.fixed b{background:linear-gradient(#FFF6DA,#F6D27A)}
.spot{display:flex;flex-wrap:wrap;gap:4px;font-size:16.5px;line-height:1.6;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.sg{border:1px dashed transparent;background:#FBF8F3;border-radius:6px;padding:2px 4px;font:inherit;color:inherit}
.sg:hover:not(:disabled){border-color:var(--accent)}
.sg.dim{opacity:.35}.sg:disabled{cursor:default}
.sg.bad{background:#FCE3DA;color:var(--bad);font-weight:900;border:1px solid var(--bad);text-decoration:line-through wavy}
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px}
.match>div{display:grid;gap:8px;align-content:start}
.mk,.md{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;text-align:left;font-size:14.5px;line-height:1.45}
.mk{font-weight:900;font-size:16px}
.mk.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.mk.ok,.md.ok{border-color:var(--good);background:#EAF5EC;color:var(--good)}
.clue{background:#2A2F3A;color:#F3EDE3;border-radius:14px;padding:12px 14px;font-size:15.5px;line-height:1.75}
.clue b{display:block;color:#FFE6A6;font-size:12.5px;letter-spacing:.1em;margin-bottom:2px}
mark{background:#FFE6A6;border-radius:4px;padding:0 2px}
.i3d{display:block;width:100%;height:100%;object-fit:contain}
.bag i img{width:21px;height:21px}
.tokbig img{width:130px;height:130px;filter:drop-shadow(0 8px 16px rgba(232,180,74,.45))}
.bossart img{width:96px;height:96px}
.emb img{width:86%;height:86%}
.treas li img{width:26px;height:26px;flex:none}
.itm img{width:22px;height:22px;margin:-3px 0}
.si img{width:40px;height:40px}
.ifx{position:fixed;z-index:26;left:50%;top:50%;width:280px;height:280px;margin:-190px 0 0 -140px;pointer-events:none;opacity:0;transition:opacity .2s}
.ifx.on{opacity:1}
@media (max-width:640px){.match{grid-template-columns:minmax(0,1fr)}.wheel b{width:42px;height:46px;font-size:21px}.wheel button{width:42px}}

/* v8: 3D turntable cards */
.c3dw{display:inline-block;position:relative;vertical-align:middle;line-height:0}
.c3dw canvas{display:block;cursor:grab;touch-action:none}
.c3dw canvas:active{cursor:grabbing}
.c3dw .fb{display:none}
.c3dw.nogl canvas{display:none}.c3dw.nogl .fb{display:block;width:100%;height:100%}
.c3dw.nogl .fb svg{width:100%;height:100%}
.pv #pvAv{display:grid;justify-items:center;gap:4px}
.npcd .face .c3dw{width:76px!important;height:95px!important}
.player .av .c3dw{width:44px!important;height:44px!important}
.goalchip{display:table;margin:3px 0 6px;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid currentColor;line-height:1.6;letter-spacing:.02em}
.goalchip.g1{color:#C2562E}.goalchip.g2{color:#1F7FA0}.goalchip.g3{color:#3E8A4E}
.goals{display:grid;gap:8px;margin-bottom:6px}
.goal{border:1px solid var(--line,#e5dccb);border-radius:12px;background:rgba(255,255,255,.7);padding:0}
.goal summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px 12px}
.goal summary::-webkit-details-marker{display:none}
.goal summary b{display:block;font-size:14.5px}.goal summary small{display:block;font-size:12.5px;opacity:.75;margin-top:2px;line-height:1.45}
.goal .gn{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff}
.goal.g1 .gn{background:#C2562E}.goal.g2 .gn{background:#1F7FA0}.goal.g3 .gn{background:#3E8A4E}
.goal ul{margin:0;padding:0 14px 12px 34px;display:grid;gap:6px;font-size:13.5px;line-height:1.6}
.goal[open] summary{border-bottom:1px dashed var(--line,#e5dccb)}
.sg{margin:6px 0 10px}.sgh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin:10px 0 2px}
.sgh .pn{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;background:var(--sea,#1F7FA0)}
.lchips{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))!important}
.lchip{white-space:nowrap}
.lchip span{flex:none}
details.more-arts{list-style:none}
details.more-arts>summary{list-style:none;cursor:pointer}
details.more-arts>summary::-webkit-details-marker{display:none}
details.more-arts{margin-top:10px}
details.more-arts>summary{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:13px 14px}
details.more-arts .pn{background:var(--gold,#E0A43A)}
.linkb{border:0;background:none;padding:0;color:var(--sea,#1F7FA0);text-decoration:underline;font:inherit;cursor:pointer}
.privacy dd{line-height:1.7}
.player .ft button#cloudB{white-space:nowrap}
.savemode{display:grid;gap:8px;border:1px solid var(--line,#e5dccb);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.6)}
.savemode .lab{font-size:13px;color:var(--muted);font-weight:700}
.savemode label{display:grid;grid-template-columns:20px 1fr;column-gap:6px;align-items:start;cursor:pointer}
.savemode input{margin-top:4px}
.savemode small{grid-column:2;font-size:12.5px;color:var(--muted);line-height:1.5}
.savemode #crLoad{justify-self:start;font-size:13px}

/* ===== test theme: soft watercolour high-fantasy (parchment, slate ink, muted teal, hairline gold) ===== */
:root{--paper:#FFFCF5;--paper-2:#F6EFDF;--card:#FFFFFF;--ink:#22313B;--muted:#5F6B74;--line:#E7DCC4;--accent:#1F93B0;--accent-soft:#DDF2F6;--sea:#1F93B0;--gold:#E0A43A;--good:#3E9A62;--bad:#C2533F;
  --f-body:"Chiron Hei HK","PingFang TC","Microsoft JhengHei",sans-serif;--f-num:"Patrick Hand","Chiron Hei HK",sans-serif;--f-quote:"Chiron Hei HK",sans-serif;--hair:inset 0 0 0 1px rgba(184,151,90,.55);--soft:0 10px 30px rgba(43,56,67,.16)}
body{font-family:var(--f-body)}
button,input,select,textarea{font-family:inherit}
/* frosted parchment panels with a hairline gold edge and small radius */
.brand,.tgroup,.pill,.sq,.player,.travel{background:rgba(255,252,245,.9)!important;backdrop-filter:blur(10px);box-shadow:var(--hair),var(--soft)!important;border-radius:8px!important}
.brand{padding:10px 18px!important;position:relative}
.brand:before,.brand:after{content:"";position:absolute;width:7px;height:7px;background:var(--gold);transform:rotate(45deg);top:50%;margin-top:-3.5px;opacity:.8}
.brand:before{left:-4px}.brand:after{right:-4px}
.wm{font-family:var(--f-body);font-weight:900!important;letter-spacing:.06em!important;color:var(--accent)!important}
.wm span{color:var(--ink)!important}
.brand .sb{font-weight:400;letter-spacing:.06em}.brand .sb b{font-weight:700;color:var(--ink)}
.tbtn{border-radius:6px!important;color:var(--muted)}
.tbtn[aria-pressed="true"]{background:var(--ink)!important;color:#F4E7C8!important;box-shadow:inset 0 -2px 0 var(--gold)}
.pill button{border-radius:6px!important;font-weight:700;letter-spacing:.08em}
.pill button[aria-pressed="true"]{background:var(--accent)!important;color:#FBF8F1!important;box-shadow:inset 0 -2px 0 var(--gold)}
.sq{font-weight:700;letter-spacing:.06em}
/* map labels: parchment plates with a gold rule */
.lbl{background:rgba(251,248,241,.94)!important;border-radius:4px!important;box-shadow:var(--hair),0 4px 12px rgba(43,56,67,.18)!important;font-family:var(--f-body);font-weight:900;letter-spacing:.04em;padding-left:12px!important;padding-right:12px!important}
.lbl .no{font-family:var(--f-num)!important;font-style:italic;font-weight:900!important;color:var(--gold)!important;font-size:16px!important}
.lbl.sel{background:var(--ink)!important;color:#F4E7C8!important;box-shadow:0 0 0 1px var(--gold),0 0 0 4px rgba(184,151,90,.35)!important}
.lbl.beaten{background:#F3EBD3!important}
.npcl{background:rgba(43,56,67,.82)!important;color:#F1DFB4!important;border-radius:4px!important;box-shadow:inset 0 0 0 1px rgba(184,151,90,.5);letter-spacing:.06em}
.pav{border-radius:3px!important;font-family:var(--f-body);letter-spacing:.1em;background:rgba(251,248,241,.86)!important}
.pav.shop{background:#7A4A3A!important;color:#F4E7C8!important;box-shadow:inset 0 0 0 1px var(--gold)!important}
.pin{border-radius:4px!important}
/* side panel: parchment page */
#panel{background:linear-gradient(180deg,#FFFDF8,#FBF4E6)!important;border-left:1px solid var(--line)}
#panel:before{content:"";position:absolute;inset:8px;border:1px solid rgba(184,151,90,.35);pointer-events:none;border-radius:2px}
.eyebrow{font-family:var(--f-num);font-style:italic;letter-spacing:.14em!important;color:var(--gold)!important;font-weight:800!important;font-size:13px!important}
.h1,.dh h2,.card h2{font-family:var(--f-body);font-weight:900!important;letter-spacing:.03em;color:var(--ink)}
.sec{letter-spacing:.18em;color:var(--gold)!important;font-weight:700}
.sec:before{content:"◆ ";font-size:.7em;vertical-align:.1em}
.quote{border-left:2px solid var(--gold)!important;font-style:normal}
.cta{border-radius:6px!important;box-shadow:var(--hair)!important;background:linear-gradient(135deg,#DDF2F6,#FFF3D9)!important}
.idx button,.mon li,.pt>button,.lchip,.chip,.tag,.search,.tabs button{border-radius:5px!important}
.tabs button[aria-pressed="true"]{background:var(--ink)!important;color:#F4E7C8!important}
.emb{border-radius:6px!important;box-shadow:var(--hair)}
/* buttons */
.btn{border-radius:5px!important;letter-spacing:.06em;background:var(--ink);border-color:var(--ink);box-shadow:inset 0 -2px 0 rgba(184,151,90,.7)}
.btn.boss{background:var(--accent)!important;border-color:var(--accent)!important}
.btn.ghost{background:transparent!important;color:var(--ink)!important;border-color:var(--line)!important;box-shadow:none}
/* dialogs */
.modal{background:rgba(30,60,75,.32)!important;backdrop-filter:blur(3px)}
.card{background:linear-gradient(180deg,#FFFFFF,#FCF6EA)!important;border-radius:10px!important;box-shadow:var(--hair),0 24px 70px rgba(20,30,40,.35)!important;position:relative}
.card:before{content:"";position:absolute;inset:7px;border:1px solid rgba(184,151,90,.28);border-radius:6px;pointer-events:none}
.opts button,.key,.blank,.tf,.si,.bubble,.chunk,.mk,.md,.spot,.lockbox{border-radius:6px!important}
.opts button.right{background:#E6F0E8!important;border-color:var(--good)!important}
.key{background:#F1ECDD!important;border-left:3px solid var(--gold)!important}
.bossart{background:linear-gradient(135deg,#2B3843,#3E5160)!important;border-radius:8px!important;box-shadow:inset 0 0 0 1px rgba(184,151,90,.5)}
.toast{background:rgba(43,56,67,.94)!important;color:#F4E7C8!important;border-radius:6px!important;box-shadow:inset 0 0 0 1px rgba(184,151,90,.6),0 8px 24px rgba(0,0,0,.25)!important;letter-spacing:.04em}
.cine .ctx{border-radius:6px!important;box-shadow:inset 0 0 0 1px rgba(184,151,90,.6)!important}
.cine .cb{background:#1A242C!important}
.player .bar i,.bar i{background:linear-gradient(90deg,var(--accent),var(--gold))!important}
.cert{border-color:var(--gold)!important;background:linear-gradient(160deg,#FBF8F1,#EFE6CF)!important}
.cert-h b{font-family:var(--f-body);color:var(--ink)!important;letter-spacing:.2em}
.pt,.itm,.lchip b,.idx .n{border-radius:6px!important}
body,.btn,.tbtn,.pill button,.sq,.npcl,.pav,.toast{font-weight:500}
.btn,.pill button,.sq,.toast,.npcl,.sec{font-weight:700!important}
/* handwritten numbers */
.lbl .no,.idx .n,.idx .bn,.pt .pn,.lchip b,.cert-st b,#tClock,.eyebrow,.puz,.player .nm small,.st-o,.win{font-family:var(--f-num)!important;font-style:normal!important;font-weight:700!important}
.lbl .no{font-size:20px!important;color:#D2872C!important;letter-spacing:0}
.eyebrow{font-size:17px!important;letter-spacing:.06em!important;color:#D2872C!important}
.idx .n,.pt .pn{font-size:19px!important}
.wm{color:var(--accent)!important}.wm span{color:var(--ink)!important}
.tbtn[aria-pressed="true"],.tabs button[aria-pressed="true"]{background:var(--accent)!important;color:#fff!important}
.pill button[aria-pressed="true"]{background:#E58A3A!important}
.btn{background:var(--ink)}.btn.boss{background:#E58A3A!important;border-color:#E58A3A!important}
.lbl.sel{background:var(--accent)!important;color:#fff!important}
.npcl{background:rgba(31,147,176,.9)!important;color:#fff!important}
.key{background:#FFF5DF!important}
.bossart{background:linear-gradient(135deg,#25495A,#2F6F86)!important}
.toast,.cine .ctx{background:rgba(34,49,59,.93)!important;color:#FFE9BC!important}
/* legible hand-lettered numerals (Patrick Hand has one weight; avoid faux-bold smearing) */
.lbl .no,.idx .n,.idx .bn,.pt .pn,.lchip b,.cert-st b,#tClock,.puz,.player .nm small,.st-o,.win{font-weight:400!important;font-synthesis:none;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.lbl .no{font-size:17px!important;font-style:normal!important}

變成遊程內容（開心農場、文化泛舟）", "g": 3, "type": "rope", "npc": "小米婆婆", "q": "田調成果和產業島的遊程有什麼關係？", "o": ["兩者沒有關係，各自發展", "田調只用來撰寫論文", "遊程只要風景就足夠", "知識成為遊程內容，也讓長輩有角色"], "a": 3, "ex": "貓公開心農場把野菜與酒麴植物變成體驗，長輩在野菜廚房賺生活費；奇美則把耆老知識放進文化泛舟。"}, {"from": "I3", "to": "I9", "why": "傳統地名指認建立水域自然資源資料庫（2024 都歷）", "g": 1, "type": "walk", "npc": "田調小隊長", "q": "都歷的傳統地名指認，後來要用在哪裡？", "o": ["做成觀光紀念品販售，或放在博物館展示保存", "放在博物館展示保存", "建成資料庫，作為海域與水域管理依據", "當作考試題目使用"], "a": 2, "ex": "20 位長輩指認 100 多個地名與物種名，結合科學調查成為資料庫，支撐水域遊憩管理與藍圖討論。"}, {"from": "I5", "to": "I10", "why": "藍圖示範點延伸為據點規劃（重安藍圖、都蘭鼻）", "g": 2, "type": "walk", "npc": "藍圖師傅", "q": "部落藍圖和據點規劃怎麼銜接？", "o": ["據點規劃不需要藍圖", "據點規劃只看工程預算，不需要參考部落藍圖", "據點只看工程預算", "藍圖的盤點與議題是據點討論的基礎"], "a": 3, "ex": "石雨傘據點小組參考過往藍圖盤點討論分區；也把鄰近東管處公有地據點納入藍圖討論。"}, {"from": "I11", "to": "I5", "why": "部落提案計畫驗證並修正藍圖（2018 四部落提案）", "g": 2, "type": "arch", "npc": "藍圖師傅", "q": "2018 年四個部落的提案計畫，對部落藍圖有什麼作用？", "o": ["示範點可以取代藍圖，做完就不必再回頭修正", "用做中學把藍圖一角做出來並修正", "只是為了用完預算", "和藍圖沒有關係"], "a": 1, "ex": "示範點必須從部落藍圖出發、由下而上提案；東河、比西里岸、都蘭、磯崎在施作中邊做邊調整，回頭修正藍圖。"}, {"from": "I6", "to": "I7", "why": "部落組織完整是共管的前提（Awi Mona 講座、都蘭公法人）", "g": 3, "type": "walk", "npc": "合作社阿姨", "q": "部落和政府談共管，為什麼要先有完整的部落組織？", "o": ["組織規模越大越好", "政府只和公司合作", "可以不開部落會議", "要有能代表部落、承接責任的組織"], "a": 3, "ex": "部落目前只有部落會議能在法律上代表部落；都蘭以年齡階級結合協進會、建立公積金，才能和公部門共管。"}, {"from": "I6", "to": "I8", "why": "合作社組織決定產業能否自負盈虧（濁水布農、里山賽夏）", "g": 3, "type": "arch", "npc": "合作社阿姨", "q": "合作社組織和部落產業有什麼關係？", "o": ["合作社只是名稱好聽，實際上交由外人經營", "人人是老闆，透明分工、學習自負盈虧", "合作社交由外人經營", "有合作社就不用分工"], "a": 1, "ex": "濁水布農分九個工作組、週報與共識會議；里山賽夏每月公開帳務、不分年齡平等投票。"}, {"from": "I7", "to": "I9", "why": "共管工具套用到水域：自觀區、水域合作管理平台", "g": 3, "type": "ferry", "npc": "潮間帶守護員", "q": "共管的工具怎麼用在水域？", "o": ["全部交給業者管理，只靠罰款嚇阻違規行為", "全部交給業者管理", "只靠罰款嚇阻違規", "三方組成平台，監測分區、滾動調整"], "a": 3, "ex": "水域遊憩資源合作管理平台由專業團隊輔導部落自主監測，再共同討論分區、三方合作管理。"}, {"from": "I7", "to": "I10", "why": "共管模式取代單純委外，用於據點經營（都蘭×退輔會案例）", "g": 3, "type": "arch-wave", "npc": "共管小律師", "q": "據點經營為什麼要談共管，而不只是委外？", "o": ["共管只是好聽的口號，委外最省事也最有效率", "共管只是好聽的口號", "公部門想推卸管理責任", "讓部落成為經營主體，兼顧雙方權益"], "a": 3, "ex": "課程探討兼具原基法共管精神的據點管理辦法；都蘭鼻也啟動潛在經營主體的培力。"}, {"from": "I8", "to": "I10", "why": "遊程品質與營運模式是據點轉型的核心（2026 奇美、都蘭據點小組）", "g": 3, "type": "walk", "npc": "遊程達人", "q": "據點要轉型成功，核心是什麼？", "o": ["更大的建築量體", "更多更醒目的招牌", "可複製的收入、SOP 與解說人才", "一次性的大型活動"], "a": 2, "ex": "都蘭鼻縮減量體、檢討營運量能；奇美依客群設計遊程、重寫解說腳本、分別培訓水陸解說員。"}, {"from": "I9", "to": "I10", "why": "水域分區管理直接決定石雨傘據點設計", "g": 2, "type": "arch", "npc": "潮間帶守護員", "q": "石雨傘水域遊憩基地的設計，要先決定什麼？", "o": ["先興建停車場與沖洗區，並招攬最多業者進駐", "先依生態與使用狀況決定水域分區", "先決定招牌顏色與樣式", "先招攬最多的業者進駐"], "a": 1, "ex": "石雨傘港灣小、限制動力遊憩，並研議岸上救生綠色通道；水域要避免增設陸域設施加劇泥沙覆蓋。"}], "articles": [{"id": 1, "date": "2026-10-14", "title": "從理想到現實－國家風景區踐行共管機制之挑戰與期望", "url": "/2026/10/blog-post_15.html", "island": "I7", "type": "講座專文", "places": ["都蘭"], "people": ["羅惠馨"], "q": "修法完成前，國家風景區推動共管可以怎麼過渡、怎麼循序推進？", "o": ["等修法完成前什麼都不做", "一開始就把全部公權力交出去", "依原基法第 34 條發布行政函釋過渡，由諮詢、人力經費、公產到委託公權力逐步深化", "只靠口頭約定"], "a": 2, "ex": "共管需要機關修正目的事業法令，空窗期可依原基法第 34 條發布行政函釋過渡；推進順序是諮詢、人力經費、公產，再到委託公權力，由淺入深。", "k": "行政函釋", "d": "修法空窗期的過渡工具", "g": 3}, {"id": 2, "date": "2026-10-12", "title": "落實與原住民族共管資源、守護土地之法制－從同意權到共管權的實踐", "url": "/2026/10/blog-post_12.html", "island": "I7", "type": "講座專文", "places": [], "people": ["吳秉宸"], "q": "原基法的共管機制目前卡在哪裡？修法方向是？", "o": ["法律已完美，不需修", "第 22 條只適用新設機關；建議拆分諮商同意與共管機制，既存機關也要建共管平台", "應取消諮商同意權", "共管只限國家公園"], "a": 1, "ex": "機關依行政界線劃範圍，部落重視文化主體與傳統領域，認知落差大；第 22 條只適用新設機關，修法方向是拆分諮商同意與共管機制，讓既存機關也建置共管平台。", "k": "共管平台", "d": "既存機關也該建的", "g": 3}, {"id": 3, "date": "2026-10-07", "title": "林業署共管機制之法制化與滾動調整", "url": "/2026/10/blog-post_08.html", "island": "I7", "type": "講座專文", "places": [], "people": ["黃鏡諺"], "q": "林業署的共管會，怎麼從「流於形式」走向實質？", "o": ["修訂要點以原民為主體、分署不得拒絕部落發起，決議具拘束力，2.0 版再強化", "維持上對下的開會方式", "取消共管會", "只邀請學者開會"], "a": 0, "ex": "民 95 至 104 年的共管會偏向上對下而流於形式；107 至 109 年修訂要點改以原民為主體，分署不得拒絕部落發起的共管會，決議具實質拘束力，114 年 2.0 版再強化性別比例與退場機制。", "k": "退場機制", "d": "2.0 版強化的項目", "g": 3}, {"id": 4, "date": "2026-10-05", "title": "公私共好－自然人文生態景觀區之觀光與地方權益共好", "url": "/2026/10/blog-post.html", "island": "I7", "type": "講座專文", "places": ["霧臺"], "people": ["李美惠"], "q": "霧臺的自然人文生態景觀區，由誰經營、怎麼分工？", "o": ["由外地旅行社獨家經營", "由警察局管理", "完全不設管理單位", "三個部落是實際經營主體，公所負責網站監測並代收保育費"], "a": 3, "ex": "霧臺依發展觀光條例歷時五年，經凝聚共識、每部落三次現勘、會銜公告與部落會議通過；神山、阿禮、大武三部落是實際經營主體，公所負責網站監測並代收觀光保育費。", "k": "觀光保育費", "d": "公所代收的費用", "g": 3}, {"id": 5, "date": "2026-09-30", "title": "部落整合－山林資源與部落產業共管案例", "url": "/2026/09/blog-post.html", "island": "I7", "type": "講座專文", "places": ["丹大"], "people": ["金衣宸"], "q": "濁水布農的經驗認為，部落參與共管需要具備哪五種能力？", "o": ["資金力、廣告力、關係力、人數力、抗爭力", "只要有經費就夠了", "文化力、人才力、產業力、協商力、治理力", "只要有法律顧問就夠了"], "a": 2, "ex": "合作社每月開會檢討遊程問卷、建置各村人才資料庫，長老提供文化指導、中壯年執行；他們認為共管需要文化力、人才力、產業力、協商力與治理力。", "k": "治理力", "d": "五力的最後一項", "g": 3}, {"id": 6, "date": "2026-08-27", "title": "部落公法人實踐之路－都蘭部落傳統治理組織與當代機制之無縫接軌", "url": "/2026/08/blog-post.html", "island": "I6", "type": "講座專文", "places": ["都蘭"], "people": ["蔡政良"], "q": "都蘭怎麼把傳統治理接上當代的法人制度？", "o": ["解散年齡階級，改由公司經營", "協進會理事長由頭目擔任、監事為長老顧問團，年齡階級持續運作", "由公所指派理事長", "只保留協會、不開部落會議"], "a": 1, "ex": "都蘭以年齡階級結合阿度蘭阿美斯文化協進會，理事長由頭目擔任、監事為長老顧問團，每月行政會議、每年 4 次部落會議；專職行政人力與青年留鄉是組織穩定的關鍵。", "k": "專職行政人力", "d": "組織穩定的關鍵之一", "g": 3}, {"id": 7, "date": "2026-07-15", "title": "據點任務小組工作坊：部落觀光產業的營運與轉型（都蘭據點小組）", "url": "/2026/07/blog-post_15.html", "island": "I10", "type": "工作坊", "places": ["都蘭"], "people": [], "q": "部落觀光從「計畫支持型組織」轉成「市場營運型品牌」，遇到哪些困難？", "o": ["遊程收入為主、人力負荷重，缺企業經營經驗與維持服務穩定的 SOP", "遊客太多接不完", "經費太多用不完", "法規太寬鬆"], "a": 0, "ex": "都蘭鼻基地因應營運量能縮減量體；部落觀光要從計畫支持型轉為市場營運型，但遊程收入為主、人力負荷重，需要可複製的收入來源，也缺回應客人與維持服務穩定的 SOP。", "k": "可複製", "d": "需要開發的收入來源特性", "g": 3}, {"id": 8, "date": "2026-07-13", "title": "據點任務小組工作坊：水域遊憩分區管理作業的推動（石雨傘據點小組）", "url": "/2026/07/blog-post_13.html", "island": "I9", "type": "工作坊", "places": ["石雨傘"], "people": [], "q": "石雨傘據點小組怎麼決定水域分區的方向？", "o": ["先開放再說", "全部禁止下水", "依業者喜好決定", "參考過往藍圖盤點並與業者交流；港灣小，所以限制動力遊憩"], "a": 3, "ex": "工作坊參考過往藍圖的盤點結果並與在地業者交流；石雨傘港灣面積小，擬限制動力遊憩，依水域特性規劃器具與動線，並研議岸上救生綠色通道。", "k": "綠色通道", "d": "方便救援的岸上路線", "g": 2}, {"id": 9, "date": "2026-07-08", "title": "據點任務小組工作坊：部落遊程發展的現況與策略（奇美據點小組）", "url": "/2026/07/blog-post.html", "island": "I10", "type": "工作坊", "places": ["奇美"], "people": [], "q": "奇美據點小組怎麼精進泛舟與陸域遊程？", "o": ["降價促銷就好", "維持原樣不必改", "依遊客回饋調整、依客群分類設計，重寫解說腳本並分別培訓水陸解說員", "把遊程全部外包"], "a": 2, "ex": "奇美透過遊客意見回饋調整操作細節；建議依客群分類設計遊程、增加從採集到餐桌的體驗，分別培訓水域與陸域解說員，並重新設計解說腳本。", "k": "解說腳本", "d": "要重新設計的導覽內容", "g": 2}, {"id": 10, "date": "2026-06-22", "title": "部落生態旅遊發展實務與挑戰：濁水布農合作社交流記錄", "url": "/2026/06/blog-post_22.html", "island": "I6", "type": "交流紀錄", "places": ["丹大"], "people": ["金衣宸"], "q": "濁水布農合作社面對人力流失，用什麼方式維持營運？", "o": ["暫停營業", "輪流值勤", "全部外包", "只接大團"], "a": 1, "ex": "合作社溝通時先理解對方在乎的面向，對社員以數據與案例說明，並連結現代政策與公部門對話；面對人力流失，則以輪流值勤維持營運。", "k": "輪流值勤", "d": "人力不足時的排班", "g": 3}, {"id": 11, "date": "2026-06-15", "title": "合作社組織營運與行政管理：濁水布農合作社交流記錄", "url": "/2026/06/blog-post.html", "island": "I6", "type": "交流紀錄", "places": ["丹大"], "people": ["金衣宸"], "q": "濁水布農合作社設計遊程之前，先盤點了什麼？", "o": ["各部落的生態文化優勢、交通可達性與各年齡層人力", "競爭對手的價格", "網紅推薦清單", "最近流行的打卡點"], "a": 0, "ex": "合作社以人與土地健康為精神，先盤點各部落的生態文化優勢、交通可達性與各年齡層人力再設計遊程；社內分九個工作組，營運團隊靠週報與共識會議保持透明。", "k": "九個工作組", "d": "合作社的分工", "g": 3}, {"id": 12, "date": "2026-05-21", "title": "部落共管機制與組織營運：共管執行與觀光發展之展望", "url": "/2026/05/blog-post_21.html", "island": "I7", "type": "參訪", "places": ["南庄"], "people": ["根誌優"], "q": "里山賽夏與林保署的共管，怎麼推進與檢討？", "o": ["一次訂死不能改", "出問題就終止合作", "只由公部門單方面評分", "試行後逐步改進，共同討論需求與可行性，訂出行動方向與績效指標"], "a": 3, "ex": "南庄共管採試行後逐步改進，雙方共同討論需求與可行性，訂出可執行的行動方向與績效指標；以平等協商維繫合作，循環基地的烘乾機也開放其他群體依規則共用。", "k": "績效指標", "d": "共管要訂出的衡量方式", "g": 2}, {"id": 13, "date": "2026-05-14", "title": "部落共管機制與組織營運：里山賽夏合作社的運作", "url": "/2026/05/blog-post_14.html", "island": "I6", "type": "參訪", "places": ["南庄"], "people": ["根誌優"], "q": "里山賽夏合作社怎麼兼顧傳統輩分與合作社民主？", "o": ["只由長老決定一切", "只由年輕人決定一切", "以輩分秩序約束決策，同時不分年齡平等投票，每月公開帳務", "帳務不公開以免爭議"], "a": 2, "ex": "合作社 2019 年成立，以企業化方式控管預算、每月會議公開帳務；決策以賽夏傳統輩分秩序約束，同時依合作社原則不分年齡平等發聲與投票，月會辦慶生讓年輕人更願意參與。", "k": "公開帳務", "d": "每月月會做的事", "g": 3}, {"id": 14, "date": "2026-05-07", "title": "部落共管機制與組織營運：從南庄里山賽夏案例探討部落的準備", "url": "/2026/05/blog-post.html", "island": "I6", "type": "參訪", "places": ["南庄"], "people": ["根誌優"], "q": "賽夏族人取得了什麼能力，讓共管更有底氣？", "o": ["只靠抗議爭取", "與森林護管員相同標準的專業認證，並理解法規與機關權責", "只靠人數優勢", "請外部律師代表"], "a": 1, "ex": "合作社運用社區林業計畫辦山林巡護與撫育培訓，以生態監測作為復育的量化指標；族人取得與森林護管員相同標準的專業認證，2025 年加里山區已無盜伐案件。", "k": "森林護管員", "d": "族人認證比照的對象", "g": 3}, {"id": 15, "date": "2026-04-30", "title": "賽夏山林智慧與現代制度結合的實踐：南庄里山賽夏參訪記錄", "url": "/2026/04/blog-post_30.html", "island": "I7", "type": "參訪", "places": ["南庄"], "people": ["根誌優"], "q": "南庄里山賽夏合作社營運的關鍵是什麼？", "o": ["透明公開與資訊共享，每月月會共同決策，由小到大逐步推行", "由一人決定所有事", "資訊只給幹部知道", "一開始就做大型投資"], "a": 0, "ex": "森林小站原是林務局檢查哨，現由族人經營林下經濟；合作社以透明公開與資訊共享為營運關鍵，每月月會共同決策，用平等會談由小到大推行，讓部落經濟自立。", "k": "資訊共享", "d": "與透明公開並列的關鍵", "g": 3}, {"id": 16, "date": "2026-04-28", "title": "從對立到共好，永續山林的共管歷程：南庄里山賽夏參訪記錄", "url": "/2026/04/blog-post.html", "island": "I7", "type": "參訪", "places": ["南庄"], "people": ["根誌優", "豆銀妹"], "q": "賽夏與林保署從對立走向共好，是從哪裡起步的？", "o": ["從大規模伐木開始", "從興建飯店開始", "從提起訴訟開始", "2018 年和解後，從養蜂的林下經濟開始"], "a": 3, "ex": "2018 年雙方和解，從養蜂林下經濟起步並成立合作社，以永續為核心共管國有林；社員人人都是老闆，蜂場依生態調整蜂量，共創里山賽夏品牌。", "k": "養蜂", "d": "和解後的第一個產業", "g": 3}, {"id": 17, "date": "2025-12-12", "title": "114年成果發表會活動紀要：共好討論與交流", "url": "/2025/12/114_12.html", "island": "I11", "type": "成果會", "places": [], "people": [], "q": "114 年成果發表會說，每年怎麼推動部落藍圖的願景？", "o": ["畫好一次就永久不變", "每十年才檢討一次", "每年透過藍圖滾動式盤點，並以成果發表會了解各部落進程", "只看遊客人數"], "a": 2, "ex": "共好組、據點組與水域組以部落藍圖提出的議題分組討論；每年透過藍圖滾動式盤點推動願景，再以成果發表會了解進程，共好組也強調堅持與定期回饋機制。", "k": "滾動式盤點", "d": "藍圖每年要做的事", "g": 2}, {"id": 18, "date": "2025-12-09", "title": "114年成果發表會活動紀要：主題分享（下）", "url": "/2025/12/114_9.html", "island": "I11", "type": "成果會", "places": [], "people": [], "q": "海派聯盟怎麼動態檢討品牌經營？", "o": ["從不考核", "以聯盟作為檢討依據，考核頻率由三年一次改為兩年一次", "每年換一個品牌", "只看社群聲量"], "a": 1, "ex": "東管處從工作假期、部落觀光產業聯盟發展到海派聯盟，推出海派玩家 11 條遊程；導覽採外部專家與耆老雙軌認證，考核頻率由三年一次改為兩年一次，並共同行銷與數據共享。", "k": "兩年一次", "d": "新的考核頻率", "g": 2}, {"id": 19, "date": "2025-12-09", "title": "114年成果發表會活動紀要：主題分享（上）", "url": "/2025/12/114.html", "island": "I11", "type": "成果會", "places": ["石雨傘", "港口", "奇美", "重安", "都蘭"], "people": [], "q": "綠島大白沙的水域管理，最後由誰來承擔？", "o": ["參與式規劃後成立的在地水域遊憩發展協會", "外地大型潛水公司", "單一飯店業者", "沒有人管理"], "a": 0, "ex": "東管處以公私共好建立恆常運作的景區永續管理模式；綠島大白沙經參與式規劃成立在地水域遊憩發展協會，負責導潛制度、洋流調查與浮球標記，未來可作為公私共管的組織。", "k": "導潛制度", "d": "協會設計的潛水帶隊規範", "g": 3}, {"id": 20, "date": "2025-07-29", "title": "水域遊憩規劃培力工作坊（下）", "url": "/2025/07/blog-post_29.html", "island": "I9", "type": "工作坊", "places": ["港口", "都蘭", "都歷", "重安", "比西里岸"], "people": ["陳鎮妹", "陳英彥", "Jimmy"], "q": "水域工作坊中，各部落分享了哪些自主管理做法？", "o": ["全年無限制採集", "把沙灘改成停車場", "把管理全部交給遊客", "都蘭採集限每年 5–10 月、都歷設路障擋車、重安成立海洋巡守隊"], "a": 3, "ex": "都蘭的採集限每年 5 至 10 月、秋冬禁獵，都歷設路障減緩車輛進入沙灘，重安成立海洋巡守隊；部落青年人力與內部自我約束很重要，目標是走向與部落共管。", "k": "自我約束", "d": "部落內部的規範力量", "g": 3}, {"id": 21, "date": "2025-07-29", "title": "水域遊憩規劃培力工作坊（上）", "url": "/2025/07/blog-post.html", "island": "I9", "type": "工作坊", "places": ["港口"], "people": ["陳杰敏"], "q": "港口部落巡守隊怎麼監測硨磲貝？劃定保育區又強調什麼？", "o": ["靠遊客回報；保育區由公部門單獨決定", "不監測；保育區越大越好", "兩點定位法持續監測；保育區要部落參與、共同訂定", "用衛星監測；不需部落參與"], "a": 2, "ex": "巡守隊以兩點定位法監測硨磲貝，颱風後發現移動約 5 公尺，並溝通理解漁民處境；保育區劃定需要部落參與，與公單位及地方團體共同訂定才有公信力。", "k": "公信力", "d": "共同訂定帶來的", "g": 3}, {"id": 22, "date": "2025-03-31", "title": "東海岸水域遊憩發展－以生態為本、公私共理為永續之計（下）", "url": "/2025/03/blog-post_39.html", "island": "I9", "type": "專文", "places": ["港口", "比西里岸"], "people": [], "q": "水域遊憩資源合作管理平台的推動步驟，最後一步是什麼？", "o": ["由東管處單方公告", "部落、業者、東管處三方合作管理，滾動調整管理辦法", "交給業者自律", "調查完就結束"], "a": 1, "ex": "平台先由專業團隊設計生態監測並輔導部落自主監測，再做敏感度分級、全年度水域使用調查與共同討論分區；最後由部落、業者與東管處三方合作，滾動調整管理辦法。", "k": "滾動調整", "d": "管理辦法不是一次定案", "g": 2}, {"id": 23, "date": "2025-03-31", "title": "東海岸水域遊憩發展－以生態為本、公私共理為永續之計（上）", "url": "/2025/03/blog-post_58.html", "island": "I9", "type": "專文", "places": ["港口"], "people": [], "q": "東海岸要發展水域遊憩，應該先做什麼，再決定發展模式？", "o": ["先盤點環境特性、海象風險與部落採集權益", "先蓋停車場和沖洗區", "先招攬最多業者", "先辦大型水上活動"], "a": 0, "ex": "水域遊憩要先盤點環境特性、海象風險與部落採集權益，再依敏感性區劃；避免為遊憩增設陸域設施加劇泥沙覆蓋，改由業者統一接駁並推動總量管制。", "k": "採集權益", "d": "部落在水域的傳統權利", "g": 2}, {"id": 24, "date": "2025-03-31", "title": "重安貓公交流｜文化是每天自然發生的事情，分享在部落是很自然的事情", "url": "/2025/03/blog-post_31.html", "island": "I3", "type": "交流紀錄", "places": ["重安", "貓公"], "people": [], "q": "重安到貓公交流後，學到推動部落事務的哪個順序？", "o": ["先蓋好硬體，再找人進駐", "先找外地團隊經營", "先申請經費，再決定做什麼", "先有做事的人，再思考空間需求"], "a": 3, "ex": "貓公以優先照顧部落老人家為核心成立文健站，讓長輩在工坊與野菜廚房賺生活費；重安學到先有做事的人、再思考空間需求，回去後重新盤點硬體需求。", "k": "做事的人", "d": "比空間更先需要的", "g": 3}, {"id": 25, "date": "2025-03-28", "title": "駐地研究員交流會議－公部門與部落共好觀點交流（下）", "url": "/2025/03/blog-post_34.html", "island": "I11", "type": "交流紀錄", "places": [], "people": [], "q": "公私合作沒能成形，交流會認為主因與解方是？", "o": ["主因是遊客太少；解方是辦活動", "主因是法規；解方是不合作", "主因多是人力流失；解方是增加工作機會等誘因、文化復振與長期資源支持", "主因是天氣；解方是等待"], "a": 2, "ex": "討論建立分區管制、遊客準則與海洋休息期；合作未能成形主因多是人力流失，解方是增加工作機會等誘因、文化復振與長期計畫支持，由管處負責硬體、部落負責軟體與空間經營。", "k": "人力流失", "d": "合作卡住的主因", "g": 3}, {"id": 26, "date": "2025-03-28", "title": "駐地研究員交流會議－公部門與部落共好觀點交流（上）", "url": "/2025/03/blog-post_28.html", "island": "I11", "type": "交流紀錄", "places": [], "people": [], "q": "部落與公部門合作時，雙方怎麼分工？", "o": ["公部門決定、部落配合", "部落先提出想法並主導執行；公部門負責培力、轉譯、資源轉介與行政支援", "部落出錢、公部門出力", "雙方各做各的"], "a": 1, "ex": "合作以部落需求為出發點，部落先提出想法，公部門負責培力、轉譯與資源轉介；執行時由部落主導、公部門行政支援，並尊重主體性、互惠與資訊公開。", "k": "資源轉介", "d": "公部門協助的第三項", "g": 3}, {"id": 27, "date": "2025-03", "title": "跟著奇美學習與自然共存共榮－開啟秀姑巒溪下游文化泛舟的新篇章", "url": "/2025/03/blog-post.html", "island": "I3", "type": "專文", "places": ["奇美"], "people": [], "q": "奇美發展秀姑巒溪下游的新遊程，用了什麼方法？", "o": ["實際試遊，邊乘船邊聽族人解說地名與漁法", "直接上架，再看市場反應", "請外地教練設計路線", "照搬國外泛舟行程"], "a": 0, "ex": "2024 年底的試遊程邊乘船邊聽族人解說：奇美部落的冰箱不在太平洋，而在秀姑巒溪；祖傳 podaw 魚苗陷阱不強求、不過取，新急流則被命名為「鬼敲門」。", "k": "試遊程", "d": "上架前先實際走一趟", "g": 2}, {"id": 28, "date": "2024-12-09", "title": "由模型製作開展聚落空間與山海環境的視野，共同想像部落觀光的未來（都歷）", "url": "/2024/12/blog-post_9.html", "island": "I5", "type": "工作坊", "places": ["都歷"], "people": [], "q": "都歷做的部落立體模型，除了盤點資源，未來還能用來做什麼？", "o": ["只當作裝飾擺設", "拿去比賽換獎金", "做完就收進倉庫", "傳統領域指認、導覽解說與文化傳承"], "a": 3, "ex": "模型以每 10 公尺一條等高線、0.5 公分珍珠板層層堆疊，比例 1:2000；它是永續觀光藍圖的基礎，未來也能用於傳統領域指認、導覽解說與文化傳承。", "k": "等高線", "d": "模型分層的依據", "g": 2}, {"id": 29, "date": "2024-12-06", "title": "從傳統地名指認工作坊開始建構都歷部落的水域自然資源資料庫", "url": "/2024/12/blog-post_6.html", "island": "I3", "type": "工作坊", "places": ["都歷"], "people": [], "q": "都歷為什麼急著辦傳統地名指認工作坊？", "o": ["為了更換新的路牌", "為了申請地名商標", "長輩逐漸凋零，要趕快保留知識，作為藍圖與水域管理的依據", "為了參加比賽"], "a": 2, "ex": "20 位長輩在 A0 地圖上指認 100 多個傳統地名與物種族語名稱；因為長輩逐漸凋零，要趕快把知識保留下來，再結合科學調查建成水域資源資料庫，作為藍圖與水域管理的依據。", "k": "資料庫", "d": "地名與物種整理成的", "g": 1}, {"id": 30, "date": "2024-12-04", "title": "啟動都蘭鼻旅遊服務基地共好經營討論", "url": "/2024/12/blog-post_4.html", "island": "I10", "type": "工作坊", "places": ["都蘭"], "people": [], "q": "都蘭與東管處從 BOT 抗爭走到共好，關鍵做法是什麼？", "o": ["由法院判決強制合作", "2017 年起共同盤點資源、梳理藍圖，東管處打破科室隔牆、建立平等對話平台", "東管處單方面撤案", "改由財團出面協調"], "a": 1, "ex": "1998 年都蘭鼻 BOT 案未充分溝通，引發長期對立；2017 年起雙方討論議題、盤點資源，定位後山、聚落、都蘭鼻三區塊梳理藍圖，東管處打破科室隔牆、建立平等對話平台。", "k": "科室隔牆", "d": "東管處內部要打破的", "g": 1}, {"id": 31, "date": "2024-12-03", "title": "致石雨傘美麗港灣背後的一群守護者", "url": "/2024/12/blog-post_3.html", "island": "I9", "type": "專文", "places": ["石雨傘"], "people": ["潘忠和"], "q": "石雨傘港灣怎麼形成守護家園的關係社群？", "o": ["回鄉教練帶頭減量與防颱，在地居民與業者自發守護", "由外地志工輪流", "完全靠公部門", "等遊客自覺"], "a": 0, "ex": "潘教練回鄉 12 年推動遊客垃圾減量並收起垃圾桶；康芮颱風前收起救生圈、用雨量筒監測通報，風雨後動員清理，在地居民與業者自發守護家園，形成關係社群。", "k": "關係社群", "d": "自發守護港灣的一群人", "g": 3}, {"id": 32, "date": "2024-12-02", "title": "從資源盤點與部落踏查開啟重安部落藍圖討論的新篇章", "url": "/2024/12/blog-post.html", "island": "I5", "type": "工作坊", "places": ["重安"], "people": [], "q": "重安部落的藍圖討論，是怎麼逐步精進的？", "o": ["一次開會就定案", "交給顧問公司寫好", "只讓少數人參加以免意見太多", "盤點、確認、再盤點的循環，耆老協調認知落差，參與人數逐次增加"], "a": 3, "ex": "重安在保有部落主體性的前提下，用便利貼與航照圖盤點公共設施、祭儀與採集點，再踏查路線；經過盤點、確認、再盤點的循環，耆老協調認知落差，參與人數也逐步增加。", "k": "再盤點", "d": "循環的第三步", "g": 2}, {"id": 33, "date": "2024-11-28", "title": "113年交流分享會活動紀要（2）共學討論：誰能代表部落？", "url": "/2024/11/1132.html", "island": "I6", "type": "成果會", "places": ["港口", "奇美", "重安", "石雨傘", "比西里岸", "都歷", "東河", "都蘭"], "people": ["Awi Mona", "羅惠馨"], "q": "交流會討論「誰能代表部落」，部落組的看法是？", "o": ["誰的頭銜最大誰代表", "誰最會寫計畫誰代表", "住在部落、決策以部落為主體並取得內部共識，有影響力與行動熱忱", "由公部門指定"], "a": 2, "ex": "討論認為部落代表要居住在部落、決策以部落為主體並取得內部共識，也要有社會影響力與行動熱忱，成為與公部門溝通的橋樑。", "k": "內部共識", "d": "代表決策前要先取得的", "g": 3}, {"id": 34, "date": "2024-11-28", "title": "113年交流分享會活動紀要（1）講師分享", "url": "/2024/11/1131.html", "island": "I7", "type": "成果會", "places": [], "people": ["Awi Mona", "羅惠馨"], "q": "交流會講師指出，部落與政府共管時遇到什麼法律身分問題？", "o": ["部落已是公法人，沒有問題", "部落目前不具法人身份，法律上只有部落會議能代表部落", "任何協會都能代表部落", "只有村長能代表部落"], "a": 1, "ex": "講師以蘭嶼飛魚祭衝突與知本光電等案例說明：部落目前不具法人身份，法律上只有部落會議能代表部落；建議依事務成立不同組織，並依原基法第 34 條修正法令、納入共管法源。", "k": "部落會議", "d": "法律上能代表部落的", "g": 3}, {"id": 35, "date": "2024-11-18", "title": "培訓課程：部落與公部門共好經營管理模式", "url": "/2024/11/blog-post.html", "island": "I7", "type": "課程", "places": ["都蘭"], "people": ["蔡政良"], "q": "113 年課程希望據點管理超越什麼模式？都蘭做了哪些準備？", "o": ["超越單純出租與委託經營；成立社團法人、建立部落公積金", "維持出租即可", "全部交給財團", "由公部門自己經營就好"], "a": 0, "ex": "課程探討兼具原基法共管精神的據點管理辦法，超越現行出租與委託經營；都蘭成立社團法人，頭目任理事長、年齡階級任理事，並建立部落公積金、善用義務勞動。", "k": "公積金", "d": "部落共同的儲備", "g": 3}, {"id": 36, "date": "2024-07-26", "title": "東管處據點任務小組工作坊（奇美遊憩區、都蘭鼻自然旅遊地）", "url": "/2024/07/blog-post_26.html", "island": "I10", "type": "工作坊", "places": ["奇美", "都蘭"], "people": [], "q": "東管處據點任務小組，怎麼讓部落窗口同仁實際參與規劃？", "o": ["只讓企劃科開會", "等工程完成再通知", "交給外部顧問全權處理", "跨科室分組，依計畫全案生命週期建立循序參與式討論"], "a": 3, "ex": "企劃科協調遊憩、工務、管理科同仁分組，依計畫全案生命週期建立循序參與式討論；113 年 7 月共 24 人參與，逐步形成跨科室討論與相互支援的平台。", "k": "生命週期", "d": "討論依循的計畫時間軸", "g": 2}, {"id": 37, "date": "2024-07-26", "title": "東管處據點任務小組工作坊（高台遊憩區、石雨傘水域遊憩基地）", "url": "/2024/07/blog-post.html", "island": "I10", "type": "工作坊", "places": ["石雨傘", "比西里岸"], "people": [], "q": "高台與石雨傘的工作坊，檢討出規劃階段最常忽略什麼？", "o": ["設計不夠華麗", "預算花得不夠多", "落實的可行性，例如海邊鹽分讓露營設施損壞", "招牌不夠大"], "a": 2, "ex": "各科室換位思考據點建設與業務的利害關係；現行露營區設施因海邊鹽分高而損壞，常與業者起衝突，大家發現規劃階段容易忽略落實可行性。", "k": "落實可行性", "d": "規劃時容易漏掉的", "g": 2}, {"id": 38, "date": "2023-12-19", "title": "說自己的故事：我們是在海邊的布農族人－高山部落", "url": "/2023/12/blog-post.html", "island": "I8", "type": "示範點", "places": ["高山"], "people": ["小馬"], "q": "高山森林基地以故事經濟為願景，組織上朝什麼方向發展？", "o": ["只靠補助維持", "合作社與分潤機制，以公司型態經營、吸引返鄉青年", "交給外地老闆經營", "不需要任何組織"], "a": 1, "ex": "基地以「一座山的接待」推廣海岸布農文化，用田野調查建立在地知識、以基地為圓心繪製分區資源藍圖；並以故事經濟為願景，朝合作社與分潤機制發展、吸引返鄉青年。", "k": "分潤機制", "d": "合作社分享收益的方式", "g": 3}, {"id": 39, "date": "2023-11-24", "title": "文化泛舟資源調查－奇美部落", "url": "/2023/11/blog-post_24.html", "island": "I3", "type": "田調", "places": ["奇美"], "people": [], "q": "奇美試遊程時，為什麼特別想帶「有心參與的年輕人」下水？", "o": ["讓年輕族人在試遊中向耆老學習，培育傳承的人", "年輕人比較會拍照打卡", "年輕人付的費用比較多", "耆老不願意下水"], "a": 0, "ex": "奇美定期召集夥伴回鄉試遊、下水時訪談耆老，部落認為帶有心參與的年輕人下水比較有意義；並以協會與年齡階級鞏固人口結構，在文化真實性與生態保育間取得平衡。", "k": "有心參與", "d": "奇美想帶下水的年輕人特質", "g": 3}, {"id": 40, "date": "2023-11-14", "title": "開心農場示範點執行－貓公部落", "url": "/2023/11/blog-post_14.html", "island": "I8", "type": "示範點", "places": ["貓公"], "people": ["吳建安"], "q": "貓公開心農場示範點和駐地研究員計畫有什麼關係？", "o": ["兩者完全無關", "農場是外地公司的投資", "示範點取代了藍圖", "106 年起在駐地陪伴下盤點議題、發展遊程，是願景藍圖的一片拼圖"], "a": 3, "ex": "部落人口老齡化、文化產業亟待傳承；106 年起在駐地研究員陪伴下盤點議題、發展遊程，開心農場是願景藍圖的一片拼圖，全體以 mipaliw 精神修繕野菜區、建置蓄水池 Fanaw。", "k": "一片拼圖", "d": "示範點在藍圖裡的位置", "g": 1}, {"id": 41, "date": "2023-11-09", "title": "部落觀光永續發展路徑討論－都蘭部落", "url": "/2023/11/blog-post.html", "island": "I5", "type": "工作坊", "places": ["都蘭"], "people": [], "q": "都蘭駐地第六年的工作坊，怎麼從現象整理出部落議題？", "o": ["直接投票決定最重要的事", "請講師直接給答案", "依四大面向提出現象，分類釐清因果與良性、惡性循環，再歸納議題", "只挑最好處理的問題"], "a": 2, "ex": "夥伴從生態環境、遊客管理、文化環境、在地社會與經濟四面向提出現象，分類釐清因果與良性、惡性循環，歸納出文化傳承、遊客行為管理、開發規劃與民眾參與三個議題。", "k": "惡性循環", "d": "要釐清的負面連鎖", "g": 2}, {"id": 42, "date": "2023-08-08", "title": "培訓課程：野菜園裡的社會生活－阿美族的民俗植物與生態智慧", "url": "/2023/08/blog-post.html", "island": "I3", "type": "課程", "places": ["都蘭"], "people": ["羅素玫", "胡哲明"], "q": "阿美族的野菜知識，靠什麼傳給下一代？", "o": ["只靠出版圖鑑", "性別分工的日常實作，以及青少女訓練營", "交給學校自然課", "上網查就有，不必傳承"], "a": 1, "ex": "野菜是傳統生態知識，也牽動性別分工與社會交換；菜園採排除式經營，除雜草但不斬草除根，青少女訓練營則把野菜與山海採集知識傳給下一代。", "k": "訓練營", "d": "青少女學野菜的地方", "g": 3}, {"id": 43, "date": "2023-08-08", "title": "培訓課程：海廢的下一步", "url": "/2023/08/blog-post_7.html", "island": "I2", "type": "課程", "places": [], "people": ["Taiwanderful"], "q": "海廢課程裡，德福怎麼把永續觀念向下扎根？", "o": ["與學校合作，協助孩童建立垃圾回收分類站", "舉辦淨灘比賽發獎金", "禁止遊客攜帶任何塑膠", "全部交給清潔隊處理"], "a": 0, "ex": "2021 年逾 1700 萬公噸塑料進入海洋，占海洋垃圾 85%；課程教大家用隨手可得的工具建立家用回收系統，德福也和學校合作設回收分類站，從小培養永續觀念。", "k": "分類站", "d": "德福和學校一起設的", "g": 3}, {"id": 44, "date": "2023-06-27", "title": "培訓課程：旅遊對環境的影響－交通碳排影響與綠色交通實踐", "url": "/2023/06/blog-post.html", "island": "I2", "type": "課程", "places": [], "people": ["張學孔"], "q": "綠色交通課程指出台東的交通碳排特點，部落遊程可以怎麼回應？", "o": ["鼓勵自駕，多停幾個點", "增建大型停車場", "交通和遊程無關，不必考慮", "推動人本綠運輸，例如自行車五感遊程、整合旅運服務"], "a": 3, "ex": "台東交通排放占 33.07%，假日汽機車使用率達 93%；因此推動運具電氣化、人本綠運輸與 MaaS 整合，例如「成功小鎮漫遊」自行車五感遊程。", "k": "綠運輸", "d": "減碳的移動方式", "g": 2}, {"id": 45, "date": "2023-03-30", "title": "培訓課程：用田調說故事－田調轉譯與應用", "url": "/2023/03/blog-post_30.html", "island": "I3", "type": "課程", "places": ["比西里岸", "美山"], "people": ["李芝瑩"], "q": "斯創團隊把森林素材轉成遊程時，用了哪些規劃工具？", "o": ["只拍一支形象影片", "直接比價、降價求售", "拆解森林永續迴圈、課程地圖與 STP 分析，並評估承載量與成本效益", "先蓋一座展示館"], "a": 2, "ex": "團隊先盤點遊憩資源與市場性，拆解造林到成品的森林永續迴圈，用課程地圖與 STP 分析市場區隔、目標與定位，再評估承載量與成本效益，設計一日型與二日型遊程。", "k": "STP", "d": "市場區隔、目標、定位", "g": 2}, {"id": 46, "date": "2023-03-13", "title": "培訓課程：東海岸田調這檔事", "url": "/2023/03/blog-post.html", "island": "I3", "type": "課程", "places": ["貓公", "美山"], "people": ["蘇素敏", "王力之", "李昀"], "q": "節點共創怎麼讓田調成果在部落形成循環？", "o": ["把成果鎖在檔案櫃保存", "以專案培育在地人才、建立文化教育模組：對內傳承、對外開課", "全部交給出版社販售", "請外地講師代為教學"], "a": 1, "ex": "田調從時令、禁忌、儀式延伸到物件的材料與工法，事後整理逐字稿抓出族語關鍵字；節點共創以專案培育在地人才、建立文化教育模組，對內傳承、對外發展經濟型課程，形成循環。", "k": "文化教育模組", "d": "對內傳承、對外開課的工具", "g": 3}, {"id": 47, "date": "2022-11-08", "title": "培訓課程：畫出共同的永續未來－永續元素與地方藍圖", "url": "/2022/11/blog-post_58.html", "island": "I5", "type": "課程", "places": ["都歷", "貓公"], "people": ["歐祥權"], "q": "111 年藍圖課程說，部落藍圖的重點是什麼？", "o": ["共同擬定永續觀光的方向，而不是畫一張漂亮的地圖", "畫出最美觀的地圖", "列出最多的建設項目", "寫出最厚的報告書"], "a": 0, "ex": "藍圖依循 GSTC-D 準則，重點在共同討論永續觀光方向而非繪製美觀地圖；先在圖上劃出不可干擾的區域，再盤點資源並用路徑博物館串聯，藍圖也要保持彈性、隨環境調整。", "k": "不可干擾", "d": "要先劃出來的區域", "g": 1}, {"id": 48, "date": "2022-11-08", "title": "培訓課程：畫出共同的永續未來－圖資平台運用", "url": "/2022/11/blog-post_79.html", "island": "I5", "type": "課程", "places": ["都歷", "貓公"], "people": ["張采妮"], "q": "圖資課為什麼說藍圖「不只是對未來生活的想像」？", "o": ["因為想像不需要成本", "因為藍圖只是行政程序", "因為土地都已經規劃好了", "還要合理配置土地，避免不適宜發展的地區被誤用開發"], "a": 3, "ex": "圖資課依序釐清議題、蒐集環境資訊與法規、確認圖資、建立圖層概念再選平台；藍圖不只是想像，更要合理配置土地，避免不適宜發展的地區遭誤用開發。", "k": "合理配置", "d": "藍圖對土地要做到的", "g": 1}, {"id": 49, "date": "2022-11", "title": "培訓課程：那些被隱藏的永續意涵－部落的價值系統", "url": "/2022/11/blog-post_8.html", "island": "I2", "type": "課程", "places": [], "people": ["吳明季"], "q": "「部落的價值系統」課程，對部落人才提出什麼提醒？", "o": ["只要一位能幹的領袖全包就好", "人才都應該向外聘請", "需要對內與對外的轉譯者，對內更關鍵，也要留意有能者過勞", "年輕人不需要參與"], "a": 2, "ex": "永續要以部落價值系統為核心，不能只套資本主義 SOP，否則計畫結束振興也結束；部落需要對內與對外的轉譯者，其中對內轉譯者更關鍵，也要留意有能者過勞。", "k": "對內轉譯者", "d": "部落最關鍵的一種人才", "g": 3}, {"id": 50, "date": "2022-11", "title": "培訓課程：那些被隱藏的永續意涵－永續旅行概論", "url": "/2022/11/blog-post.html", "island": "I2", "type": "課程", "places": [], "people": ["郭倩如"], "q": "111 年永續旅行課，怎麼把國際準則變成部落的行動？", "o": ["把準則翻譯後貼在牆上", "對照 SDGs 與 GSTC 準則 A 至 D 面向，逐項評估指標再擬定作法", "拿到國際認證就算完成", "交給業者自行解讀"], "a": 1, "ex": "課程對照 SDGs 與 GSTC 準則的 A 至 D 面向逐項評估指標、擬定行動；像新社部落因遊客踩踏梯田訂出導覽路徑規範，也研商海洋資源共管與接待量。", "k": "導覽路徑", "d": "新社保護梯田的規範", "g": 2}, {"id": 51, "date": "2022-11", "title": "111-112年計畫：潛力 GTS 綠色旅行標章業者輔導招募說明會", "url": "/2022/11/111-112-gts.html", "island": "I2", "type": "說明會", "places": [], "people": [], "q": "GTS 綠色旅行標章和國際認證相比，有什麼特色？", "o": ["依循 GSTC 準則、第二方稽核，門檻與費用較低並有顧問陪同", "由業者自己發給自己", "只看建築是否新穎", "費用比國際認證高很多"], "a": 0, "ex": "GTS 依循 GSTC 準則、採第二方獨立稽核，門檻與費用低於國際第三方認證；顧問會協助填寫準則與延伸監控表格並實地了解營運，讓永續逐步落實到經營。", "k": "第二方", "d": "GTS 的稽核方式", "g": 2}, {"id": 52, "date": "2022-11", "title": "111-112年計畫：駐地研究員招募說明會", "url": "/2022/11/111-112.html", "island": "I1", "type": "說明會", "places": [], "people": [], "q": "111–112 年招募說明會，怎麼形容駐地研究員在部落經營討論裡的角色？", "o": ["代替部落做決定的專案經理", "負責核發補助款的承辦人", "只負責拍照記錄的志工", "部落經營討論的觸媒，帶動大家共同討論永續觀光並回饋部落"], "a": 3, "ex": "說明會指出藍圖的重點是共同討論永續觀光議題、釐清經營能量與行動機制；駐地研究員是部落經營討論的觸媒，東管處部落窗口則搭起雙向溝通平台。", "k": "觸媒", "d": "引發部落討論的角色", "g": 1}, {"id": 53, "date": "2021-11-18", "title": "部落民俗植物與應用", "url": "/2021/11/blog-post.html", "island": "I3", "type": "課程", "places": ["都蘭"], "people": ["楊智凱"], "q": "楊智凱老師的民俗植物課，用什麼方式拓展部落遊程？", "o": ["在教室背誦植物學名", "只展示標本", "邊走、邊解說、邊玩的五感體驗，發掘植物的新用途", "上網下載圖片介紹"], "a": 2, "ex": "老師在阿度蘭農場邊走邊解說邊玩，以五感體驗釐清植物的認知謬誤，例如九芎是巴拉告捕魚法的三層公寓，讓民俗植物的傳統與新用途成為遊程素材。", "k": "五感", "d": "看、聽、聞、摸、嚐", "g": 2}, {"id": 54, "date": "2021-11-16", "title": "部落旅遊商品訂價與上架實務 Part2", "url": "/2021/11/part2.html", "island": "I8", "type": "課程", "places": [], "people": ["林雅婷"], "q": "「一棵香蕉樹只提供 4 片葉子」，在訂價課裡提醒什麼？", "o": ["香蕉葉很便宜可以多用", "依自然資源的再生速度推算永續接待人數，作為定價參數", "葉子不夠就去買", "和訂價無關"], "a": 1, "ex": "定價採成本加成：淨價是營運成本加淨利，零售價再加上分銷成本；一棵香蕉樹提供 4 片葉子，可依生長時間推算永續接待人數，作為定價參數。", "k": "接待人數", "d": "依葉子生長推算的", "g": 2}, {"id": 55, "date": "2021-09-14", "title": "部落旅遊商品訂價與上架實務 Part1", "url": "/2021/09/part1.html", "island": "I8", "type": "課程", "places": [], "people": ["林雅婷"], "q": "KKday 講師說部落遊程應該怎麼訂價？", "o": ["以價值為基礎：蒐集資訊、選定目標、估算成本、分析競爭、測試市場", "比對手便宜就好", "越貴越有質感", "隨心情調整"], "a": 0, "ex": "價格應以價值為基礎、不盲從對手；定價步驟是蒐集資訊、選定目標、估算成本、分析競爭、測試市場，永續認證的業者即使價格較高仍能獲得上架。", "k": "測試市場", "d": "定價的最後一步", "g": 2}, {"id": 56, "date": "2021-08-30", "title": "部落的海洋知識與應用", "url": "/2021/08/blog-post.html", "island": "I9", "type": "課程", "places": ["東河", "都蘭"], "people": ["蔡政良"], "q": "海洋知識課程提醒，傳統知識最怕什麼？", "o": ["知識被改變", "被寫成書", "被遊客知道", "沒有人實踐就會斷裂，所以要靠年齡階、潛伴團體與家族傳承"], "a": 3, "ex": "阿美族說大海就是我的冰箱，用聽浪判斷水域安全，把傳統地名標在海岸地圖；知識透過年齡階、潛伴團體與家族傳承，知識可以改變，但若無人實踐就會斷裂。", "k": "無人實踐", "d": "知識斷裂的原因", "g": 3}, {"id": 57, "date": "2021-05-24", "title": "田野調查資料之運用", "url": "/2021/05/blog-post.html", "island": "I3", "type": "課程", "places": ["貓公"], "people": ["林書豪", "吳建安"], "q": "貓公把聖山田調轉成遊程測試時，為什麼另外規劃 11 鄰農路？", "o": ["因為農路風景比較漂亮", "因為原路線太短", "原路線經過八里灣部落被視為冒犯，要尊重部落界線與禁忌", "因為林務局要收費"], "a": 2, "ex": "團隊訪談整理豐年祭登聖山迎祖靈的流程、禁忌與人選，並在地圖標示路線；因林務局路線經過八里灣部落被視為冒犯，改走 11 鄰農路，讓文化學習型遊程形成關係人口。", "k": "關係人口", "d": "與部落建立深度連結的遊客", "g": 2}, {"id": 58, "date": "2021-05-18", "title": "如何進行田野調查", "url": "/2021/05/blog-post_18.html", "island": "I3", "type": "課程", "places": ["比西里岸"], "people": ["林書豪"], "q": "星濱山說的田調三層級裡，內容整理和創意提案的比例是？", "o": ["全部都是內容整理", "地方內容整理約三成，七成在創意提案", "五五平分", "九成整理、一成提案"], "a": 1, "ex": "田調分問題意識、田調架構、應用轉譯三層級，地方內容整理只占 30%，七成在創意提案；公開資料前要先詢問當事人，成果也要回饋採集對象。", "k": "應用轉譯", "d": "田調的第三層級", "g": 2}, {"id": 59, "date": "2020-11-20", "title": "路徑博物館與部落地圖", "url": "/2020/11/blog-post.html", "island": "I5", "type": "課程", "places": ["都蘭", "都歷"], "people": ["歐祥權"], "q": "路徑博物館的操作四步驟是？", "o": ["觀察環境 → 如實記錄 → 路徑串聯 → 遊程全貌", "蓋館舍 → 收藏品 → 辦展覽 → 收門票", "選景點 → 做招牌 → 拍照 → 上網", "買土地 → 蓋步道 → 立雕像 → 剪綵"], "a": 0, "ex": "路徑博物館把博物館概念帶進環境規劃：觀察環境、如實記錄、路徑串聯、遊程全貌；要先充分盤點部落資料，再系統化記錄分類，用「我的地圖」與聰明手冊整理。", "k": "如實記錄", "d": "四步驟的第二步", "g": 2}, {"id": 60, "date": "2020-11-20", "title": "圖資平台運用教學", "url": "/2020/11/blog-post_19.html", "island": "I5", "type": "課程", "places": [], "people": ["郭倩如"], "q": "圖資平台教學中，怎麼做出可以溝通的數位部落地圖？", "o": ["手繪後就鎖在抽屜", "只用口頭描述", "直接用觀光摺頁", "用 Google 我的地圖標點，GPS 路徑匯入 Google Earth 產生高度剖面"], "a": 3, "ex": "因應民眾參與規劃與災害風險，課程教大家用 Google 我的地圖標記點位，用 GPS 記錄路徑匯入 Google Earth 產生高度剖面，必要時用 GIS 套疊圖層，結合族人環境智慧做出可溝通的資料。", "k": "高度剖面", "d": "GPS 路徑匯入後看到的", "g": 2}, {"id": 61, "date": "2020-11-04", "title": "永續旅行準則實務工作坊", "url": "/2020/11/blog-post_3.html", "island": "I2", "type": "工作坊", "places": ["貓公"], "people": ["陳盈潔"], "q": "永續旅行準則實務工作坊，用什麼來推估部落能接待多少遊客？", "o": ["拿去年的人數直接加倍", "看社群按讚數決定", "以解說員人數、床位數等推估承載量", "不設上限，越多越好"], "a": 2, "ex": "工作坊依永續管理、社區經濟、社會文化、生態環境四面向推動社區型旅遊，訂遊客公約、以解說員與床位數推估承載量；帛琉推永續旅遊後遊客少了 24%，年收入卻沒有減少。", "k": "承載量", "d": "能接待的遊客上限", "g": 2}, {"id": 62, "date": "2020-10-26", "title": "部落走讀｜美山部落", "url": "/2020/10/blog-post.html", "island": "I4", "type": "走讀", "places": ["美山"], "people": [], "q": "美山走讀之後，課程說部落藍圖要兼顧哪些面向？", "o": ["只要吸引最多遊客", "資源保育、部落經營需求與遊客動線，讓旅遊者與當地共同獲益", "只看硬體建設", "只照顧外地業者"], "a": 1, "ex": "走讀記錄橘子候車亭、百年榕樹等 10 個觀察點，也看到海灣由沙灘轉為石灘；藍圖要兼顧資源保育、部落經營需求與遊客動線，讓旅遊者與當地共同獲益。", "k": "共同獲益", "d": "旅遊者與當地的目標", "g": 1}, {"id": 63, "date": "2020-10-26", "title": "部落走讀｜麻荖漏部落", "url": "/2020/10/blog-post_26.html", "island": "I4", "type": "走讀", "places": ["麻荖漏"], "people": [], "q": "麻荖漏走讀時，對第二市場想規劃生鮮區提出什麼可行性提醒？", "o": ["現有公車班次與路線恐怕難帶來人潮", "市場太新不需要改", "攤商太多擠不下", "海景不夠漂亮"], "a": 0, "ex": "走讀以大樹見證歷史空間，逐點記錄新港神社、成功故事館與第二市場；第二市場想規劃生鮮販賣區，但現有公車班次與路線恐難帶來人潮。", "k": "公車班次", "d": "第二市場的隱憂", "g": 2}, {"id": 64, "date": "2020-10-26", "title": "部落走讀｜麒麟部落", "url": "/2020/10/blog-post_76.html", "island": "I4", "type": "走讀", "places": ["麒麟"], "people": [], "q": "麒麟走讀時記錄到什麼需要儘快處理的環境問題？", "o": ["停車位不夠", "網路訊號太強", "遊客太少", "通往沙灘的手作步道和一號橋受海浪侵蝕"], "a": 3, "ex": "走讀整理 Ciliksay 等傳統地名與水源名稱；部落只有兩條路通往沙灘，手作步道與昆布海灣一號橋都受海浪侵蝕，需要儘快保護。", "k": "海浪侵蝕", "d": "步道與橋的威脅", "g": 2}, {"id": 65, "date": "2020-10-26", "title": "部落走讀｜東河部落", "url": "/2020/10/blog-post_70.html", "island": "I4", "type": "走讀", "places": ["東河"], "people": [], "q": "東河走讀主要用什麼方法盤點文化資源？", "o": ["只看網路介紹", "請遊客填問卷", "依環境盤點逐點記錄，並由族人口述歷史", "空拍一張照片就好"], "a": 2, "ex": "走讀依環境盤點逐一記錄馬武窟祠、東河國小與舊東河橋，並由族人口述歷史；馬武窟溪的成年禮原本游五圈，現在改為三圈。", "k": "口述歷史", "d": "族人說的過去", "g": 2}, {"id": 66, "date": "2020-10-26", "title": "部落走讀｜隆昌部落", "url": "/2020/10/blog-post_17.html", "island": "I4", "type": "走讀", "places": ["隆昌"], "people": [], "q": "隆昌七里溪遊程構想，走讀後發現哪些要先解決的問題？", "o": ["溪水太乾淨", "入口周邊是私人土地要和地主協調，深入後沒有收訊、緊急處理待討論", "遊客太守規矩", "路線太平坦"], "a": 1, "ex": "構想是遊客停車在部落、再接駁到秘境入口步行七里溪；但入口周邊都是私人土地需與地主協調，深入後沒有收訊，緊急狀況處理還待探討。", "k": "地主", "d": "入口土地的主人", "g": 2}, {"id": 67, "date": "2020-10-26", "title": "部落走讀｜貓公部落", "url": "/2020/10/blog-post_23.html", "island": "I4", "type": "走讀", "places": ["貓公"], "people": [], "q": "貓公走讀後，對規劃「早期阿美族生活風貌區」提出什麼建議？", "o": ["先設定並記錄目標客群，固定經營時間與路線、補足休息設施", "越大越好，先把園區蓋滿", "不必想客人是誰", "路線每天隨機變換"], "a": 0, "ex": "構想以河濱公園打造縮小版早期阿美族生活風貌區；建議先設定目標客群並記錄客群組成，遊客動線要有固定經營時間與路線，導覽沿途也要增設休息設施。", "k": "目標客群", "d": "遊程先想清楚要給誰", "g": 2}, {"id": 68, "date": "2020-10-26", "title": "部落走讀｜水璉部落", "url": "/2020/10/blog-post_20.html", "island": "I4", "type": "走讀", "places": ["水璉"], "people": [], "q": "水璉吉籟獵人學校是怎麼組成的？露營區未來由誰管理？", "o": ["由外地公司投資成立", "由學校老師組成", "露營區永遠由公部門自己經營", "老中青三代共同成立；露營區由東管處出資、未來交社區發展協會管理"], "a": 3, "ex": "吉籟獵人學校由老中青三代共同成立，與耆老合作做文化記錄；露營區由東管處出資，未來交由社區發展協會管理，並計畫增設雙語解說牌、補足外語解說人力。", "k": "老中青三代", "d": "吉籟的成員組成", "g": 3}, {"id": 69, "date": "2020-09-28", "title": "深度認識東海岸部落－台東段", "url": "/2020/09/blog-post.html", "island": "I4", "type": "課程", "places": ["東河", "麻荖漏"], "people": [], "q": "深度認識部落時，為什麼要找出部落的組織、議題社群與關係人？", "o": ["為了列黑名單", "為了分配補助金", "才能找到一起參與藍圖討論的夥伴", "為了排座位"], "a": 2, "ex": "部落夥伴從發展史、名稱由來、人口組成、近期事件、組織與議題社群六項主題介紹部落，學長姐也分享部落藍圖 1.0；找出關係人，才能找到參與藍圖討論的夥伴。", "k": "議題社群", "d": "關心同一件事的人群", "g": 3}, {"id": 70, "date": "2020-09-28", "title": "願景行動地圖－部落藍圖之操作實務", "url": "/2020/09/blog-post_28.html", "island": "I5", "type": "工作坊", "places": [], "people": ["劉建億"], "q": "願景行動地圖課程中，社區地圖的四個步驟是？", "o": ["畫圖 → 印刷 → 發送 → 結案", "選定範圍與主題 → 田野調查 → 圖面編繪 → 地圖分享", "找廠商 → 招標 → 施工 → 驗收", "上網找圖 → 剪貼 → 上色 → 交作業"], "a": 1, "ex": "社區地圖四步驟是選定範圍與主題、田野調查、圖面編繪、地圖分享，再用議題疊圖兩兩比對圖層；課程也發現各部落常單打獨鬥，要先找出誰是夥伴。", "k": "地圖分享", "d": "第四步", "g": 2}, {"id": 71, "date": "2020-09-09", "title": "公部門為何需要做參與？", "url": "/2020/09/109-09-09-3.html", "island": "I1", "type": "課程", "places": [], "people": [], "q": "「公部門為何需要做參與？」課程的五個步驟裡，最重要的目標是哪一步？", "o": ["搭橋造路，建立長期溝通的管道", "一次辦完大型說明會", "委託顧問公司全權處理", "把計畫書寫得越完整越好"], "a": 0, "ex": "公部門參與的步驟是轉變概念、調查理解、製造接觸、工作蹲點，最重要的是搭橋造路建立管道；講者說「參與社區之後，才能引導社區參與」。", "k": "搭橋造路", "d": "參與五步驟的最終目標", "g": 1}, {"id": 72, "date": "2020-09-09", "title": "一起來認識「參與式規劃設計」", "url": "/2020/09/109-09-09-2.html", "island": "I1", "type": "課程", "places": [], "people": [], "q": "「參與式規劃設計」的操作順序，哪一個正確？", "o": ["先請設計師畫圖 → 找居民說明 → 施工", "先申請經費 → 再找題目 → 驗收結案", "直接照抄外地成功案例", "資源盤點與田野觀察 → 釐清問題與癥結 → 提出方案 → 共同行動"], "a": 3, "ex": "參與式規劃要納入未來使用者與利害關係人：先做人、文、地、產、景的資源盤點與田野觀察，再釐清問題意識與癥結、提出方案，最後一起共同行動。", "k": "共同行動", "d": "參與式規劃的最後一步", "g": 2}, {"id": 73, "date": "2020-09-09", "title": "東海岸部落觀光規劃歷程與下一步", "url": "/2020/09/109-09-09-1.html", "island": "I1", "type": "課程", "places": [], "people": [], "q": "回顧 94–108 年東海岸部落觀光，為什麼要走向「讓部落自己構思藍圖」？", "o": ["大山大海的景點已全部開發完", "中央規定所有規劃都要外包", "盤點後仍見人力更迭、遊程同質性高，需要部落親自參與構思", "遊客只想看風景、不想認識部落"], "a": 2, "ex": "東海岸觀光由觀賞大山大海轉向體驗部落人文，但 108 年重新盤點 18 個部落後仍見人力更迭、遊程同質性高；所以讓部落夥伴親自構思藍圖，東管處同仁也各自擔任部落窗口。", "k": "部落窗口", "d": "每位同仁負責一個部落", "g": 1}, {"id": 74, "date": "2020-08-31", "title": "部落經營基礎課程1－永續旅行概論", "url": "/2020/08/1.html", "island": "I2", "type": "課程", "places": ["貓公"], "people": ["陳盈潔"], "q": "課堂用黃、紅兩色便利貼盤點觀光影響之後，下一步要做什麼？", "o": ["把紅色便利貼丟掉、只留好處", "盤點重要資源、評估衝擊，並擬定因應策略", "直接擴大宣傳", "交給公部門決定就好"], "a": 1, "ex": "永續旅遊是目標與態度，不是特定遊程；課堂用黃色寫好處、紅色寫不舒服的現象，接著盤點資源、評估衝擊並擬定策略，例如石雨傘旺季採集要讓淡季復育。", "k": "評估衝擊", "d": "盤點資源之後要做的事", "g": 2}, {"id": 75, "date": "2020-08-31", "title": "暖身共識課程1－公私夥伴關係建構", "url": "/2020/08/1_31.html", "island": "I1", "type": "課程", "places": [], "people": ["蕭於勤", "劉建億"], "q": "暖身共識課程對建立公私夥伴關係的建議是？", "o": ["民間先行、政府加碼跟上，先用小型活動觸發合作", "等政府編好預算再開始", "只和首長建立關係就好", "合作條件一次談定、不再調整"], "a": 0, "ex": "課程用破冰遊戲練習帶領與執行的角色，並建議先和公部門基層人員建立關係、用小型活動觸發合作，做到「民間先行、政府加碼跟上」。", "k": "民間先行", "d": "夥伴關係的起手式", "g": 3}, {"id": 76, "date": "2020-08-26", "title": "109年東海岸駐地研究員計畫招募說明會", "url": "/2020/08/109.html", "island": "I1", "type": "說明會", "places": [], "people": [], "q": "109–110 年「駐地研究員 2.0」為什麼被看作地方創生的重要推手？", "o": ["因為他們有權核定工程", "因為他們負責招商引資", "因為他們只在都市辦活動", "透過凝聚、產生、執行部落共識，讓夥伴逐步看見藍圖的整體願景"], "a": 3, "ex": "駐地研究員 2.0 要建立部落永續觀光的實踐方法，從部落地圖發展成部落藍圖；研究員透過凝聚、產生、執行共識，讓夥伴逐步看見整體願景，並遴選六個試做點。", "k": "整體願景", "d": "研究員幫夥伴看見的藍圖全貌", "g": 1}, {"id": 77, "date": "2018-07-25", "title": "培訓課程記錄：部落共同經營產業案例＠貓公部落", "url": "/2018/07/1070628.html", "island": "I8", "type": "課程", "places": ["貓公", "磯崎", "豐富"], "people": ["吳建安", "陳科睿", "陳立年"], "q": "貓公產業參訪後，講者認為部落其實缺的是什麼？", "o": ["缺少大型工廠", "缺少外地投資客", "不是缺產業，而是缺傳承的契機，需要加值創新與異業串連", "缺少更多觀光巴士"], "a": 2, "ex": "貓公長輩示範小米酒、苧麻與織布；講者指出部落並非缺乏產業，而是缺乏傳承的契機，磯崎也在客源流失後回頭思索部落真正想做的事，把長輩視為夥伴而非工作人員。", "k": "傳承的契機", "d": "部落真正缺少的", "g": 1}, {"id": 78, "date": "2018-06-15", "title": "培訓課程記錄：部落地圖與藍圖製作工作坊 Day3", "url": "/2018/07/1070615-day3.html", "island": "I5", "type": "工作坊", "places": [], "people": [], "q": "立體模型工作坊結束後，後續怎麼推進？", "o": ["做完就結案，不再追蹤", "夥伴帶回部落續作，東管處與輔導團隊再約時間討論模型使用計畫與藍圖", "把模型送給遊客", "由公部門收回保管"], "a": 1, "ex": "三天工作坊讓夥伴掌握立體模型製作，未完成的部分帶回部落續作；東管處與行遠團隊再另約時間協助，深入討論每個部落的模型使用計畫與部落藍圖。", "k": "使用計畫", "d": "模型做完要想的事", "g": 2}, {"id": 79, "date": "2018-06-14", "title": "培訓課程記錄：部落地圖與藍圖製作工作坊 Day2", "url": "/2018/07/1070614-day2.html", "island": "I5", "type": "工作坊", "places": [], "people": [], "q": "部落地圖工作坊 Day2 說，社區參與繪製部落地圖，還能推動哪些理念？", "o": ["在地參與、地方分權、環境溝通與自然資源共管", "中央集權、統一規劃", "由專家代為決定", "只追求觀光人數"], "a": 0, "ex": "部落地圖是會說故事的圖，先規劃地名故事、空間、歷史、資源、宇宙觀等分類再逐項累加；它強調在地參與、地方分權、環境溝通與自然資源共管。", "k": "地方分權", "d": "與在地參與並列的理念", "g": 3}, {"id": 80, "date": "2018-06-13", "title": "培訓課程記錄：部落地圖與藍圖製作工作坊 Day1", "url": "/2018/07/1070613-day1.html", "island": "I5", "type": "工作坊", "places": [], "people": [], "q": "縣市國土計畫處理不了部落土地問題時，Day1 課程建議怎麼做？", "o": ["放棄不管", "請財團代為開發", "違規先蓋再說", "由部落聯名向原民會提案擬定特定區域計畫，並培養原住民規劃人員"], "a": 3, "ex": "規劃要評估環境潛勢、地形高程、使用現況與適宜發展區位；若縣市國土計畫層級無法解決，可由部落聯名向原民會提案擬定特定區域計畫，並培養原住民規劃人員。", "k": "特定區域計畫", "d": "鎮西堡與司馬庫斯的例子", "g": 3}, {"id": 81, "date": "2018-06-07", "title": "培訓課程記錄：部落組織（會議）凝聚工作坊", "url": "/2018/07/1070607.html", "island": "I6", "type": "工作坊", "places": ["都蘭", "隆昌", "東河", "土坂", "水璉", "比西里岸", "貓公"], "people": ["蔡政良"], "q": "部落組織凝聚工作坊提出什麼組團隊的方法？", "o": ["只找親戚朋友", "上網公開徵人", "以年齡階級為底蘊整合各組織，用提案練兵、「一薦二、二薦四」找人", "等公部門派人"], "a": 2, "ex": "部落以年齡階級組織為底蘊，整合協進會、社區發展協會與行政體系；以對公部門提案練兵，用「一薦二、二薦四」組團隊，並做到資訊公開、財務透明，因為人是最大的問題。", "k": "一薦二", "d": "找人的滾動方法", "g": 3}, {"id": 82, "date": "2018-05-18", "title": "培訓課程記錄：認識東海岸山海環境資源與景觀管理的法制", "url": "/2018/07/1070518.html", "island": "I5", "type": "課程", "places": [], "people": ["郭倩如"], "q": "規劃藍圖時要懂國土計畫法的「適地、適量、適性」，是為了？", "o": ["為了背法條考試", "依功能分區與海岸管理規定，判斷哪裡能發展、哪些要申請許可", "為了找漏洞避開審查", "法規和藍圖無關"], "a": 1, "ex": "國土計畫法以適地、適量、適性管理土地，劃設國土保育、海洋資源、農業發展、城鄉發展四大功能分區；海岸法規定近岸海域不得獨占使用，重要海岸景觀區內建築超過 10.5 公尺須許可。", "k": "功能分區", "d": "國土保育等四種", "g": 2}, {"id": 83, "date": "
